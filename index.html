async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function randomCode(len = 10) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const arr = crypto.getRandomValues(new Uint8Array(len));
  let out = "";
  for (let i = 0; i < len; i++) out += chars[arr[i] % chars.length];
  return out;
}
function bufToBase64url(buf) {
  const bytes = new Uint8Array(buf);
  let str = "";
  bytes.forEach((b) => (str += String.fromCharCode(b)));
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function base64urlToBuf(b64url) {
  let b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  const str = atob(b64);
  const bytes = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
  return bytes.buffer;
}

function limparCpf(v) { return String(v || "").replace(/\D/g, "").slice(0, 11); }
function formatarCpf(v) {
  const c = limparCpf(v);
  return c.replace(/^(\d{3})(\d)/, "$1.$2").replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d{1,2})$/, ".$1-$2");

function cpfValido(v) {
  const c = limparCpf(v);
  if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
  const dig = (n) => { let s = 0; for (let i = 0; i < n; i++) s += Number(c[i]) * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
  return dig(9) === Number(c[9]) && dig(10) === Number(c[10]);
}

// Helper central: toda llamada a nuestras Functions pasa por acá.
// Agrega el token automáticamente y tira un error legible si el server rechaza.
async function apiFetch(path, opts = {}) {
  const token = await getValidAccessToken();
  if (!token) throw new Error("Sessão expirada. Entre novamente.");
  const headers = { authorization: `Bearer ${token}`, ...(opts.headers || {}) };
  if (opts.body) headers["content-type"] = "application/json";
  const res = await fetch(path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || `Erro ${res.status}`); e.codigo = data.codigo; throw e; }
  // O servidor renovou a sessão (trocou senha/PIN, "Sair de todos os aparelhos"): guarda o token novo.
  if (data.novoToken) { const s = getSession(); if (s) saveSession({ ...s, token: data.novoToken }); }
  return data;
}

// Só aceita arquivo que seja imagem, PDF, Word ou Excel de verdade (S1). Qualquer outra coisa
// (ex.: "javascript:..." ou uma página HTML disfarçada) é tratada como arquivo inexistente.
const TIPOS_ARQUIVO_OK = ["image/jpeg", "image/png", "image/webp", "application/pdf", "application/msword",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/vnd.ms-excel",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "application/octet-stream"];
function arquivoSeguro(f) {
  if (!f || typeof f.dataUrl !== "string") return false;
  const m = f.dataUrl.slice(0, 200).match(/^data:([a-z0-9.+\/-]+);base64,/);
  return !!m && TIPOS_ARQUIVO_OK.includes(m[1]);
}

async function getValidAccessToken() {
  const session = getSession();

}

function compressImage(file, maxWidth = 800, quality = 0.55) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const EXT_IMAGEM = ["jpg", "jpeg", "png", "gif", "webp", "heic", "heif", "bmp", "svg"];
function isImagemDoc(doc) {
  if (doc.tipo && doc.tipo.startsWith("image/")) return true;
  const ext = (doc.nome || "").split(".").pop().toLowerCase();
  return EXT_IMAGEM.includes(ext);
}

// Formatos permitidos en Documentos: planos (PDF), administrativo (Word/Excel), fotos.
// Nada de video: es justo lo que más pesa el bandwidth sin aportar tanto valor acá.
const TIPO_MIME_DOC = {
  "application/pdf": "pdf",
  "application/msword": "word",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document": "word",
  "application/vnd.ms-excel": "excel",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": "excel",
  "image/jpeg": "imagem",
  "image/png": "imagem",
};
const TIPO_EXT_DOC = { pdf: "pdf", doc: "word", docx: "word", xls: "excel", xlsx: "excel", jpg: "imagem", jpeg: "imagem", png: "imagem" };
function categoriaDoc(doc) {
  if (doc.tipo && TIPO_MIME_DOC[doc.tipo]) return TIPO_MIME_DOC[doc.tipo];
  const ext = (doc.nome || "").split(".").pop().toLowerCase();
  return TIPO_EXT_DOC[ext] || "outro";
}
const ICONE_DOC = { pdf: "📕", word: "📘", excel: "📗", outro: "📄" };

function EtapaFotosGaleria({ etapaId, fileCache, loadFile, onViewImage, onAddFoto, onDeleteFoto, podeEditar, saveArquivo }) {
  const [fotos, setFotos] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [erro, setErro] = useState("");
  const inputRef = useRef(null);      // 📷 câmera
  const galeriaRef = useRef(null);    // 🖼 galeria (várias de uma vez)
  const [progresso, setProgresso] = useState("");

  const carregar = async () => {
    try {
      const r = await apiFetch(`/api/etapa-fotos?etapa_id=${etapaId}`);
      setFotos(r.fotos);
    } catch (err) {
      setFotos([]);
    }
  };

  useEffect(() => { carregar(); }, [etapaId]);

  // Câmera ou galeria: cada foto é reduzida no celular (800 px, ~100 KB) antes de enviar — economiza dados
  // e apaga a localização (GPS) da foto. Da galeria dá para escolher várias; vão uma por uma.
  const handleAdd = async (e) => {
    const arquivos = [...(e.target.files || [])].filter((f) => f.type.startsWith("image/")).slice(0, 10);
    e.target.value = "";
    if (!arquivos.length) return;
    setUploading(true);
    setErro("");
    let feitas = 0;
    for (const file of arquivos) {
      if (arquivos.length > 1) setProgresso(`${feitas + 1}/${arquivos.length}`);
      try {
        const dataUrl = await compressImage(file);
        const fotoId = novoIdArquivo();
        const ok = await saveArquivo(fotoId, { nome: "avanco.jpg", tipo: "image/jpeg", dataUrl });
        if (ok !== true) { setErro(`Não foi possível salvar: ${ok?.erro || "erro desconhecido"}`); break; }
        await onAddFoto(etapaId, fotoId);
        feitas++;
      } catch (err) { setErro(err.message); break; }
    }
    await carregar();
    setProgresso("");
    setUploading(false);
  };

  const handleDelete = async (fotoRowId) => {
    if (!window.confirm("Apagar esta foto?")) return;
    try { await onDeleteFoto(fotoRowId); await carregar(); } catch (err) { setErro(err.message); }
  };

  if (fotos === null) return null;

  return (
    <div className="mt-2">
      <div className="flex items-center gap-2 flex-wrap">
        {fotos.map((f) => (
          <div key={f.id} className="relative">
            <Thumbnail fotoId={f.arquivo_id} fileCache={fileCache} loadFile={loadFile} onView={onViewImage} />
            {podeEditar && (
              <button onClick={() => handleDelete(f.id)} style={{ background: C.rust }} className="absolute -top-1.5 -right-1.5 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center shadow">×</button>
            )}
          </div>
        ))}
        {podeEditar && (
          <>
            <input ref={inputRef} type="file" accept="image/*" capture="environment" onChange={handleAdd} className="hidden" />
            <input ref={galeriaRef} type="file" accept="image/*" multiple onChange={handleAdd} className="hidden" />
            {uploading ? (
              <div style={{ borderColor: C.border, color: C.inkMuted }} className="w-16 h-16 border-2 border-dashed rounded shrink-0 flex items-center justify-center text-xs font-mono">{progresso || "…"}</div>
            ) : (<>
              <button onClick={() => inputRef.current?.click()} title="Tirar foto" aria-label="Tirar foto com a câmera" style={{ borderColor: C.border, color: C.inkMuted }} className="w-16 h-16 border-2 border-dashed rounded shrink-0 flex flex-col items-center justify-center text-xl leading-none"><span>📷</span><span className="text-[9px] font-mono uppercase mt-1">Câmera</span></button>
              <button onClick={() => galeriaRef.current?.click()} title="Escolher da galeria" aria-label="Escolher fotos da galeria" style={{ borderColor: C.border, color: C.inkMuted }} className="w-16 h-16 border-2 border-dashed rounded shrink-0 flex flex-col items-center justify-center text-xl leading-none"><span>🖼</span><span className="text-[9px] font-mono uppercase mt-1">Galeria</span></button>
            </>)}
          </>
        )}
      </div>
      {erro && <p style={{ color: C.rust }} className="text-[11px] font-mono mt-1">{erro}</p>}
    </div>
  );
}

function Thumbnail({ fotoId, fileCache, loadFile, onView }) {
  useEffect(() => { if (!fileCache[fotoId]) loadFile(fotoId); }, [fotoId]);
  const file = fileCache[fotoId];
  if (file === "MISSING") return <div title="Foto não encontrada (falha ao salvar)" style={{ background: C.bg, borderColor: C.rust, color: C.rust }} className="w-16 h-16 rounded border-2 border-dashed shrink-0 flex items-center justify-center text-lg">⚠</div>;
  if (!file) return <div style={{ background: C.border }} className="w-16 h-16 rounded animate-pulse shrink-0" />;
  return <img src={file.dataUrl} alt="" onClick={() => onView && onView(file.dataUrl)} className="w-16 h-16 object-cover rounded border shrink-0 cursor-pointer active:opacity-70" style={{ borderColor: C.border }} />;
}

function DocumentosSection({ obraId, documentos, onAdd, onDelete, fileCache, loadFile, saveArquivo, onViewImage, podeEditar = true }) {
  const inputRef = useRef(null);
  const [uploading, setUploading] = useState(false);
  const [erro, setErro] = useState("");
  const [pdfAberto, setPdfAberto] = useState(null);
  const list = documentos;

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const categoria = categoriaDoc({ tipo: file.type, nome: file.name });
    if (categoria === "outro") {
      setErro("Formato não suportado. Apenas PDF, Word (.doc/.docx), Excel (.xls/.xlsx), JPG ou PNG.");
      e.target.value = "";
      return;
    }
    if (file.size > 4.5 * 1024 * 1024) {
      alert("O arquivo é muito grande (máx ~4MB).");
      e.target.value = "";
      return;
    }
    setErro("");
    setUploading(true);
    try {
      const dataUrl = await fileToDataURL(file);
      const arquivoId = novoIdArquivo();
      const ok = await saveArquivo(arquivoId, { nome: file.name, tipo: file.type, dataUrl });
      if (ok === true) {
        await onAdd({ obraId, nome: file.name, tipo: file.type, arquivoId });
      } else {
        alert(`Não foi possível salvar o arquivo: ${ok?.erro || "erro desconhecido"}`);
      }
    } catch (err) {
      setErro(err.message || "Não foi possível processar o arquivo.");
    }
    setUploading(false);
    e.target.value = "";
  };

  useEffect(() => { list.forEach((d) => { if (!fileCache[d.arquivo_id]) loadFile(d.arquivo_id); }); }, [obraId, list.map((d) => d.arquivo_id).join(",")]);

  const download = (doc) => {
    const f = fileCache[doc.arquivo_id];
    if (!f || f === "MISSING") return;
    const a = document.createElement("a");
    a.href = f.dataUrl;
    a.download = doc.nome;
    a.click();
  };

  const abrir = (doc) => {
    const f = fileCache[doc.arquivo_id];
    if (!f || f === "MISSING") return;
    const categoria = categoriaDoc(doc);
    if (categoria === "imagem") onViewImage(f.dataUrl);
    else if (categoria === "pdf") setPdfAberto({ src: f.dataUrl, nome: doc.nome });
    else download(doc);
  };

  const remover = async (doc) => {
    setErro("");
    try {
      await onDelete(doc.id, doc.arquivo_id);
    } catch (err) {
      setErro(err.message);
    }
  };

  return (
    <div>
      <div className="grid grid-cols-3 gap-2 mb-3">
        {list.map((d) => {
          const categoria = categoriaDoc(d);
          const f = fileCache[d.arquivo_id];
          const faltando = f === "MISSING";
          return (
            <div key={d.id} className="relative flex flex-col items-center gap-1">
              <button onClick={() => abrir(d)} disabled={faltando} style={{ background: C.bg, borderColor: faltando ? C.rust : C.border }} className="w-full aspect-square border rounded-lg overflow-hidden flex items-center justify-center disabled:opacity-60">
                {categoria === "imagem" && f && !faltando ? (
                  <img src={f.dataUrl} className="w-full h-full object-cover" />
                ) : (
                  <span className="text-3xl">{faltando ? "⚠" : ICONE_DOC[categoria]}</span>
                )}
              </button>
              {podeEditar && (
                <button onClick={() => remover(d)} style={{ background: C.rust }} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full flex items-center justify-center text-white text-xs leading-none shadow">×</button>
              )}
              <span style={{ color: faltando ? C.rust : C.inkMuted }} className="text-[10px] font-mono text-center truncate w-full px-0.5">{d.nome}{faltando ? " (indisp.)" : ""}</span>
            </div>
          );
        })}
        {list.length === 0 && <p style={{ color: C.inkMuted }} className="text-sm font-mono col-span-3">Nenhum documento anexado.</p>}
      </div>
      {!podeEditar && <p style={{ color: C.inkMuted }} className="text-[11px] font-mono">Seu nível de acesso é somente visualização neste módulo.</p>}
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mb-2">{erro}</p>}
      {podeEditar && (
        <>
          <input ref={inputRef} type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,image/jpeg,image/png" onChange={handleFile} className="hidden" />
          <button onClick={() => inputRef.current?.click()} disabled={uploading} style={{ background: C.ink }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2 disabled:opacity-50">
            + {uploading ? "Enviando..." : "Adicionar projeto"}
          </button>
          <p style={{ color: C.inkMuted }} className="text-[10px] font-mono mt-1.5">PDF, Word, Excel, JPG ou PNG — até 4MB.</p>
        </>
      )}
      {pdfAberto && <PdfViewer src={pdfAberto.src} nome={pdfAberto.nome} onClose={() => setPdfAberto(null)} />}
    </div>
  );
}

function EquipeSection({ obraId, equipe, onAdd, onRemove, onToggleHoje, onSetExcecao, usuarioRank, usuarioId, usuarioNome, donoPrincipal = false, responsavelId, podeEditar = true }) {
  const souResponsavel = usuarioId != null && usuarioId === responsavelId;
  // Hierarquia (05/10): superior estrito; entre dois Donos, o principal fica acima.
  const souSuperiorDe = (m) => m.usuario_id !== usuarioId && (usuarioRank < m.rank || (usuarioRank === 1 && m.rank === 1 && donoPrincipal));
  const possoMudarRanks = [1, 2, 4].includes(usuarioRank);
  const [email, setEmail] = useState("");
  const [funcao, setFuncao] = useState("");
  const [rank, setRank] = useState(usuarioRank + 1 <= 8 ? usuarioRank + 1 : 8);
  const [erro, setErro] = useState("");
  const [msg, setMsg] = useState("");
  const [salvando, setSalvando] = useState(false);
  const [excecaoAberta, setExcecaoAberta] = useState(null);
  const [modoAdd, setModoAdd] = useState("link"); // "link" (WhatsApp) | "email"
  const [nomeNovo, setNomeNovo] = useState("");
  const [telNovo, setTelNovo] = useState("");
  const [linkGerado, setLinkGerado] = useState(null); // { link, nome, telefone, novoPin }
  const [genteEmpresa, setGenteEmpresa] = useState(null); // pra "Da empresa"
  const [pessoaEscolhida, setPessoaEscolhida] = useState("");
  const [edicao, setEdicao] = useState({ rank: 8, funcao: "" }); // painel ⚙
  const list = equipe;
  const hoje = todayISO();
  const funcoesHistoricas = [...new Set([...FUNCOES, ...equipe.map((m) => m.funcao).filter(Boolean)])];
  const ranksDisponiveis = [1, 2, 3, 4, 5, 6, 7, 8].filter((r) => r > usuarioRank || (r === 1 && usuarioRank === 1 && donoPrincipal));

  const submit = async () => {
    if (!email.trim()) return;
    setErro(""); setMsg(""); setSalvando(true);
    try {
      const r = await onAdd({ obraId, email: email.trim(), rank, funcao: funcao.trim() });
      if (r.convite && r.token) {
        setLinkGerado({ link: linkDoConvite(r.token), nome: email.trim().split("@")[0], telefone: "", novoPin: false });
        setMsg("Ainda não tem conta: mande o link abaixo (ou ele entra com o Google usando esse email).");
      } else {
        setMsg(r.convite ? `Convite criado para ${email.trim()}.` : "Adicionado.");
      }
      setEmail(""); setFuncao("");
    } catch (err) {
      setErro(err.message);
    }
    setSalvando(false);
  };

  const convidarPorLink = async () => {
    if (!nomeNovo.trim()) return;
    setErro(""); setMsg(""); setSalvando(true);
    try {
      const r = await apiFetch("/api/convite-link", { method: "POST", body: JSON.stringify({ obraId, nome: nomeNovo.trim(), telefone: telNovo, rank, funcao: funcao.trim() }) });
      setLinkGerado({ link: linkDoConvite(r.token), nome: nomeNovo.trim(), telefone: telNovo, novoPin: false });
      setNomeNovo(""); setTelNovo(""); setFuncao("");
    } catch (err) {
      setErro(err.message);
    }
    setSalvando(false);
  };

  const gerarNovoPin = async (m, cpf) => {
    setErro(""); setMsg("");
    try {
      const r = await apiFetch("/api/convite-link", { method: "POST", body: JSON.stringify({ usuarioId: m.usuario_id, cpf }) });
      setLinkGerado({ link: linkDoConvite(r.token), nome: m.nome, telefone: r.convite.telefone || "", novoPin: true });
    } catch (err) {
      // Pessoa sem CPF na conta: o link só vale para o CPF que o chefe informar (segurança).
      if (err.codigo === "precisa_cpf") {
        const digitado = window.prompt(`${err.message}\n\nCPF de ${m.nome}:`, cpf || "");
        if (digitado) return gerarNovoPin(m, digitado);
        return;
      }
      setErro(err.message);
    }
  };

  const remover = async (m) => {
    setErro("");
    try { await onRemove(m.id); } catch (err) { setErro(err.message); }
  };

  const marcarPresenca = async (m) => {
    setErro("");
    try { await onToggleHoje(m.id, hoje); } catch (err) { setErro(err.message); }
  };

  const toggleBloqueio = async (m, moduloKey) => {
    setErro("");
    const atual = m.excecao_modulos || {};
    const bloqueado = atual[moduloKey] === "nenhum";
    const novo = { ...atual };
    if (bloqueado) delete novo[moduloKey];
    else novo[moduloKey] = "nenhum";
    try { await onSetExcecao(m.id, { excecaoModulos: Object.keys(novo).length > 0 ? novo : null }); } catch (err) { setErro(err.message); }
  };

  const abrirPainel = (m) => {
    if (excecaoAberta === m.id) { setExcecaoAberta(null); return; }
    setEdicao({ rank: m.rank, funcao: m.funcao || "" });
    setExcecaoAberta(m.id);
  };

  const excluirConta = async (m) => {
    if (window.prompt(`Excluir a conta de ${m.nome}? Ele não vai mais conseguir entrar, os dados pessoais dele são apagados e os registros dele ficam como "Usuário removido". Digite EXCLUIR para confirmar.`) !== "EXCLUIR") return;
    setErro(""); setMsg("");
    try {
      await apiFetch(`/api/usuarios-me?id=${m.usuario_id}`, { method: "DELETE" });
      await onSetExcecao(m.id, {}); // PATCH vazio: só recarrega o integrante (agora com removido_em)
      setExcecaoAberta(null);
      setMsg(`Conta de ${m.nome} excluída.`);
    } catch (err) { setErro(err.message); }
  };

  const salvarMembro = async (m) => {
    setErro(""); setMsg("");
    const campos = { funcao: edicao.funcao };
    if (possoMudarRanks && souSuperiorDe(m) && m.rank !== 1 && Number(edicao.rank) !== m.rank) campos.rank = Number(edicao.rank);
    try { await onSetExcecao(m.id, campos); setMsg(`${m.nome} atualizado.`); setExcecaoAberta(null); }
    catch (err) { setErro(err.message); }
  };

  const escolherModo = async (modo) => {
    setModoAdd(modo);
    if (modo === "empresa") {
      try { const r = await apiFetch("/api/equipe"); setGenteEmpresa(r.equipe); }
      catch (err) { setErro(err.message); }
    }
  };

  const adicionarDaEmpresa = async () => {
    if (!pessoaEscolhida) return;
    const p = (genteEmpresa || []).find((x) => String(x.usuario_id) === String(pessoaEscolhida));
    setErro(""); setMsg(""); setSalvando(true);
    try {
      await onAdd({ obraId, usuarioId: Number(pessoaEscolhida), funcao: funcao.trim() });
      setMsg(`${p ? p.nome : "Pessoa"} adicionado à obra.`);
      setPessoaEscolhida(""); setFuncao("");
    } catch (err) { setErro(err.message); }
    setSalvando(false);
  };

  return (
    <div>
      <div className="space-y-2 mb-3">
        {list.map((m) => {
          const presenteHoje = m.asistencias?.includes(hoje);
          const anotacaoHoje = m.presencas_por?.[hoje] || null;
          // Presença: cada um a sua; um superior com "editar" só ANOTA (e só desfaz o que foi anotado, não o que a pessoa marcou).
          const podeMarcar = m.usuario_id === usuarioId || (podeEditar && souSuperiorDe(m) && (!presenteHoje || !!anotacaoHoje));
          const temExcecao = m.excecao_modulos && Object.keys(m.excecao_modulos).length > 0;
          const ausente = !!m.removido_em;
          if (ausente) {
            return (
              <div key={m.id} style={{ background: C.bg, borderColor: C.border, opacity: 0.6 }} className="border rounded px-3 py-2 flex items-center gap-2">
                <div className="flex-1 min-w-0 truncate">
                  <span style={{ color: C.inkMuted }} className="font-semibold text-sm italic">Usuário removido</span>
                  <div style={{ color: C.inkMuted }} className="text-[11px] font-mono truncate">conta excluída · {RANK_LABELS[m.rank]}</div>
                </div>
                <span style={{ color: C.inkMuted }} className="text-xs font-mono shrink-0">{m.asistencias?.length || 0}d</span>
                {podeEditar && souSuperiorDe(m) && <button onClick={() => remover(m)} title="Tirar da lista desta obra" style={{ color: C.inkMuted }} className="shrink-0">×</button>}
              </div>
            );
          }
          return (
            <div key={m.id} style={{ background: C.bg, borderColor: C.border }} className="border rounded px-3 py-2">
              <div className="flex items-center gap-2">
                <button onClick={() => podeMarcar && marcarPresenca(m)} disabled={!podeMarcar} aria-label={presenteHoje ? "Presente hoje" : "Ausente hoje"} title={m.usuario_id === usuarioId ? "Marcar minha presença hoje" : anotacaoHoje ? `Presente — anotada por ${anotacaoHoje.nome}` : presenteHoje ? "Presente — marcada pela própria pessoa" : podeMarcar ? "Ausente — toque para marcar presente (fica registrado que foi você)" : "Ausente"} style={{ borderColor: presenteHoje ? C.green : C.rust, background: presenteHoje ? C.green : "transparent", color: presenteHoje ? "#fff" : C.rust }} className="w-6 h-6 border-2 rounded-full flex items-center justify-center shrink-0 text-xs font-bold">
                  {presenteHoje ? "✓" : "✕"}
                </button>
                <div className="flex-1 min-w-0 truncate">
                  {/* Título: o rank. Para Profissional, o ofício (Pedreiro, Pintor...) quando informado. */}
                  <span style={{ color: C.ink }} className="font-semibold text-sm">{m.nome}</span> <span style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">· {m.rank === 8 && m.funcao ? m.funcao : RANK_LABELS[m.rank]}</span>
                  <div style={{ color: C.inkMuted }} className="text-[11px] font-mono truncate">{m.rank === 8 ? (m.funcao ? `${RANK_LABELS[8]} · ` : "") : (m.funcao ? `${m.funcao} · ` : "")}{m.email || (m.usuario_id === usuarioId || souSuperiorDe(m) ? "entra com CPF" : "")}{temExcecao ? " · acesso personalizado" : ""}{anotacaoHoje ? ` · presença anotada por ${anotacaoHoje.nome}` : ""}</div>
                </div>
                <span style={{ color: C.inkMuted }} className="text-xs font-mono shrink-0">{m.asistencias?.length || 0}d</span>
                {podeEditar && <button onClick={() => abrirPainel(m)} style={{ color: temExcecao ? C.amber : C.inkMuted }} title="Editar rank, função e acesso" className="shrink-0">⚙</button>}
                {podeEditar && usuarioRank <= 2 && m.rank > usuarioRank && <button onClick={() => gerarNovoPin(m)} title="Novo PIN (manda link por WhatsApp)" style={{ color: C.inkMuted }} className="shrink-0">🔑</button>}
                {podeEditar && souSuperiorDe(m) && m.usuario_id !== responsavelId && <button onClick={() => remover(m)} title="Tirar desta obra" style={{ color: C.inkMuted }} className="shrink-0">×</button>}
              </div>
              {excecaoAberta === m.id && (
                <div style={{ borderColor: C.border }} className="mt-2 pt-2 border-t">
                  {(possoMudarRanks && souSuperiorDe(m) && m.rank !== 1) || (souResponsavel && souSuperiorDe(m)) ? (
                    <div className="mb-3">
                      <div className="flex flex-wrap gap-2 items-center">
                        <select value={edicao.rank} disabled={!possoMudarRanks || m.rank === 1} onChange={(e) => setEdicao({ ...edicao, rank: Number(e.target.value) })} style={{ borderColor: C.border, color: C.ink }} className="border rounded px-1 py-1.5 text-xs outline-none bg-white">
                          {[...new Set([m.rank, ...ranksDisponiveis])].sort((a, b) => a - b).map((r) => <option key={r} value={r}>{RANK_LABELS[r]}{r === 1 ? " (co-Dono)" : ""}</option>)}
                        </select>
                        <input value={edicao.funcao} onChange={(e) => setEdicao({ ...edicao, funcao: e.target.value })} placeholder={edicao.rank === 8 ? "Ofício (ex.: Pedreiro)" : "Função nesta obra"} list="funcoes-equipe" style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-[7rem] border rounded px-2 py-1.5 text-xs outline-none" />
                        <button onClick={() => salvarMembro(m)} style={{ background: C.teal }} className="text-white rounded px-3 py-1.5 text-xs font-bold uppercase">Salvar</button>
                      </div>
                      <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mt-1">O rank vale para todas as obras; a função, só para esta.</p>
                    </div>
                  ) : (
                    <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mb-2">{m.rank === 1 ? "Mudar ou excluir um Dono é feito pelo suporte (suporte@gestaoecontrole.app.br)." : "Só Dono, Engenheiro Chefe e Mestre de Obra mudam o rank, e só de quem está abaixo deles."}</p>
                  )}
                  {souResponsavel && souSuperiorDe(m) ? (<>
                  <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mb-1.5">Bloquear acesso NESTA obra a (você é o responsável):</p>
                  <div className="flex flex-wrap gap-2">
                    {MODULOS_OBRA.map((mod) => {
                      const bloqueado = m.excecao_modulos?.[mod.key] === "nenhum";
                      return (
                        <button key={mod.key} onClick={() => toggleBloqueio(m, mod.key)} style={{ borderColor: bloqueado ? C.rust : C.border, background: bloqueado ? C.rust : "transparent", color: bloqueado ? "#fff" : C.inkMuted }} className="border rounded px-2 py-1 text-[11px] font-mono">
                          {mod.glyph} {mod.label}
                        </button>
                      );
                    })}
                  </div>
                  </>) : (
                    <p style={{ color: C.inkMuted }} className="text-[11px] font-mono">Só o responsável da obra bloqueia módulos nesta obra.</p>
                  )}
                  {usuarioRank < m.rank && m.usuario_id !== usuarioId && (
                    <button onClick={() => excluirConta(m)} style={{ color: C.rust }} className="mt-3 text-[11px] font-mono uppercase">🚫 Excluir conta (os registros ficam como "Usuário removido")</button>
                  )}
                </div>
              )}
            </div>
          );
        })}
        {list.length === 0 && <p style={{ color: C.inkMuted }} className="text-sm font-mono">Sem equipe atribuída.</p>}
      </div>
      {!podeEditar && <p style={{ color: C.inkMuted }} className="text-[11px] font-mono">Seu nível de acesso é somente visualização neste módulo.</p>}
      {podeEditar && (
        <>
          <div className="flex mb-2">
            <button onClick={() => escolherModo("link")} style={{ background: modoAdd === "link" ? C.teal : "transparent", color: modoAdd === "link" ? "#fff" : C.inkMuted, borderColor: C.teal }} className="flex-1 border rounded-l py-1.5 text-[11px] font-bold uppercase">📲 Novo por link</button>
            <button onClick={() => escolherModo("empresa")} style={{ background: modoAdd === "empresa" ? C.teal : "transparent", color: modoAdd === "empresa" ? "#fff" : C.inkMuted, borderColor: C.teal }} className="flex-1 border-y py-1.5 text-[11px] font-bold uppercase">👥 Da empresa</button>
            <button onClick={() => escolherModo("email")} style={{ background: modoAdd === "email" ? C.teal : "transparent", color: modoAdd === "email" ? "#fff" : C.inkMuted, borderColor: C.teal }} className="flex-1 border rounded-r py-1.5 text-[11px] font-bold uppercase">✉ Por email</button>
          </div>
          {modoAdd === "link" && (
            <div className="flex flex-wrap gap-2 mb-2">
              <input value={nomeNovo} onChange={(e) => setNomeNovo(e.target.value)} placeholder="Nome" style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-[8rem] border rounded px-3 py-1.5 text-sm outline-none" />
              <input value={telNovo} onChange={(e) => setTelNovo(e.target.value)} placeholder="WhatsApp (opcional)" inputMode="tel" style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-[8rem] border rounded px-3 py-1.5 text-sm outline-none" />
            </div>
          )}
          {modoAdd === "empresa" && (
            <div className="flex flex-wrap gap-2 mb-2">
              <select value={pessoaEscolhida} onChange={(e) => setPessoaEscolhida(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-2 py-1.5 text-sm outline-none bg-white">
                <option value="">{genteEmpresa ? "Escolha a pessoa..." : "Carregando..."}</option>
                {(genteEmpresa || []).filter((p) => !list.some((m) => m.usuario_id === p.usuario_id) && (usuarioRank <= 2 || p.rank > usuarioRank)).map((p) => (
                  <option key={p.usuario_id} value={p.usuario_id}>{p.nome} · {RANK_LABELS[p.rank]}</option>
                ))}
              </select>
              <input value={funcao} onChange={(e) => setFuncao(e.target.value)} placeholder="Função" list="funcoes-equipe" style={{ borderColor: C.border, color: C.ink }} className="border rounded px-2 py-1.5 text-xs outline-none w-28 shrink-0" />
              <button onClick={adicionarDaEmpresa} disabled={!pessoaEscolhida || salvando} style={{ background: C.teal }} className="text-white rounded px-3 text-xs font-bold uppercase disabled:opacity-40 shrink-0">Adicionar</button>
            </div>
          )}
          {modoAdd !== "empresa" && <div className="flex flex-wrap gap-2">
            {modoAdd === "email" && <input value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="email@exemplo.com" style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-3 py-1.5 text-sm outline-none" />}
            <input value={funcao} onChange={(e) => setFuncao(e.target.value)} placeholder={rank === 8 ? "Ofício (ex.: Pedreiro)" : "Função (opcional)"} list="funcoes-equipe" style={{ borderColor: C.border, color: C.ink }} className="border rounded px-2 py-1.5 text-xs outline-none w-28 shrink-0" />
            <select value={rank} onChange={(e) => setRank(Number(e.target.value))} style={{ borderColor: C.border, color: C.ink }} className="border rounded px-1 py-1.5 text-xs outline-none bg-white shrink-0">
              {ranksDisponiveis.map((r) => <option key={r} value={r}>{RANK_LABELS[r]}</option>)}
            </select>
            <datalist id="funcoes-equipe">{funcoesHistoricas.map((f) => <option key={f} value={f} />)}</datalist>
            {modoAdd === "email"
              ? <button onClick={submit} disabled={!email.trim() || salvando} style={{ background: C.teal }} className="text-white rounded px-3 disabled:opacity-40 shrink-0">+</button>
              : <button onClick={convidarPorLink} disabled={!nomeNovo.trim() || salvando} style={{ background: C.teal }} className="text-white rounded px-3 text-xs font-bold uppercase disabled:opacity-40 shrink-0">{salvando ? "..." : "Gerar link"}</button>}
          </div>}
          {modoAdd !== "empresa" && <p style={{ color: C.amber }} className="text-[11px] font-mono mt-1.5">→ {RANK_LABELS[rank]} · {RANK_DESCRICOES[rank]}</p>}
          <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mt-1">{modoAdd === "link" ? "Gera um link para mandar por WhatsApp. A pessoa entra com CPF + PIN, sem precisar de email." : modoAdd === "empresa" ? "Quem já tem conta na empresa (inclusive com CPF). Mantém o rank que já tem." : "Se o email ainda não tem conta, gera um link de convite."}</p>
          {linkGerado && <LinkConviteCard {...linkGerado} onFechar={() => setLinkGerado(null)} />}
        </>
      )}
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-1">{erro}</p>}
      {msg && <p style={{ color: C.green }} className="text-xs font-mono mt-1">{msg}</p>}
    </div>
  );
}

function Lightbox({ src, onClose }) {
  return (
    <div onClick={onClose} className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-[100]">
      <img src={src} className="max-w-full max-h-full rounded shadow-2xl" onClick={(e) => e.stopPropagation()} />
      <button onClick={onClose} className="absolute top-4 right-4 text-white text-3xl leading-none">×</button>
    </div>
  );
}

function PdfViewer({ src, nome, onClose }) {
  return (
    <div className="fixed inset-0 bg-black/85 flex flex-col z-[100]">
      <div style={{ background: C.surface, borderColor: C.border }} className="flex items-center justify-between px-4 py-3 border-b">
        <span style={{ color: C.ink }} className="text-sm font-bold truncate flex-1 pr-2">{nome}</span>
        <button onClick={onClose} style={{ color: C.ink }} className="text-2xl leading-none px-1">×</button>
      </div>
      <iframe src={src} title={nome} className="flex-1 w-full border-0" style={{ background: "#fff" }} />
    </div>
  );
}

function EtapaNode({ etapa, allEtapas, depth, onToggle, onRemove, onAddSub, onEditEtapa, fileCache, loadFile, saveArquivo, onViewImage, onAddFoto, onDeleteFoto, nomesHistoricos = [], podeEditar = true }) {
  const [openSub, setOpenSub] = useState(false);
  const [editando, setEditando] = useState(false);
  const [nomeEdit, setNomeEdit] = useState(etapa.texto);
  const [novoSub, setNovoSub] = useState("");
  const [erro, setErro] = useState("");
  const inputRef = useRef(null);
  const filhos = allEtapas.filter((e) => e.parent_id === etapa.id);
  const temFilhos = filhos.length > 0;

  const salvarNome = async () => {
    if (nomeEdit.trim() && nomeEdit.trim() !== etapa.texto) {
      try { await onEditEtapa(etapa.id, nomeEdit.trim()); } catch (err) { setErro(err.message); setNomeEdit(etapa.texto); }
    } else setNomeEdit(etapa.texto);
    setEditando(false);
  };

  const toggleSimples = async () => {
    if (!podeEditar) return;
    setErro("");
    try { await onToggle(etapa.id, !etapa.concluida); } catch (err) { setErro(err.message); }
  };

  const addSub = async () => {
    if (!novoSub.trim()) return;
    setErro("");
    try { await onAddSub(etapa.id, novoSub.trim()); setNovoSub(""); } catch (err) { setErro(err.message); }
  };

  const removerEtapa = async () => {
    setErro("");
    try { await onRemove(etapa.id); } catch (err) { setErro(err.message); }
  };

  return (
    <div style={{ marginLeft: depth * 14 }}>
      <div style={{ borderColor: C.border, background: C.bg }} className="border rounded-md p-2.5 mb-2">
        <div className="flex items-center gap-1.5">
          <button onClick={toggleSimples} disabled={!podeEditar} style={{ borderColor: etapa.concluida ? C.green : C.border, background: etapa.concluida ? C.green : "transparent" }} className="w-4 h-4 border-2 rounded flex items-center justify-center shrink-0 text-white text-[10px] disabled:opacity-60">{etapa.concluida ? "✓" : ""}</button>
          <button onClick={() => setOpenSub(!openSub)} title="Subetapas" className="shrink-0">{temFilhos ? (openSub ? "📂" : "📁") : "📄"}</button>
          {editando ? (
            <input value={nomeEdit} onChange={(e) => setNomeEdit(e.target.value)} onKeyDown={(e) => e.key === "Enter" && salvarNome()} onBlur={salvarNome} autoFocus style={{ borderColor: C.border, color: C.ink, background: C.surface }} className="flex-1 min-w-0 border rounded px-2 py-0.5 text-sm outline-none" />
          ) : (
            <span style={{ color: etapa.concluida ? C.inkMuted : C.ink, textDecoration: etapa.concluida ? "line-through" : "none" }} className="text-sm flex-1 min-w-0 truncate">{etapa.texto}</span>
          )}
          {temFilhos && <span style={{ color: C.inkMuted }} className="text-[10px] font-mono shrink-0">{filhos.filter((f) => f.concluida).length}/{filhos.length}</span>}
          {podeEditar && !editando && <button onClick={() => { setNomeEdit(etapa.texto); setEditando(true); }} style={{ color: C.inkMuted }} className="shrink-0">✎</button>}
          {podeEditar && <button onClick={removerEtapa} style={{ color: C.rust }} className="shrink-0">🗑</button>}
        </div>
        {etapa.concluida && etapa.concluida_em && (
          <p style={{ color: C.green }} className="text-[11px] font-mono mt-1">✓ {etapa.concluida_por_nome ? `por ${etapa.concluida_por_nome} · ` : ""}{fmtFirma(etapa.concluida_em)}</p>
        )}
        <EtapaFotosGaleria etapaId={etapa.id} fileCache={fileCache} loadFile={loadFile} onViewImage={onViewImage} onAddFoto={onAddFoto} onDeleteFoto={onDeleteFoto} podeEditar={podeEditar} saveArquivo={saveArquivo} />
        {erro && <p style={{ color: C.rust }} className="text-[11px] font-mono mt-1">{erro}</p>}
      </div>

      {openSub && (
        <div style={{ borderLeft: `2px dashed ${C.border}`, marginLeft: 8 }} className="pl-2 mb-2">
          {filhos.map((f) => (
            <EtapaNode key={f.id} etapa={f} allEtapas={allEtapas} depth={0} onToggle={onToggle} onRemove={onRemove} onAddSub={onAddSub} onEditEtapa={onEditEtapa} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={onViewImage} onAddFoto={onAddFoto} onDeleteFoto={onDeleteFoto} nomesHistoricos={nomesHistoricos} podeEditar={podeEditar} />
          ))}
          {podeEditar && (
            <div className="flex gap-2 mb-2">
              <input value={novoSub} onChange={(e) => setNovoSub(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addSub()} placeholder="Nova subetapa" list="nomes-etapas" style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-3 py-1.5 text-sm outline-none" />
              <button onClick={addSub} disabled={!novoSub.trim()} style={{ background: C.teal }} className="text-white rounded px-3 disabled:opacity-40 shrink-0">+</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function EtapasSection({ obraId, etapas, onAdd, onToggle, onRemove, onEditEtapa, fileCache, loadFile, saveArquivo, onViewImage, onAddFoto, onDeleteFoto, podeEditar = true }) {
  const [texto, setTexto] = useState("");
  const [erro, setErro] = useState("");
  const raiz = etapas.filter((e) => !e.parent_id);
  const nomesHistoricos = [...new Set(etapas.map((e) => e.texto).filter(Boolean))];

  const submit = async () => {
    if (!texto.trim()) return;
    setErro("");
    try { await onAdd(null, texto.trim()); setTexto(""); } catch (err) { setErro(err.message); }
  };

  return (
    <div>
      <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mb-2">📁 abre subetapas · ✎ edita nome · 📷 câmera ou 🖼 galeria adicionam fotos de avanço.</p>
      <div className="mb-3">
        {raiz.map((e) => (
          <EtapaNode key={e.id} etapa={e} allEtapas={etapas} depth={0} onToggle={onToggle} onRemove={onRemove} onAddSub={onAdd} onEditEtapa={onEditEtapa} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={onViewImage} onAddFoto={onAddFoto} onDeleteFoto={onDeleteFoto} nomesHistoricos={nomesHistoricos} podeEditar={podeEditar} />
        ))}
        {raiz.length === 0 && <p style={{ color: C.inkMuted }} className="text-sm font-mono">Sem etapas cadastradas.</p>}
      </div>
      {!podeEditar && <p style={{ color: C.inkMuted }} className="text-[11px] font-mono">Seu nível de acesso é somente visualização neste módulo.</p>}
      {podeEditar && (
        <div className="flex gap-2">
          <input value={texto} onChange={(e) => setTexto(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="Ex: instalação elétrica" list="nomes-etapas" style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-3 py-1.5 text-sm outline-none" />
          <datalist id="nomes-etapas">{nomesHistoricos.map((n) => <option key={n} value={n} />)}</datalist>
          <button onClick={submit} disabled={!texto.trim()} style={{ background: C.ink }} className="text-white rounded px-3 disabled:opacity-40 shrink-0">+</button>
        </div>
      )}
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-1">{erro}</p>}
    </div>
  );
}

// Pedidos e entregas (05/10): pedido → "pendente"; quem fornece entrega → "aguardando";
// quem recebe confirma → "atendido" (ou contesta → volta a "pendente"). Uma entrega direta já nasce "aguardando".
// Pedir e confirmar: nível "receber" ou "editar". Entregar direto: "editar".
const ORDEM_NIVEL = { nenhum: 0, visualizar: 1, receber: 2, editar: 3 };
function PedidosPanel({ obraId, tipo, tipoLabel, equipe, usuarioAPI, nivel = "editar" }) {
  const [pedidos, setPedidos] = useState(null);
  const [mostrarForm, setMostrarForm] = useState(null); // "pedir" | "entregar" | null
  const [descricao, setDescricao] = useState("");
  const [quantidade, setQuantidade] = useState("");
  const [pessoaId, setPessoaId] = useState("");
  const [erro, setErro] = useState("");
  const [salvando, setSalvando] = useState(false);
  const podePedir = ORDEM_NIVEL[nivel] >= 2;
  const podeEntregar = nivel === "editar";

  const carregar = async () => {
    try {
      const r = await apiFetch(`/api/pedidos?obra_id=${obraId}`);
      setPedidos(r.pedidos.filter((p) => p.tipo === tipo));
    } catch (e) { setPedidos([]); }
  };
  useEffect(() => { carregar(); }, [obraId, tipo]);

  const superiores = equipe.filter((m) => !m.removido_em && m.rank < usuarioAPI.rank);
  const subordinados = equipe.filter((m) => !m.removido_em && m.rank > usuarioAPI.rank);

  const abrirForm = (qual) => {
    setMostrarForm(qual);
    setDescricao(""); setQuantidade(""); setPessoaId(""); setErro("");
  };

  const enviar = async () => {
    if (!descricao.trim() || !pessoaId) { setErro("Preencha a descrição e escolha a pessoa."); return; }
    setSalvando(true);
    setErro("");
    try {
      const remetenteId = mostrarForm === "pedir" ? pessoaId : usuarioAPI.id;
      const destinatarioId = mostrarForm === "pedir" ? usuarioAPI.id : pessoaId;
      await apiFetch("/api/pedidos", { method: "POST", body: JSON.stringify({ obraId, tipo, descricao: descricao.trim(), quantidade: quantidade.trim(), remetenteId, destinatarioId }) });
      setMostrarForm(null);
      await carregar();
    } catch (err) { setErro(err.message); }
    setSalvando(false);
  };

  const responder = async (id, status) => {
    setErro("");
    try { await apiFetch(`/api/pedidos?id=${id}`, { method: "PATCH", body: JSON.stringify({ status }) }); await carregar(); } catch (e) { setErro(e.message); }
  };

  const cancelar = async (id) => {
    if (!window.confirm("Cancelar este pedido?")) return;
    setErro("");
    try { await apiFetch(`/api/pedidos?id=${id}`, { method: "DELETE" }); await carregar(); } catch (e) { setErro(e.message); }
  };

  if (pedidos === null) return null;

  const paraEntregar = pedidos.filter((p) => p.remetente_id === usuarioAPI.id && p.status === "pendente");
  const paraConfirmar = pedidos.filter((p) => p.destinatario_id === usuarioAPI.id && p.status === "aguardando");
  const destaque = new Set([...paraEntregar, ...paraConfirmar].map((p) => p.id));
  const historico = pedidos.filter((p) => !destaque.has(p.id)).slice(0, 10);
  const SIMBOLO = { atendido: "✓", recusado: "✕", aguardando: "🚚", pendente: "…" };
  const LEGENDA = { atendido: "recebido", recusado: "recusado", aguardando: "entregue · falta confirmar", pendente: "pedido · aguardando entrega" };
  const fmtData = (ts) => new Date(ts).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });

  return (
    <div style={{ borderColor: C.border, background: C.surface }} className="border rounded-md p-3 mb-4">
      <p style={{ color: C.ink }} className="text-xs font-extrabold uppercase tracking-wide mb-2">📋 Pedidos de {tipoLabel}</p>

      {paraEntregar.length > 0 && (
        <div className="mb-3 space-y-2">
          {paraEntregar.map((p) => (
            <div key={p.id} style={{ borderColor: C.amber, background: C.bg }} className="border rounded p-2">
              <p style={{ color: C.ink }} className="text-sm"><b>{p.destinatario_nome}</b> pediu: {p.descricao}{p.quantidade ? ` (${p.quantidade})` : ""}</p>
              <div className="flex gap-2 mt-1.5">
                <button onClick={() => responder(p.id, "entregue")} style={{ background: C.green }} className="text-white text-[11px] font-bold uppercase rounded px-2 py-1">🚚 Entreguei</button>
                <button onClick={() => responder(p.id, "recusado")} style={{ color: C.rust, borderColor: C.rust }} className="border text-[11px] font-bold uppercase rounded px-2 py-1">Recusar</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {paraConfirmar.length > 0 && (
        <div className="mb-3 space-y-2">
          {paraConfirmar.map((p) => (
            <div key={p.id} style={{ borderColor: C.green, background: C.bg }} className="border rounded p-2">
              <p style={{ color: C.ink }} className="text-sm"><b>{p.remetente_nome}</b> entregou para você: {p.descricao}{p.quantidade ? ` (${p.quantidade})` : ""}</p>
              {podePedir ? (
                <div className="flex gap-2 mt-1.5">
                  <button onClick={() => responder(p.id, "atendido")} style={{ background: C.green }} className="text-white text-[11px] font-bold uppercase rounded px-2 py-1">✓ Recebi</button>
                  <button onClick={() => responder(p.id, "contestar")} style={{ color: C.rust, borderColor: C.rust }} className="border text-[11px] font-bold uppercase rounded px-2 py-1">Não recebi</button>
                </div>
              ) : <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mt-1">Seu nível neste módulo é só visualizar.</p>}
            </div>
          ))}
        </div>
      )}

      {mostrarForm ? (
        <div style={{ borderColor: C.border }} className="border rounded p-2 mb-2">
          <p style={{ color: C.inkMuted }} className="text-[11px] font-mono uppercase mb-1.5">{mostrarForm === "pedir" ? "Pedir a alguém acima" : "Entregar a alguém abaixo (ele confirma que recebeu)"}</p>
          <select value={pessoaId} onChange={(e) => setPessoaId(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-2 py-1.5 text-sm outline-none bg-white mb-1.5">
            <option value="">{mostrarForm === "pedir" ? "Pedir a quem?" : "Entregar a quem?"}</option>
            {(mostrarForm === "pedir" ? superiores : subordinados).map((m) => <option key={m.usuario_id} value={m.usuario_id}>{m.nome} ({RANK_LABELS[m.rank]})</option>)}
          </select>
          <input value={descricao} onChange={(e) => setDescricao(e.target.value)} placeholder={tipo === "material" ? "Ex: cimento" : tipo === "ferramenta" ? "Ex: furadeira" : "Ex: planta baixa"} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-2 py-1.5 text-sm outline-none mb-1.5" />
          {tipo !== "documento" && (
            <input value={quantidade} onChange={(e) => setQuantidade(e.target.value)} placeholder="Quantidade (opcional)" style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-2 py-1.5 text-sm outline-none mb-1.5" />
          )}
          <div className="flex gap-2">
            <button onClick={enviar} disabled={salvando} style={{ background: C.amber }} className="text-white text-xs font-bold uppercase rounded px-3 py-1.5 disabled:opacity-50">{salvando ? "..." : "Confirmar"}</button>
            <button onClick={() => setMostrarForm(null)} style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Cancelar</button>
          </div>
        </div>
      ) : (
        <div className="flex gap-2 mb-2">
          {podePedir && superiores.length > 0 && <button onClick={() => abrirForm("pedir")} style={{ borderColor: C.border, color: C.ink }} className="border rounded px-3 py-1.5 text-xs font-mono uppercase">+ Pedir</button>}
          {podeEntregar && subordinados.length > 0 && <button onClick={() => abrirForm("entregar")} style={{ borderColor: C.border, color: C.ink }} className="border rounded px-3 py-1.5 text-xs font-mono uppercase">+ Entregar</button>}
        </div>
      )}
      {erro && <p style={{ color: C.rust }} className="text-[11px] font-mono mb-1.5">{erro}</p>}

      {historico.length > 0 && (
        <div style={{ borderColor: C.border }} className="mt-2 pt-2 border-t space-y-1.5">
          <p style={{ color: C.inkMuted }} className="text-[10px] font-mono uppercase tracking-wide">Histórico</p>
          {historico.map((p) => (
            <div key={p.id} className="flex items-start justify-between gap-2">
              <div className="min-w-0">
                <p style={{ color: C.ink }} className="text-xs truncate">{SIMBOLO[p.status] || "…"} {p.descricao}{p.quantidade ? ` (${p.quantidade})` : ""}</p>
                <p style={{ color: C.inkMuted }} className="text-[10px] font-mono truncate">
                  <span style={{ color: p.status === "atendido" ? C.green : p.status === "recusado" ? C.rust : C.amber }} className="font-bold uppercase">{LEGENDA[p.status]}</span>
                  {" · "}{p.remetente_nome} → {p.destinatario_nome}{(p.atendido_em || p.entregue_em || p.criado_em) ? ` · ${fmtData(p.atendido_em || p.entregue_em || p.criado_em)}` : ""}
                </p>
              </div>
              {(p.criado_por === usuarioAPI.id || p.rank_autor > usuarioAPI.rank) && ["pendente", "aguardando"].includes(p.status) && (
                <button onClick={() => cancelar(p.id)} style={{ color: C.rust }} className="text-[11px] shrink-0">cancelar</button>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// --- Observações: "livro de obra" com firma, edição só do autor (com histórico) e apagar só superiores ---
const fmtFirma = (ts) => (ts ? new Date(ts).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "");

function ObservacoesSection({ items, onAdd, onDelete, onEdit, usuarioAPI, podeEditar = true }) {
  const [texto, setTexto] = useState("");
  const [erro, setErro] = useState("");
  const [salvando, setSalvando] = useState(false);
  const [editandoId, setEditandoId] = useState(null);
  const [textoEdicao, setTextoEdicao] = useState("");
  const [historico, setHistorico] = useState({}); // { [id]: versoes[] }
  const eu = usuarioAPI || {};

  const registrar = async () => {
    if (!texto.trim()) return;
    setErro(""); setSalvando(true);
    try { await onAdd(texto.trim()); setTexto(""); } catch (err) { setErro(err.message); }
    setSalvando(false);
  };
  const salvarEdicao = async (item) => {
    if (!textoEdicao.trim()) return;
    setErro("");
    try { await onEdit(item.id, textoEdicao.trim()); setEditandoId(null); setHistorico((h) => { const n = { ...h }; delete n[item.id]; return n; }); }
    catch (err) { setErro(err.message); }
  };
  const apagar = async (item) => {
    if (!window.confirm("Apagar esta observação? Não pode ser desfeito.")) return;
    setErro("");
    try { await onDelete(item.id); } catch (err) { setErro(err.message); }
  };
  const alternarHistorico = async (item) => {
    if (historico[item.id]) { setHistorico((h) => { const n = { ...h }; delete n[item.id]; return n; }); return; }
    setErro("");
    try { const r = await apiFetch(`/api/observacoes?historico=${item.id}`); setHistorico((h) => ({ ...h, [item.id]: r.versoes })); }
    catch (err) { setErro(err.message); }
  };

  return (
    <div>
      {podeEditar && (
        <div className="mb-4">
          <textarea value={texto} onChange={(e) => setTexto(e.target.value)} rows={3} placeholder="Aviso, sugestão, reclamação... Ex.: Pedreiro, ATENÇÃO às tubulações existentes de água e eletricidade." style={{ borderColor: C.border, color: C.ink, background: C.surface }} className="w-full border rounded px-3 py-2 text-sm outline-none resize-y" />
          <button onClick={registrar} disabled={!texto.trim() || salvando} style={{ background: C.teal }} className="w-full mt-1 text-white font-bold uppercase tracking-wide text-sm rounded py-2 disabled:opacity-40">{salvando ? "Registrando..." : "📝 Registrar no livro"}</button>
        </div>
      )}
      {!podeEditar && <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mb-3">Seu nível de acesso é somente visualização neste módulo.</p>}
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mb-2">{erro}</p>}
      <div className="space-y-2">
        {items.map((item) => {
          const souAutor = item.criado_por === eu.id;
          // Protege pelo rank que o autor tinha ao escrever (05/10). Entre Donos, o principal fica acima.
          const rankAutor = item.rank_autor ?? item.autor_rank_atual;
          const souSuperior = !souAutor && rankAutor != null && (eu.rank < rankAutor || (eu.rank === 1 && rankAutor === 1 && !!eu.dono_principal));
          const rankNaFirma = item.rank_autor ?? item.autor_rank_atual;
          return (
            <div key={item.id} style={{ background: C.surface, borderLeftColor: C.teal }} className="border-l-4 rounded-r-md p-3 shadow-sm">
              {editandoId === item.id ? (
                <div>
                  <textarea value={textoEdicao} onChange={(e) => setTextoEdicao(e.target.value)} rows={3} style={{ borderColor: C.border, color: C.ink, background: C.bg }} className="w-full border rounded px-2 py-1.5 text-sm outline-none resize-y" autoFocus />
                  <div className="flex gap-2 mt-1">
                    <button onClick={() => setEditandoId(null)} style={{ borderColor: C.border, color: C.ink }} className="flex-1 border rounded py-1.5 text-xs font-bold uppercase">Cancelar</button>
                    <button onClick={() => salvarEdicao(item)} disabled={!textoEdicao.trim()} style={{ background: C.teal }} className="flex-1 text-white rounded py-1.5 text-xs font-bold uppercase disabled:opacity-40">Salvar</button>
                  </div>
                  <p style={{ color: C.inkMuted }} className="text-[10px] font-mono mt-1">A versão anterior fica guardada (visível só pra você e seus superiores).</p>
                </div>
              ) : (
                <p style={{ color: C.ink }} className="text-sm whitespace-pre-wrap">{item.texto}</p>
              )}
              <div className="flex items-center gap-3 mt-2 flex-wrap">
                <p style={{ color: C.inkMuted }} className="text-[11px] font-mono flex-1 min-w-0">
                  — {item.autor_removido ? "Usuário removido" : (item.autor_nome || "?")}{rankNaFirma ? ` · ${RANK_LABELS[rankNaFirma]}` : ""} · {fmtFirma(item.criado_em)}
                  {item.editado_em && <span className="italic"> · editado {fmtFirma(item.editado_em)}</span>}
                </p>
                {item.n_edicoes > 0 && (souAutor || souSuperior) && (
                  <button onClick={() => alternarHistorico(item)} style={{ color: C.blue }} className="text-[11px] font-mono shrink-0">🕘 {historico[item.id] ? "ocultar" : `versões (${item.n_edicoes})`}</button>
                )}
                {souAutor && editandoId !== item.id && (
                  <button onClick={() => { setEditandoId(item.id); setTextoEdicao(item.texto); }} title="Editar (só o autor)" className="shrink-0">✏️</button>
                )}
                {souSuperior && !souAutor && (
                  <button onClick={() => apagar(item)} title="Apagar (só superiores do autor)" style={{ color: C.rust }} className="shrink-0">🗑</button>
                )}
                {souSuperior && souAutor && eu.rank === 1 && (
                  <button onClick={() => apagar(item)} title="Apagar" style={{ color: C.rust }} className="shrink-0">🗑</button>
                )}
              </div>
              {historico[item.id] && (
                <div style={{ borderColor: C.border }} className="mt-2 pt-2 border-t space-y-1.5">
                  {historico[item.id].map((v, i) => (
                    <div key={i}>
                      <p style={{ color: C.inkMuted }} className="text-xs whitespace-pre-wrap line-through decoration-1">{v.texto}</p>
                      <p style={{ color: C.inkMuted }} className="text-[10px] font-mono">substituído em {fmtFirma(v.substituido_em)}</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
        {items.length === 0 && <p style={{ color: C.inkMuted }} className="text-sm font-mono">Nada registrado ainda.</p>}
      </div>
    </div>
  );
}

function ListaSimplesSection({ items, onAdd, onDelete, placeholder, color, glyph, datalistId, podeEditar = true, textoSemEdicao = "Seu nível de acesso é somente visualização neste módulo." }) {
  const [texto, setTexto] = useState("");
  const [erro, setErro] = useState("");
  const historico = [...new Set(items.map((i) => i.texto).filter(Boolean))];

  const submit = async () => {
    if (!texto.trim()) return;
    setErro("");
    try { await onAdd(texto.trim()); setTexto(""); } catch (err) { setErro(err.message); }
  };
  const remover = async (item) => {
    setErro("");
    try { await onDelete(item.id); } catch (err) { setErro(err.message); }
  };

  return (
    <div>
      <div className="space-y-2 mb-3">
        {items.map((item) => (

// --- Ajuda: o conteúdo vem do servidor (src/lib/ajuda-conhecimento.js), mesma fonte do assistente ---
let ajudaCache = null;
async function carregarAjuda() {
  if (!ajudaCache) ajudaCache = apiFetch("/api/ajuda").catch((e) => { ajudaCache = null; throw e; });
  return ajudaCache;
}

// Texto simples com **negrito** e quebras de linha (respostas do assistente e seções)
function TextoAjuda({ texto }) {
  return (
    <div style={{ color: C.ink }} className="text-sm whitespace-pre-wrap leading-relaxed">
      {String(texto || "").split(/(\*\*[^*]+\*\*)/g).map((p, i) => p.startsWith("**") && p.endsWith("**") ? <b key={i}>{p.slice(2, -2)}</b> : <span key={i}>{p}</span>)}
    </div>
  );
}

// "?" no topo de cada gaveta: mostra a seção do manual daquele módulo
function AjudaModulo({ modulo }) {
  const [aberto, setAberto] = useState(false);
  const [secao, setSecao] = useState(null);
  const abrir = async () => {
    if (aberto) { setAberto(false); return; }
    setAberto(true);
    if (!secao) { try { const r = await carregarAjuda(); setSecao(r.secoes.find((x) => x.modulo === modulo) || null); } catch (e) {} }
  };
  return (
    <>
      <button onClick={abrir} title="Ajuda desta gaveta" style={{ borderColor: C.border, color: C.inkMuted }} className="ml-auto w-7 h-7 border rounded-full text-sm font-bold shrink-0">?</button>
      {aberto && (
        <div style={{ background: C.surface, borderColor: C.amber }} className="basis-full border-l-4 rounded-r p-3 mt-2 text-left normal-case tracking-normal font-normal">
          {secao ? <TextoAjuda texto={secao.texto} /> : <p style={{ color: C.inkMuted }} className="text-xs font-mono">Carregando...</p>}
          <button onClick={() => setAberto(false)} style={{ color: C.inkMuted }} className="text-[11px] font-mono uppercase mt-2">Fechar</button>
        </div>
      )}
    </>
  );
}

function AjudaScreen({ usuarioAPI, onVerApresentacao }) {
  const [dados, setDados] = useState(null);
  const [erro, setErro] = useState("");
  const [conversa, setConversa] = useState([]); // [{role, content}]
  const [pergunta, setPergunta] = useState("");
  const [pensando, setPensando] = useState(false);
  const [aberta, setAberta] = useState(null);
  const fimRef = useRef(null);

  useEffect(() => { carregarAjuda().then(setDados).catch((e) => setErro(e.message)); }, []);
  useEffect(() => { fimRef.current?.scrollIntoView({ behavior: "smooth", block: "nearest" }); }, [conversa, pensando]);

  const perguntar = async (texto) => {
    const t = String(texto || "").trim();
    if (!t || pensando) return;
    setPergunta(""); setErro("");
    const historico = conversa.slice(-4);
    setConversa((c) => [...c, { role: "user", content: t }]);
    setPensando(true);
    try {
      const r = await apiFetch("/api/ajuda", { method: "POST", body: JSON.stringify({ pergunta: t, historico }) });
      setConversa((c) => [...c, { role: "assistant", content: r.resposta }]);
    } catch (e) {
      setConversa((c) => [...c, { role: "assistant", content: e.message, erro: true }]);
    }
    setPensando(false);
  };

  if (erro && !dados) return <p style={{ color: C.rust }} className="text-sm font-mono text-center py-16">{erro}</p>;
  if (!dados) return <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-16">Carregando...</p>;

  const primeiro = (usuarioAPI.nome || "").split(" ")[0];
  const secoesOrdenadas = [...dados.secoes].sort((a, b) => (b.para === dados.grupo) - (a.para === dados.grupo));

  return (
    <div>
      <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mb-1">❓ Ajuda</h2>
      <p style={{ color: C.inkMuted }} className="text-xs font-mono mb-3">Olá, {primeiro}! Você é <b>{RANK_LABELS[usuarioAPI.rank]}</b>.</p>
      <a href="/manual" target="_blank" rel="noopener" style={{ borderColor: C.border, color: C.ink, background: C.surface }} className="w-full border rounded-md px-3 py-2.5 mb-4 text-sm font-mono flex items-center gap-3">
        <span className="text-base leading-none">📘</span><span className="flex-1">Manual completo <span style={{ color: C.inkMuted }}>(ler, imprimir ou salvar em PDF)</span></span>
      </a>
      {onVerApresentacao && (
        <button onClick={onVerApresentacao} style={{ borderColor: C.border, color: C.ink, background: C.surface }} className="w-full border rounded-md px-3 py-2.5 -mt-2 mb-4 text-sm font-mono flex items-center gap-3 text-left">
          <span className="text-base leading-none">🎞</span><span className="flex-1">Ver apresentação <span style={{ color: C.inkMuted }}>(o passo a passo do começo)</span></span>
        </button>
      )}

      {dados.assistente && (
        <div style={{ background: C.surface, borderColor: C.border }} className="border rounded-md p-3 mb-5">
          <p style={{ color: C.ink }} className="font-bold text-sm mb-2">💬 Pergunte ao G&C</p>
          <div className="space-y-2 mb-2">
            {conversa.length === 0 && (
              <div className="flex flex-wrap gap-2">
                {dados.sugestoes.map((q) => (
                  <button key={q} onClick={() => perguntar(q)} style={{ borderColor: C.teal, color: C.teal }} className="border rounded-full px-3 py-1 text-xs text-left">{q}</button>
                ))}
              </div>
            )}
            {conversa.map((m, i) => (
              <div key={i} className={m.role === "user" ? "flex justify-end" : "flex"}>
                <div style={{ background: m.role === "user" ? C.teal : C.bg, color: m.role === "user" ? "#fff" : C.ink, borderColor: m.erro ? C.rust : C.border }} className={`max-w-[85%] rounded-lg px-3 py-2 ${m.role === "user" ? "" : "border"}`}>
                  {m.role === "user" ? <span className="text-sm">{m.content}</span> : <TextoAjuda texto={m.content} />}
                </div>
              </div>
            ))}
            {pensando && <p style={{ color: C.inkMuted }} className="text-xs font-mono">G&C está pensando...</p>}
            <div ref={fimRef} />
          </div>
          <div className="flex gap-2">

function Apresentacao({ usuarioAPI, onFim }) {
  const slides = slidesApresentacao(usuarioAPI);
  const [i, setI] = useState(0);
  const [arraste, setArraste] = useState(0);
  const toque = useRef(null);
  const ultimo = i === slides.length - 1;
  const ir = (n) => setI(Math.max(0, Math.min(slides.length - 1, n)));
  useEffect(() => {
    const tecla = (e) => { if (e.key === "ArrowRight") ir(i + 1); else if (e.key === "ArrowLeft") ir(i - 1); };
    window.addEventListener("keydown", tecla);
    return () => window.removeEventListener("keydown", tecla);
  });
  const inicio = (e) => { const t = e.touches[0]; toque.current = { x: t.clientX, y: t.clientY, horizontal: null }; };
  const mover = (e) => {
    const c = toque.current; if (!c) return;
    const t = e.touches[0]; const dx = t.clientX - c.x, dy = t.clientY - c.y;
    if (c.horizontal === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) c.horizontal = Math.abs(dx) > Math.abs(dy);
    if (c.horizontal) setArraste(dx);
  };
  const fim = () => {
    const c = toque.current; toque.current = null;
    if (c && c.horizontal) { if (arraste < -50) ir(i + 1); else if (arraste > 50) ir(i - 1); }
    setArraste(0);
  };
  return (
    <div style={{ background: C.bg, color: C.ink }} className="fixed inset-0 z-50 flex flex-col select-none" role="dialog" aria-label="Apresentação do G&C">
      <div className="flex justify-end p-3" style={{ paddingTop: "max(12px, env(safe-area-inset-top))" }}>
        {!ultimo && <button onClick={onFim} style={{ color: C.inkMuted }} className="font-bold uppercase tracking-wide text-sm px-3 py-2">Pular ›</button>}
        {ultimo && <span className="py-2 text-sm">&nbsp;</span>}
      </div>
      <div className="flex-1 overflow-hidden" onTouchStart={inicio} onTouchMove={mover} onTouchEnd={fim} onTouchCancel={fim}>
        <div className="flex h-full" style={{ transform: `translateX(calc(${-i * 100}% + ${arraste}px))`, transition: arraste ? "none" : "transform 0.3s ease" }}>
          {slides.map((s, k) => (
            <div key={k} className="w-full h-full shrink-0 flex flex-col items-center justify-center px-8 text-center" aria-hidden={k !== i}>
              <div className="mb-6 flex items-center justify-center" style={{ minHeight: "10rem" }}>{s.arte}</div>
              <h2 className="font-comic text-3xl tracking-wide mb-3">{s.titulo}</h2>
              <p style={{ color: C.inkMuted }} className="text-base leading-relaxed max-w-sm">{s.texto}</p>
            </div>
          ))}
        </div>
      </div>
      <div className="px-6 pb-6" style={{ paddingBottom: "max(24px, env(safe-area-inset-bottom))" }}>
        <div className="flex justify-center gap-2 mb-5">
          {slides.map((_, k) => (
            <button key={k} onClick={() => ir(k)} aria-label={`Ir para ${k + 1}`} style={{ background: k === i ? C.amber : C.border, width: k === i ? 22 : 8 }} className="h-2 rounded-full transition-all" />
          ))}
        </div>
        <div className="flex items-center gap-3">
          <button onClick={() => ir(i - 1)} disabled={i === 0} style={{ borderColor: C.border, color: C.ink }} className="border rounded-md w-14 py-3 text-xl font-bold disabled:opacity-0" aria-label="Anterior">‹</button>
          {ultimo
            ? <button onClick={onFim} style={{ background: C.amber }} className="flex-1 text-white font-bold uppercase tracking-wide rounded-md py-3">Começar</button>
            : <button onClick={() => ir(i + 1)} style={{ background: C.ink, color: C.bg }} className="flex-1 font-bold uppercase tracking-wide rounded-md py-3">Próximo ›</button>}
        </div>
      </div>
    </div>
  );
}

// ---------- Barra "INSTALAR APLICATIVO" (só no navegador; some quando o app está instalado) ----------
const appInstalado = () => { try { return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; } catch (e) { return false; } };
const ehIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
function BarraInstalar() {
  const [evento, setEvento] = useState(() => window.__gcInstalar || null);
  const [instalado, setInstalado] = useState(appInstalado);
  const [dialogo, setDialogo] = useState(null); // "instalando" | "ios"
  useEffect(() => {
    const pronto = () => setEvento(window.__gcInstalar || null);
    const feito = () => { setEvento(null); setDialogo("instalando"); };
    window.addEventListener("gc-instalavel", pronto);
    window.addEventListener("gc-instalado", feito);
    return () => { window.removeEventListener("gc-instalavel", pronto); window.removeEventListener("gc-instalado", feito); };
  }, []);
  const instalar = async () => {
    if (evento) {
      try {
        evento.prompt();
        const r = await evento.userChoice;
        if (r && r.outcome === "accepted") { setEvento(null); window.__gcInstalar = null; setDialogo("instalando"); }
      } catch (e) {}
    } else if (ehIOS()) setDialogo("ios");
  };
  const mostrarBarra = !instalado && (evento || ehIOS());
  return (
    <>
      {mostrarBarra && (
        <button onClick={instalar} className="gc-barra-instalar sticky top-0 z-[60] w-full text-white font-extrabold uppercase tracking-widest text-xs py-1.5 shadow" style={{ letterSpacing: "0.12em" }}>
          📲 Instalar aplicativo
        </button>
      )}
      {dialogo && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[250]" onClick={() => setDialogo(null)}>
          <div style={{ background: C.surface }} className="rounded-lg p-6 w-full max-w-sm shadow-xl text-center" onClick={(e) => e.stopPropagation()}>
            {dialogo === "instalando" ? (<>
              <img src="icon-192.png" alt="" className="w-16 h-16 mx-auto rounded-2xl shadow mb-3" />
              <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mb-2">Instalação em andamento</h2>
              <p style={{ color: C.ink }} className="text-sm mb-3">Verifique sua <b>tela de início</b>: o ícone do G&C vai aparecer lá em alguns segundos.</p>
              <p style={{ color: C.inkMuted }} className="text-xs mb-4">Se ele aparecer só na lista de aplicativos, mantenha o dedo sobre o ícone e arraste para a tela de início.</p>
            </>) : (<>
              <img src="icon-192.png" alt="" className="w-16 h-16 mx-auto rounded-2xl shadow mb-3" />
              <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mb-2">Instalar no iPhone</h2>
              <p style={{ color: C.ink }} className="text-sm mb-1">1. Toque em <b>Compartilhar</b> (o quadrado com a seta ⬆️) na barra do Safari.</p>
              <p style={{ color: C.ink }} className="text-sm mb-1">2. Escolha <b>Adicionar à Tela de Início</b>.</p>
              <p style={{ color: C.ink }} className="text-sm mb-4">3. Toque em <b>Adicionar</b>.</p>
            </>)}
            <button onClick={() => { setDialogo(null); if (appInstalado()) setInstalado(true); }} style={{ background: C.amber }} className="w-full text-white font-bold uppercase tracking-wide rounded py-2.5">Entendi</button>
          </div>
        </div>
      )}
    </>
  );
}

  { key: "equipe", label: "Equipe" }, { key: "obra", label: "Estado da obra" },
];
const CADEIA_AVISOS = [1, 2, 4, 5, 7, 8];
const POS_AVISOS = { 1: 1, 2: 2, 3: 2.5, 4: 3, 5: 4, 6: 3.5, 7: 5, 8: 6 };
const MODULO_DO_AVISO = { etapas: "etapas", fotos: "etapas", materiais: "materiais", ferramentas: "ferramentas", documentos: "documentos", observacoes: "observacoes", equipe: "equipe" };
function tempoAtras(ts) {
  const min = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  if (min < 1) return "agora";
  if (min < 60) return `há ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `há ${h} h`;
  return new Date(ts).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", timeZone: "America/Sao_Paulo" });
}

// ---------- 📱 Notificações push no celular ----------
const pushSuportado = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function chaveParaBytes(b64) {
  const s = b64.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(s + "===".slice((s.length + 3) % 4));
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
}
async function estadoPush() {
  if (!pushSuportado()) return "sem-suporte";
  if (Notification.permission === "denied") return "negado";
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && (await reg.pushManager.getSubscription());
    return sub && Notification.permission === "granted" ? "ativo" : "inativo";
  } catch (e) { return "inativo"; }
}
async function ativarPush() {
  if (!pushSuportado()) throw new Error(ehIOS() ? "No iPhone, primeiro instale o app (Compartilhar → Adicionar à Tela de Início) e abra pelo ícone." : "Este navegador não aceita notificações. Use o Chrome.");
  if (ehIOS() && !appInstalado()) throw new Error("No iPhone, primeiro instale o app (Compartilhar → Adicionar à Tela de Início) e abra pelo ícone.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("Você não permitiu as notificações. Para ligar depois: cadeado ao lado do endereço → Notificações → Permitir.");
  const reg = await navigator.serviceWorker.ready;
  const { publicKey } = await apiFetch("/api/push");
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chaveParaBytes(publicKey) });
  await apiFetch("/api/push", { method: "POST", body: JSON.stringify({ subscription: sub.toJSON() }) });
  await apiFetch("/api/push", { method: "POST", body: JSON.stringify({ teste: true }) }).catch(() => {});
}
async function desativarPush() {
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg && (await reg.pushManager.getSubscription());
  if (sub) {
    await apiFetch("/api/push", { method: "DELETE", body: JSON.stringify({ endpoint: sub.endpoint }) }).catch(() => {});
    await sub.unsubscribe().catch(() => {});
  }
}
function BotaoPush({ compacto = false }) {
  const [estado, setEstado] = useState(null);
  const [msg, setMsg] = useState("");
  const [ocupado, setOcupado] = useState(false);
  useEffect(() => { estadoPush().then(setEstado); }, []);
  if (estado === null || estado === "sem-suporte" && !ehIOS()) return null;
  const ligar = async () => {
    setMsg(""); setOcupado(true);
    try { await ativarPush(); setEstado("ativo"); setMsg("✓ Pronto! Mandamos uma notificação de teste."); }
    catch (err) { setMsg(err.message); setEstado(await estadoPush()); }
    setOcupado(false);
  };
  const desligar = async () => { setOcupado(true); await desativarPush(); setEstado("inativo"); setMsg(""); setOcupado(false); };
  const ligado = estado === "ativo";
  return (
    <div className={compacto ? "" : "mb-1"}>
      {/* Interruptor estilo Android: 🔔 Notificações [ ⬤ ] */}
      <button onClick={ligado ? desligar : ligar} disabled={ocupado} role="switch" aria-checked={ligado} aria-label="Notificações neste celular"
        style={{ borderColor: C.border }} className="w-full flex items-center justify-between border rounded px-3 py-2 disabled:opacity-60">
        <span style={{ color: C.ink }} className="text-sm font-bold">{ligado ? "🔔" : "🔕"} Notificações</span>
        <span style={{ background: ligado ? C.green : C.border }} className="relative inline-block w-11 h-6 rounded-full transition-colors">
          <span style={{ left: ligado ? "22px" : "2px" }} className="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all"></span>
        </span>
      </button>
      {estado === "negado" && !msg && <p style={{ color: C.rust }} className="text-[11px] font-mono mt-1">Bloqueadas no navegador: cadeado ao lado do endereço → Notificações → Permitir.</p>}
      {msg && !msg.startsWith("✓") && <p style={{ color: C.rust }} className="text-[11px] font-mono mt-1">{msg}</p>}
    </div>
  );
}
