// --- Auth local (sem backend): hash de senha, código de recuperação, WebAuthn ---
async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function randomCode(len = 10) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const arr = crypto.getRandomValues(new Uint8Array(len));
  let out = "";
  for (let i = 0; i < len; i++) out += chars[arr[i] % chars.length];
  return out;
}
function bufToBase64url(buf) {
  const bytes = new Uint8Array(buf);
  let str = "";
  bytes.forEach((b) => (str += String.fromCharCode(b)));
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function base64urlToBuf(b64url) {
  let b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  const str = atob(b64);
  const bytes = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
  return bytes.buffer;
}

// --- Netlify Identity: autenticación real, sin librerías externas (puro fetch contra sus endpoints) ---
const siteUrl = () => window.location.origin;

async function identitySignup(email, password, nome) {
  const res = await fetch(`${siteUrl()}/.netlify/identity/signup`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ email, password, user_metadata: { full_name: nome } }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.msg || data.error_description || "Não foi possível criar a conta.");
  return data;
}

async function identityLogin(email, password) {
  const res = await fetch(`${siteUrl()}/.netlify/identity/token`, {
    method: "POST",
    headers: { "content-type": "application/x-www-form-urlencoded" },
    body: `grant_type=password&username=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error_description || "Email ou senha incorretos.");
  return data;
}

async function identityRecoverRequest(email) {
  const res = await fetch(`${siteUrl()}/.netlify/identity/recover`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ email }),
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.msg || "Não foi possível iniciar a recuperação.");
  }
}

async function identitySetNewPassword(recoveryToken, newPassword) {
  const res = await fetch(`${siteUrl()}/.netlify/identity/user`, {
    method: "PUT",
    headers: { "content-type": "application/json", authorization: `Bearer ${recoveryToken}` },
    body: JSON.stringify({ password: newPassword }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.msg || "Não foi possível definir a nova senha.");
  return data;
}

function identityGoogleRedirect() {
  window.location.href = `${siteUrl()}/.netlify/identity/authorize?provider=google`;
}

function parseHashParams() {
  const hash = window.location.hash.replace(/^#/, "");
  if (!hash) return {};
  const out = {};
  new URLSearchParams(hash).forEach((v, k) => (out[k] = v));
  return out;
}

function saveSession(tokenData) {
  const session = {
    access_token: tokenData.access_token,
    refresh_token: tokenData.refresh_token,
    expires_at: Date.now() + (tokenData.expires_in || 3600) * 1000,
  };
  localStorage.setItem("identity-session", JSON.stringify(session));
  return session;
}

function getSession() {
  try {
    return JSON.parse(localStorage.getItem("identity-session"));
  } catch (e) {
    return null;
  }
}

function clearSession() {
  localStorage.removeItem("identity-session");
}

// Helper central: toda llamada a nuestras Functions pasa por acá.
// Agrega el token automáticamente y tira un error legible si el server rechaza.
async function apiFetch(path, opts = {}) {
  const token = await getValidAccessToken();
  if (!token) throw new Error("Sessão expirada. Entre novamente.");
  const headers = { authorization: `Bearer ${token}`, ...(opts.headers || {}) };
  if (opts.body) headers["content-type"] = "application/json";
  const res = await fetch(path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Erro ${res.status}`);
  return data;
}

async function refreshSession(session) {
  const res = await fetch(`${siteUrl()}/.netlify/identity/token`, {
    method: "POST",
    headers: { "content-type": "application/x-www-form-urlencoded" },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(session.refresh_token)}`,
  });
  if (!res.ok) return null;
  const data = await res.json();
  return saveSession(data);
}

// Devuelve un access_token válido (refrescando si hizo falta) o null si no hay sesión.
async function getValidAccessToken() {
  let session = getSession();
  if (!session) return null;
  if (Date.now() > session.expires_at - 60000) {
    session = await refreshSession(session);
    if (!session) {
      clearSession();
      return null;
    }
  }
  return session.access_token;
}

function compressImage(file, maxWidth = 800, quality = 0.55) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function DocumentosSection({ obraId, documentos, onAdd, onDelete, fileCache, loadFile, saveArquivo, onViewImage }) {
  const inputRef = useRef(null);
  const [uploading, setUploading] = useState(false);
  const [erro, setErro] = useState("");
  const list = documentos;

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 4.5 * 1024 * 1024) {
      alert("O arquivo é muito grande (máx ~4MB).");
      e.target.value = "";
      return;
    }
    setErro("");
    setUploading(true);
    try {
      const dataUrl = await fileToDataURL(file);
      const arquivoId = uid();
      const ok = await saveArquivo(arquivoId, { nome: file.name, tipo: file.type, dataUrl });
      if (ok) {
        await onAdd({ obraId, nome: file.name, tipo: file.type, arquivoId });
      } else {
        alert("Não foi possível salvar o arquivo — provavelmente falta espaço. Verifique o indicador de espaço no topo.");
      }
    } catch (err) {
      setErro(err.message || "Não foi possível processar o arquivo.");
    }
    setUploading(false);
    e.target.value = "";
  };

  useEffect(() => { list.forEach((d) => { if (!fileCache[d.arquivo_id]) loadFile(d.arquivo_id); }); }, [obraId, list.map((d) => d.arquivo_id).join(",")]);

  const download = (doc) => {
    const f = fileCache[doc.arquivo_id];
    if (!f || f === "MISSING") return;
    const a = document.createElement("a");
    a.href = f.dataUrl;
    a.download = doc.nome;
    a.click();
  };

  const remover = async (doc) => {
    setErro("");
    try {
      await onDelete(doc.id, doc.arquivo_id);
    } catch (err) {
      setErro(err.message);
    }
  };

  return (
    <div>
      <div className="space-y-1.5 mb-3">
        {list.map((d) => {
          const isImg = isImagemDoc(d);
          const f = fileCache[d.arquivo_id];
          const faltando = f === "MISSING";
          return (
            <div key={d.id} style={{ background: C.bg, borderColor: faltando ? C.rust : C.border }} className="border rounded px-3 py-2 flex items-center gap-2">
              {isImg && f && !faltando ? (

              )}

              <span style={{ color: C.inkMuted }} className="text-[11px] font-mono shrink-0">{fmtTs(d.criado_em)}</span>
              {isImg && !faltando && <button onClick={() => f && onViewImage(f.dataUrl)} style={{ color: C.teal }} className="text-xs font-bold uppercase shrink-0">Ver</button>}

            </div>
          );

        + {uploading ? "Enviando..." : "Adicionar projeto"}
      </button>
    </div>
  );
}

function EquipeSection({ obraId, equipe, onAdd, onRemove, onToggleHoje, usuarioRank }) {
  const [email, setEmail] = useState("");
  const [funcao, setFuncao] = useState("");
  const [rank, setRank] = useState(1);
  const [erro, setErro] = useState("");
  const [msg, setMsg] = useState("");
  const [salvando, setSalvando] = useState(false);
  const list = equipe;
  const hoje = todayISO();
  const funcoesHistoricas = [...new Set([...FUNCOES, ...equipe.map((m) => m.funcao).filter(Boolean)])];
  const ranksDisponiveis = [1, 2, 3, 4, 5].filter((r) => r <= usuarioRank);

  const submit = async () => {
    if (!email.trim()) return;
    setErro(""); setMsg(""); setSalvando(true);
    try {
      const r = await onAdd({ obraId, email: email.trim(), rank, funcao: (funcao || FUNCOES[0]).trim() });
      setMsg(r.convite ? `Convite enviado para ${email.trim()} — vai entrar assim que criar a conta.` : "Adicionado.");
      setEmail(""); setFuncao("");
    } catch (err) {
      setErro(err.message);
    }
    setSalvando(false);
  };

  const remover = async (m) => {
    setErro("");
    try { await onRemove(m.id); } catch (err) { setErro(err.message); }
  };

  const marcarPresenca = async (m) => {
    setErro("");
    try { await onToggleHoje(m.id, hoje); } catch (err) { setErro(err.message); }
  };

  return (
    <div>
      <div className="space-y-2 mb-3">
        {list.map((m) => {
          const presenteHoje = m.asistencias?.includes(hoje);
          return (
            <div key={m.id} style={{ background: C.bg, borderColor: C.border }} className="border rounded px-3 py-2 flex items-center gap-2">
              <button onClick={() => marcarPresenca(m)} title="Marcar presença hoje" style={{ borderColor: presenteHoje ? C.green : C.border, background: presenteHoje ? C.green : "transparent" }} className="w-5 h-5 border-2 rounded flex items-center justify-center shrink-0 text-white text-xs">
                {presenteHoje ? "✓" : ""}
              </button>
              <div className="flex-1 min-w-0 truncate">
                <span style={{ color: C.ink }} className="font-semibold text-sm">{m.nome}</span> <span style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">· {m.funcao || RANK_LABELS[m.rank]}</span>
                <div style={{ color: C.inkMuted }} className="text-[11px] font-mono truncate">{m.email} · {RANK_LABELS[m.rank]}</div>
              </div>
              <span style={{ color: C.inkMuted }} className="text-xs font-mono shrink-0">{m.asistencias?.length || 0}d</span>
              <button onClick={() => remover(m)} style={{ color: C.inkMuted }} className="shrink-0">×</button>
            </div>
          );
        })}
        {list.length === 0 && <p style={{ color: C.inkMuted }} className="text-sm font-mono">Sem equipe atribuída.</p>}
      </div>
      <div className="flex flex-wrap gap-2">
        <input value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="email@exemplo.com" style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-3 py-1.5 text-sm outline-none" />
        <input value={funcao} onChange={(e) => setFuncao(e.target.value)} placeholder={FUNCOES[0]} list="funcoes-equipe" style={{ borderColor: C.border, color: C.ink }} className="border rounded px-2 py-1.5 text-xs outline-none w-24 shrink-0" />
        <select value={rank} onChange={(e) => setRank(Number(e.target.value))} style={{ borderColor: C.border, color: C.ink }} className="border rounded px-1 py-1.5 text-xs outline-none bg-white shrink-0">
          {ranksDisponiveis.map((r) => <option key={r} value={r}>{RANK_LABELS[r]}</option>)}
        </select>
        <datalist id="funcoes-equipe">{funcoesHistoricas.map((f) => <option key={f} value={f} />)}</datalist>
        <button onClick={submit} disabled={!email.trim() || salvando} style={{ background: C.teal }} className="text-white rounded px-3 disabled:opacity-40 shrink-0">+</button>
      </div>
      <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mt-1">Se o email ainda não tem conta, fica um convite pendente com o rank escolhido.</p>
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-1">{erro}</p>}
      {msg && <p style={{ color: C.green }} className="text-xs font-mono mt-1">{msg}</p>}
    </div>
  );
}

function EtapaNode({ etapa, allEtapas, depth, onToggle, onRemove, onAddSub, onEditEtapa, fileCache, loadFile, saveArquivo, onViewImage, nomesHistoricos = [] }) {
  const [openSub, setOpenSub] = useState(false);
  const [editando, setEditando] = useState(false);
  const [nomeEdit, setNomeEdit] = useState(etapa.texto);
  const [novoSub, setNovoSub] = useState("");
  const [uploading, setUploading] = useState(false);
  const [erro, setErro] = useState("");
  const inputRef = useRef(null);
  const filhos = allEtapas.filter((e) => e.parent_id === etapa.id);
  const temFilhos = filhos.length > 0;

  const salvarNome = async () => {
    if (nomeEdit.trim() && nomeEdit.trim() !== etapa.texto) {
      try { await onEditEtapa(etapa.id, nomeEdit.trim()); } catch (err) { setErro(err.message); setNomeEdit(etapa.texto); }
    } else setNomeEdit(etapa.texto);
    setEditando(false);
  };

  const toggleSimples = async () => {
    setErro("");
    try { await onToggle(etapa.id, !etapa.concluida, etapa.foto_conclusao_id); } catch (err) { setErro(err.message); }
  };

  const handlePhoto = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    setErro("");
    try {
      const dataUrl = await compressImage(file);
      const fotoId = uid();
      const ok = await saveArquivo(fotoId, { nome: "conclusao.jpg", tipo: "image/jpeg", dataUrl });
      if (!ok) { setErro("Não foi possível salvar a foto (sem espaço?)."); setUploading(false); e.target.value = ""; return; }
      await onToggle(etapa.id, true, fotoId);
    } catch (err) { setErro(err.message); }
    setUploading(false);
    e.target.value = "";
  };

  const addSub = async () => {
    if (!novoSub.trim()) return;
    setErro("");
    try { await onAddSub(etapa.id, novoSub.trim()); setNovoSub(""); } catch (err) { setErro(err.message); }
  };

  const removerEtapa = async () => {
    setErro("");
    try { await onRemove(etapa.id); } catch (err) { setErro(err.message); }
  };

  return (
    <div style={{ marginLeft: depth * 14 }}>
      <div style={{ borderColor: C.border, background: C.bg }} className="border rounded-md p-2.5 mb-2">
        <div className="flex items-center gap-1.5">
          <button onClick={toggleSimples} style={{ borderColor: etapa.concluida ? C.green : C.border, background: etapa.concluida ? C.green : "transparent" }} className="w-4 h-4 border-2 rounded flex items-center justify-center shrink-0 text-white text-[10px]">{etapa.concluida ? "✓" : ""}</button>
          <button onClick={() => setOpenSub(!openSub)} title="Subetapas" className="shrink-0">{temFilhos ? (openSub ? "📂" : "📁") : "📄"}</button>
          {editando ? (
            <input value={nomeEdit} onChange={(e) => setNomeEdit(e.target.value)} onKeyDown={(e) => e.key === "Enter" && salvarNome()} onBlur={salvarNome} autoFocus style={{ borderColor: C.border, color: C.ink, background: C.surface }} className="flex-1 min-w-0 border rounded px-2 py-0.5 text-sm outline-none" />
          ) : (
            <span style={{ color: etapa.concluida ? C.inkMuted : C.ink, textDecoration: etapa.concluida ? "line-through" : "none" }} className="text-sm flex-1 min-w-0 truncate">{etapa.texto}</span>
          )}
          {temFilhos && <span style={{ color: C.inkMuted }} className="text-[10px] font-mono shrink-0">{filhos.filter((f) => f.concluida).length}/{filhos.length}</span>}
          {!editando && <button onClick={() => { setNomeEdit(etapa.texto); setEditando(true); }} style={{ color: C.inkMuted }} className="shrink-0">✎</button>}
          <input ref={inputRef} type="file" accept="image/*" capture="environment" onChange={handlePhoto} className="hidden" />
          <button onClick={() => inputRef.current?.click()} disabled={uploading} title="Concluir com foto" style={{ color: C.inkMuted }} className="shrink-0">📷</button>
          <button onClick={removerEtapa} style={{ color: C.rust }} className="shrink-0">🗑</button>
        </div>
        {etapa.foto_conclusao_id && (
          <div className="mt-2 flex items-center gap-2">
            <Thumbnail fotoId={etapa.foto_conclusao_id} fileCache={fileCache} loadFile={loadFile} onView={onViewImage} />
            <span style={{ color: C.inkMuted }} className="text-[11px] font-mono">Concluída em {fmtTs(etapa.concluida_em)}</span>
          </div>
        )}
        {erro && <p style={{ color: C.rust }} className="text-[11px] font-mono mt-1">{erro}</p>}
      </div>

      {openSub && (
        <div style={{ borderLeft: `2px dashed ${C.border}`, marginLeft: 8 }} className="pl-2 mb-2">
          {filhos.map((f) => (
            <EtapaNode key={f.id} etapa={f} allEtapas={allEtapas} depth={0} onToggle={onToggle} onRemove={onRemove} onAddSub={onAddSub} onEditEtapa={onEditEtapa} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={onViewImage} nomesHistoricos={nomesHistoricos} />
          ))}
          <div className="flex gap-2 mb-2">
            <input value={novoSub} onChange={(e) => setNovoSub(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addSub()} placeholder="Nova subetapa" list="nomes-etapas" style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-3 py-1.5 text-sm outline-none" />
            <button onClick={addSub} disabled={!novoSub.trim()} style={{ background: C.teal }} className="text-white rounded px-3 disabled:opacity-40 shrink-0">+</button>
          </div>
        </div>
      )}
    </div>
  );
}

const MODULOS_OBRA = [
  { key: "etapas", label: "Etapas", glyph: "☑" },
  { key: "equipe", label: "Equipe", glyph: "👥" },
  { key: "documentos", label: "Documentos", glyph: "📎" },
  { key: "ferramentas", label: "Ferramentas", glyph: "🔧" },
  { key: "materiais", label: "Materiais", glyph: "📦" },
  { key: "observacoes", label: "Observações", glyph: "📝" },
];

function ObraDetail({ obra, obraDetalhe, onBack, onChangeEstado, onDeleteObra,
  onAddEtapa, onToggleEtapa, onRemoveEtapa, onEditEtapa,
  onAddFerramenta, onDeleteFerramenta, onAddMaterial, onDeleteMaterial, onAddObservacao, onDeleteObservacao,
  onAddEquipo, onRemoveEquipo, onToggleHoje, usuarioRank,
  onAddDoc, onDeleteDoc, fileCache, loadFile, saveArquivo, onViewImage }) {
  const [erroObra, setErroObra] = useState("");
  const [modulo, setModulo] = useState(null);
  const { etapas, equipe, ferramentas, materiais, observacoes, documentos } = obraDetalhe;
  const etapasObraCount = etapas.length;
  const etapasObraDone = etapas.filter((e) => e.concluida).length;

  const cycleEstado = async () => {
    setErroObra("");
    const order = ["ativa", "pausada", "concluida"];
    try { await onChangeEstado(obra.id, order[(order.indexOf(obra.estado) + 1) % order.length]); }
    catch (err) { setErroObra(err.message); }
  };

  const excluir = async () => {
    setErroObra("");
    try { await onDeleteObra(obra.id); }
    catch (err) { setErroObra(err.message); }
  };

  const contagens = {
    etapas: etapasObraCount > 0 ? `${etapasObraDone}/${etapasObraCount}` : null,
    equipe: equipe.length || null,
    documentos: documentos.length || null,
    ferramentas: ferramentas.length || null,
    materiais: materiais.length || null,
    observacoes: observacoes.length || null,
  };

  if (modulo) {
    const mod = MODULOS_OBRA.find((m) => m.key === modulo);
    return (
      <div>

function ReportView({ obras, onBack }) {
  const [loading, setLoading] = useState(true);
  const [reportText, setReportText] = useState("");
  const [copied, setCopied] = useState(false);
  const cutoff = todayISO();
  const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);

  useEffect(() => {
    (async () => {
      setLoading(true);
      const lines = [`*RELATÓRIO SEMANAL — GESTÃO & CONTROLE*`, `${fmt(weekAgo)} a ${fmt(cutoff)}`, ""];
      let totalPendentes = 0;
      const blocos = [];
      for (const obra of obras) {
        try {
          const [etR, feR, maR, obR] = await Promise.all([
            apiFetch(`/api/etapas?obra_id=${obra.id}`),
            apiFetch(`/api/ferramentas?obra_id=${obra.id}`),
            apiFetch(`/api/materiais?obra_id=${obra.id}`),
            apiFetch(`/api/observacoes?obra_id=${obra.id}`),
          ]);
          const etapas = etR.etapas, ferramentas = feR.ferramentas, materiais = maR.materiais, observacoes = obR.observacoes;
          const pendentes = etapas.filter((e) => !e.concluida);
          totalPendentes += pendentes.length;
          const doneCount = etapas.filter((e) => e.concluida).length;
          const concluidasRecentes = etapas.filter((e) => e.concluida && e.concluida_em >= weekAgo);
          const ferRecent = ferramentas.filter((f) => f.criado_em >= weekAgo);
          const matRecent = materiais.filter((m) => m.criado_em >= weekAgo);
          const obsRecent = observacoes.filter((o) => o.criado_em >= weekAgo);
          if (etapas.length === 0 && ferRecent.length === 0 && matRecent.length === 0 && obsRecent.length === 0) continue;
          const bloco = [`*${obra.cliente}* (${ESTADOS[obra.estado].label}) — ${obra.endereco}`];
          if (etapas.length > 0) bloco.push(`  Etapas: ${doneCount}/${etapas.length} concluídas`);
          concluidasRecentes.forEach((e) => bloco.push(`  • [Concluída] ${e.texto}`));
          ferRecent.forEach((f) => bloco.push(`  • [Ferramenta] ${f.texto}`));
          matRecent.forEach((m) => bloco.push(`  • [Material] ${m.texto}`));
          obsRecent.forEach((o) => bloco.push(`  • [Observação] ${o.texto}`));
          blocos.push(bloco.join("\n"));
        } catch (e) {}
      }
      if (totalPendentes > 0) lines.push(`*⚠ ETAPAS PENDENTES (${totalPendentes})*`, "");
      lines.push(...blocos.map((b) => b + "\n"));
      if (blocos.length === 0 && totalPendentes === 0) lines.push("Sem novidades registradas essa semana.");
      setReportText(lines.join("\n"));
      setLoading(false);
    })();
  }, [obras]);

  const copy = async () => { try { await navigator.clipboard.writeText(reportText); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) {} };
  const openWhatsapp = () => window.open(`https://wa.me/?text=${encodeURIComponent(reportText)}`, "_blank");
  const openEmail = () => { const subject = encodeURIComponent(`Relatório semanal — ${fmt(weekAgo)} a ${fmt(cutoff)}`); const body = encodeURIComponent(reportText.replace(/\*/g, "")); window.location.href = `mailto:?subject=${subject}&body=${body}`; };

  return (
    <div>
      <button onClick={onBack} style={{ color: C.inkMuted }} className="flex items-center gap-1 text-sm font-mono mb-4">‹ voltar</button>
      <h2 style={{ color: C.ink }} className="text-xl font-extrabold uppercase tracking-wide mb-1">Relatório semanal</h2>
      <p style={{ color: C.inkMuted }} className="text-sm font-mono mb-4">{fmt(weekAgo)} — {fmt(cutoff)}</p>
      {loading ? (
        <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-12">Carregando...</p>
      ) : (
        <>
          <pre style={{ background: C.surface, borderColor: C.border, color: C.ink }} className="border rounded-md p-4 text-sm whitespace-pre-wrap font-sans leading-relaxed mb-4">{reportText}</pre>
          <div className="flex flex-wrap gap-2">
            <button onClick={openWhatsapp} style={{ background: C.green }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">💬 WhatsApp</button>
            <button onClick={openEmail} style={{ background: C.blue }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">✉ Email</button>
            <button onClick={copy} style={{ borderColor: C.border, color: C.ink }} className="border font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">{copied ? "✓ Copiado" : "⧉ Copiar"}</button>
          </div>
        </>
      )}
    </div>
  );
}

      </div>
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-2">{erro}</p>}
      <button onClick={entrar} disabled={entrando} style={{ background: C.amber }} className="w-full mt-4 text-white font-bold uppercase tracking-wide rounded py-2.5 disabled:opacity-50">{entrando ? "Entrando..." : "Entrar"}</button>
      <button onClick={() => setRecuperar(true)} style={{ color: C.inkMuted }} className="w-full text-xs font-mono uppercase mt-3">Esqueceu sua senha?</button>
      <button onClick={onIrCadastro} style={{ color: C.inkMuted }} className="w-full text-xs font-mono uppercase mt-2">Não tenho conta — criar</button>
    </AuthWrap>
  );
}

function TrancaBiometricaScreen({ onDesbloqueado, onUsarSenha }) {
  const [erro, setErro] = useState("");

  const desbloquear = async () => {
    setErro("");
    try {
      const credId = localStorage.getItem("biometria-credential-id");
      await navigator.credentials.get({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials: credId ? [{ id: base64urlToBuf(credId), type: "public-key" }] : [],
          userVerification: "required",
          timeout: 60000,
        },
      });
      onDesbloqueado();
    } catch (err) {
      console.error(err);
      setErro("Não foi possível validar.");
    }
  };

  useEffect(() => { desbloquear(); }, []);

  return (
    <AuthWrap>
      <div className="text-center mb-5">
        <LogoTitulo />
        <p style={{ color: C.inkMuted }} className="text-xs font-mono mt-1">Toque para continuar</p>
      </div>
      <button onClick={desbloquear} style={{ background: C.ink }} className="w-full text-white font-bold uppercase tracking-wide rounded py-2.5 mb-2">🔒 Usar digital / PIN</button>
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono text-center mb-2">{erro}</p>}
      <button onClick={onUsarSenha} style={{ color: C.inkMuted }} className="w-full text-xs font-mono uppercase py-2">Sair e entrar de novo com senha</button>
    </AuthWrap>
  );
}

function ConfigurarBiometriaScreen({ onFeito }) {
  const configurar = async () => {
    try {
      const cred = await navigator.credentials.create({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          rp: { name: "Gestão & Controle" },
          user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "usuario", displayName: "usuario" },
          pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
          authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
          timeout: 60000,
        },
      });
      localStorage.setItem("biometria-credential-id", bufToBase64url(cred.rawId));
    } catch (err) {
      console.error(err);
    }
    onFeito();
  };

  return (
    <AuthWrap>
      <div className="text-center mb-4">
        <span className="text-3xl">🔒</span>
        <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mt-2">Tranca rápida</h2>
      </div>
      <p style={{ color: C.inkMuted }} className="text-sm mb-4 text-center">Quer usar sua digital, PIN ou padrão do celular para abrir o app mais rápido da próxima vez?</p>
      <button onClick={configurar} style={{ background: C.amber }} className="w-full text-white font-bold uppercase tracking-wide rounded py-2.5 mb-2">Configurar agora</button>
      <button onClick={onFeito} style={{ color: C.inkMuted }} className="w-full text-xs font-mono uppercase py-2">Pular por enquanto</button>
    </AuthWrap>
  );
}

function GestorObras() {
  const [view, setView] = useState("dashboard");
  const [selectedId, setSelectedId] = useState(null);
  const [showModal, setShowModal] = useState(false);
  const [fileCache, setFileCache] = useState({});
  const [lightboxImg, setLightboxImg] = useState(null);
  const [temaEscuro, setTemaEscuro] = useState(false);

  const [sessionLoading, setSessionLoading] = useState(true);
  const [temSessao, setTemSessao] = useState(false);
  const [usuarioAPI, setUsuarioAPI] = useState(null);
  const [recoveryToken, setRecoveryToken] = useState(null);
  const [authView, setAuthView] = useState("login");
  const [emailAguardando, setEmailAguardando] = useState("");
  const [biometriaConfigurada, setBiometriaConfigurada] = useState(false);
  const [biometriaPassada, setBiometriaPassada] = useState(false);
  const [configurandoBiometria, setConfigurandoBiometria] = useState(false);

  const [obras, setObras] = useState([]);
  const [obrasLoading, setObrasLoading] = useState(false);
  const [pendentesPorObra, setPendentesPorObra] = useState({});
  const [obraDetalhe, setObraDetalhe] = useState(null);
  const [obraDetalheLoading, setObraDetalheLoading] = useState(false);
  const [erroGlobal, setErroGlobal] = useState("");
  const [showConfig, setShowConfig] = useState(false);

  const carregarUsuarioAPI = async () => {
    const token = await getValidAccessToken();
    if (!token) { setTemSessao(false); setUsuarioAPI(null); return; }
    setTemSessao(true);
    try {
      const res = await fetch("/api/usuarios-me", { headers: { authorization: `Bearer ${token}` } });
      const dataRes = await res.json();
      if (dataRes.ok) setUsuarioAPI(dataRes.usuario);
      else { clearSession(); setTemSessao(false); }
    } catch (e) {
      // sem rede: mantemos a sessão, só não temos os dados do servidor por enquanto
    }
  };

  useEffect(() => {
    (async () => {
      const hashParams = parseHashParams();
      if (hashParams.recovery_token) {
        setRecoveryToken(hashParams.recovery_token);
        history.replaceState(null, "", window.location.pathname);
      } else if (hashParams.access_token) {
        saveSession(hashParams);
        history.replaceState(null, "", window.location.pathname);
      }

      await carregarUsuarioAPI();
      setSessionLoading(false);

      setBiometriaConfigurada(!!localStorage.getItem("biometria-credential-id"));

      try {
        const res = await window.storage.get("tema");
        setTemaEscuro(res ? res.value === "escuro" : false);
      } catch (e) {}
    })();
  }, []);

  const carregarPendentes = async (lista) => {
    const mapa = {};
    await Promise.all(lista.map(async (o) => {
      try {
        const r = await apiFetch(`/api/etapas?obra_id=${o.id}`);
        mapa[o.id] = r.etapas.filter((e) => !e.concluida).length;
      } catch (e) { mapa[o.id] = 0; }
    }));
    setPendentesPorObra(mapa);
  };

  const carregarObras = async () => {
    setObrasLoading(true);
    setErroGlobal("");
    try {
      const r = await apiFetch("/api/obras");
      setObras(r.obras);
      carregarPendentes(r.obras);
    } catch (err) {
      setErroGlobal(err.message);
    }
    setObrasLoading(false);
  };

  useEffect(() => { if (usuarioAPI) carregarObras(); }, [usuarioAPI]);

  const aoLogar = async () => {
    setBiometriaPassada(true);
    await carregarUsuarioAPI();
    if (!localStorage.getItem("biometria-credential-id") && biometriaSuportada()) {
      setConfigurandoBiometria(true);
    }
  };

  const sair = () => {
    clearSession();
    setTemSessao(false);
    setUsuarioAPI(null);
    setBiometriaPassada(false);
    setObras([]);
    setObraDetalhe(null);
  };

  const alternarTema = () => {
    const novo = !temaEscuro;
    setTemaEscuro(novo);
    window.storage.set("tema", novo ? "escuro" : "claro").catch(() => {});
  };

  const temaVars = useMemo(() => {
    const p = temaEscuro ? TEMA_ESCURO : TEMA_CLARO;
    return {
      "--c-bg": p.bg, "--c-surface": p.surface, "--c-ink": p.ink, "--c-inkMuted": p.inkMuted,
      "--c-border": p.border, "--c-amber": p.amber, "--c-blue": p.blue, "--c-rust": p.rust,
      "--c-green": p.green, "--c-steel": p.steel, "--c-teal": p.teal,
      background: p.bg, minHeight: "100vh", colorScheme: temaEscuro ? "dark" : "light",
    };
  }, [temaEscuro]);

  const saveArquivo = async (id, payload) => {
    try {
      const res = await fetch("/api/arquivo-set", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: `Bearer ${APP_TOKEN}` },
        body: JSON.stringify({ id, payload: JSON.stringify(payload) }),
      });
      const data = await res.json();
      if (data.ok) {
        setFileCache((p) => ({ ...p, [id]: payload }));
        return true;
      }
      return false;
    } catch (e) {
      return false;
    }
  };
  const loadFile = async (id) => {
    if (fileCache[id]) return;
    try {
      const res = await fetch(`/api/arquivo-get?id=${encodeURIComponent(id)}`, {
        headers: { authorization: `Bearer ${APP_TOKEN}` },
      });
      if (res.status === 404) { setFileCache((p) => ({ ...p, [id]: "MISSING" })); return; }
      const data = await res.json();
      setFileCache((p) => ({ ...p, [id]: data.ok ? JSON.parse(data.payload) : "MISSING" }));
    } catch (e) {
      setFileCache((p) => ({ ...p, [id]: "MISSING" }));
    }
  };
  const deleteArquivoRemoto = (id) => {
    fetch(`/api/arquivo-delete?id=${encodeURIComponent(id)}`, {
      method: "DELETE",
      headers: { authorization: `Bearer ${APP_TOKEN}` },
    }).catch(() => {});
  };

  // --- Obras ---
  const criarObra = async (form) => {
    const r = await apiFetch("/api/obras", { method: "POST", body: JSON.stringify(form) });
    setObras((prev) => [r.obra, ...prev]);
    setShowModal(false);
  };

  const changeEstado = async (obraId, estado) => {
    const r = await apiFetch(`/api/obras?id=${obraId}`, { method: "PATCH", body: JSON.stringify({ estado }) });
    setObras((prev) => prev.map((o) => (o.id === obraId ? r.obra : o)));
  };

  const deleteObra = async (obraId) => {
    await apiFetch(`/api/obras?id=${obraId}`, { method: "DELETE" });
    setObras((prev) => prev.filter((o) => o.id !== obraId));
    setView("dashboard");
  };

  // --- Abrir una obra: carga todo lo de esa obra en paralelo ---
  const abrirObra = async (id) => {
    setSelectedId(id);
    setView("obra");
    setObraDetalhe(null);
    setObraDetalheLoading(true);
    try {
      const [et, eq, fe, ma, ob, doc] = await Promise.all([
        apiFetch(`/api/etapas?obra_id=${id}`),
        apiFetch(`/api/equipe?obra_id=${id}`),
        apiFetch(`/api/ferramentas?obra_id=${id}`),
        apiFetch(`/api/materiais?obra_id=${id}`),
        apiFetch(`/api/observacoes?obra_id=${id}`),
        apiFetch(`/api/documentos?obra_id=${id}`),
      ]);
      setObraDetalhe({
        etapas: et.etapas, equipe: eq.equipe, ferramentas: fe.ferramentas,
        materiais: ma.materiais, observacoes: ob.observacoes, documentos: doc.documentos,
      });
    } catch (err) {
      setErroGlobal(err.message);
    }
    setObraDetalheLoading(false);
  };

  const voltarAoDashboard = () => {
    setView("dashboard");
    if (selectedId) carregarPendentes(obras);
  };

  // --- Etapas ---
  const addEtapa = async (parentId, texto) => {
    const r = await apiFetch("/api/etapas", { method: "POST", body: JSON.stringify({ obraId: selectedId, parentId, texto }) });
    setObraDetalhe((d) => ({ ...d, etapas: [...d.etapas, r.etapa] }));
  };
  const toggleEtapa = async (id, concluida, fotoConclusaoId) => {
    const r = await apiFetch(`/api/etapas?id=${id}`, { method: "PATCH", body: JSON.stringify({ concluida, fotoConclusaoId }) });
    setObraDetalhe((d) => ({ ...d, etapas: d.etapas.map((e) => (e.id === id ? r.etapa : e)) }));
  };
  const editEtapa = async (id, texto) => {
    const r = await apiFetch(`/api/etapas?id=${id}`, { method: "PATCH", body: JSON.stringify({ texto }) });
    setObraDetalhe((d) => ({ ...d, etapas: d.etapas.map((e) => (e.id === id ? r.etapa : e)) }));
  };
  const removeEtapa = async (id) => {
    await apiFetch(`/api/etapas?id=${id}`, { method: "DELETE" });
    // recarrega para reflejar la cascada (subetapas borradas junto con el padre)
    const r = await apiFetch(`/api/etapas?obra_id=${selectedId}`);
    setObraDetalhe((d) => ({ ...d, etapas: r.etapas }));
  };

  // --- Ferramentas / Materiais / Observações (mismo patrón para los 3) ---
  const criarListaHandlers = (recurso, campo) => ({
    add: async (texto) => {
      const r = await apiFetch(`/api/${recurso}`, { method: "POST", body: JSON.stringify({ obraId: selectedId, texto }) });
      setObraDetalhe((d) => ({ ...d, [campo]: [r.item, ...d[campo]] }));
    },
    del: async (id) => {
      await apiFetch(`/api/${recurso}?id=${id}`, { method: "DELETE" });
      setObraDetalhe((d) => ({ ...d, [campo]: d[campo].filter((x) => x.id !== id) }));
    },
  });
  const ferramentasH = criarListaHandlers("ferramentas", "ferramentas");
  const materiaisH = criarListaHandlers("materiais", "materiais");
  const observacoesH = criarListaHandlers("observacoes", "observacoes");

  // --- Equipe ---
  const addEquipo = async (payload) => {
    const r = await apiFetch("/api/equipe", { method: "POST", body: JSON.stringify(payload) });
    if (!r.convite) setObraDetalhe((d) => ({ ...d, equipe: [...d.equipe, r.equipe] }));
    return r;
  };
  const removeEquipo = async (id) => {
    await apiFetch(`/api/equipe?id=${id}`, { method: "DELETE" });
    setObraDetalhe((d) => ({ ...d, equipe: d.equipe.filter((m) => m.id !== id) }));
  };
  const toggleHoje = async (id, hoje) => {
    const r = await apiFetch(`/api/equipe?id=${id}`, { method: "PATCH", body: JSON.stringify({ data: hoje }) });
    setObraDetalhe((d) => ({ ...d, equipe: d.equipe.map((m) => (m.id === id ? r.equipe : m)) }));
  };

  // --- Documentos ---
  const addDoc = async (payload) => {
    const r = await apiFetch("/api/documentos", { method: "POST", body: JSON.stringify(payload) });
    setObraDetalhe((d) => ({ ...d, documentos: [r.documento, ...d.documentos] }));
  };
  const deleteDoc = async (id, arquivoId) => {
    await apiFetch(`/api/documentos?id=${id}`, { method: "DELETE" });
    if (arquivoId) deleteArquivoRemoto(arquivoId);
    setObraDetalhe((d) => ({ ...d, documentos: d.documentos.filter((x) => x.id !== id) }));
  };

  const selectedObra = obras.find((o) => o.id === selectedId);
  const totalPendientes = Object.values(pendentesPorObra).reduce((a, b) => a + b, 0);

  let content;
  if (sessionLoading) {
    content = <SplashScreen />;
  } else if (recoveryToken) {
    content = <DefinirNovaSenhaScreen recoveryToken={recoveryToken} onDefinida={() => { setRecoveryToken(null); aoLogar(); }} />;
  } else if (!temSessao) {
    content =
      authView === "cadastro" ? (
        <CadastroScreen
          onIrLogin={() => setAuthView("login")}
          onCadastrado={aoLogar}
          onAguardandoEmail={(email) => { setEmailAguardando(email); setAuthView("aguardandoEmail"); }}
        />
      ) : authView === "aguardandoEmail" ? (
        <AguardandoEmailScreen email={emailAguardando} onVoltar={() => setAuthView("login")} />
      ) : (
        <LoginScreen onLogado={aoLogar} onIrCadastro={() => setAuthView("cadastro")} />
      );
  } else if (configurandoBiometria) {
    content = <ConfigurarBiometriaScreen onFeito={() => { setConfigurandoBiometria(false); setBiometriaConfigurada(!!localStorage.getItem("biometria-credential-id")); }} />;
  } else if (biometriaConfigurada && !biometriaPassada) {
    content = <TrancaBiometricaScreen onDesbloqueado={() => setBiometriaPassada(true)} onUsarSenha={sair} />;
  } else if (!usuarioAPI) {
    content = <SplashScreen />;
  } else {
    content = (
    <div className="p-4 pb-24">
      {view === "dashboard" && (
        <>
          <div className="flex items-start gap-3 mb-5 pt-2">
            <img src="logo.png" alt="G&C" className="w-14 h-14 rounded-full shrink-0" />
            <div className="flex-1 min-w-0">
              <div className="flex items-center justify-between gap-2">
                <span style={{ color: C.inkMuted }} className="text-[11px] font-mono truncate">{RANK_LABELS[usuarioAPI.rank] || ""}</span>
                <span style={{ color: C.inkMuted }} className="text-[11px] font-mono truncate">{usuarioAPI.nome}</span>
              </div>
              <h1 style={{ color: C.ink }} className="font-comic text-xl tracking-wide leading-tight mt-0.5">Gestão & Controle</h1>
            </div>
          </div>
          <div className="flex flex-wrap gap-2 mb-4">
            <button onClick={() => setShowModal(true)} style={{ background: C.amber }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">+ Nova obra</button>
            <button onClick={() => setView("pendientes")} style={{ background: totalPendientes > 0 ? C.rust : "transparent", borderColor: C.rust, color: totalPendientes > 0 ? "#fff" : C.rust }} className="border font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">● Pendências {totalPendientes > 0 && `(${totalPendientes})`}</button>
            <button onClick={() => setView("report")} style={{ borderColor: C.ink, color: C.ink }} className="border font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">📅 Relatório semanal</button>
          </div>
          {erroGlobal && <p style={{ color: C.rust }} className="text-xs font-mono mb-3">{erroGlobal}</p>}
          {obrasLoading ? (
            <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-16">Carregando...</p>
          ) : obras.length === 0 ? (
            <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-16">Nenhuma obra cadastrada. Comece com "Nova obra".</p>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {obras.map((obra) => (
                <TicketCard key={obra.id} obra={obra} pendCount={pendentesPorObra[obra.id] || 0} lastDate={null} onOpen={() => abrirObra(obra.id)} />
              ))}
            </div>
          )}
        </>
      )}
      {view === "obra" && selectedObra && (
        obraDetalheLoading || !obraDetalhe ? (
          <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-16">Carregando...</p>
        ) : (
          <ObraDetail obra={selectedObra} obraDetalhe={obraDetalhe}
            onBack={voltarAoDashboard}
            onChangeEstado={changeEstado} onDeleteObra={deleteObra}
            onAddEtapa={addEtapa} onToggleEtapa={toggleEtapa} onRemoveEtapa={removeEtapa} onEditEtapa={editEtapa}
            onAddFerramenta={ferramentasH.add} onDeleteFerramenta={ferramentasH.del}
            onAddMaterial={materiaisH.add} onDeleteMaterial={materiaisH.del}
            onAddObservacao={observacoesH.add} onDeleteObservacao={observacoesH.del}
            onAddEquipo={addEquipo} onRemoveEquipo={removeEquipo} onToggleHoje={toggleHoje} usuarioRank={usuarioAPI.rank}
            onAddDoc={addDoc} onDeleteDoc={deleteDoc} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={setLightboxImg} />
        )
      )}
      {view === "pendientes" && <PendientesView obras={obras} onBack={() => setView("dashboard")} onOpenObra={abrirObra} />}
      {view === "report" && <ReportView obras={obras} onBack={() => setView("dashboard")} />}
      {showModal && <NuevaObraModal onClose={() => setShowModal(false)} onSave={criarObra} obras={obras} />}
      {lightboxImg && <Lightbox src={lightboxImg} onClose={() => setLightboxImg(null)} />}
    </div>
    );
    content = (
      <>
        {content}
        <BottomNav active={view === "dashboard" ? "inicio" : ""} onInicio={() => { setView("dashboard"); setSelectedId(null); setObraDetalhe(null); }} onConfig={() => setShowConfig(true)} />
        {showConfig && <ConfigDrawer usuario={usuarioAPI} temaEscuro={temaEscuro} onAlternarTema={alternarTema} onSair={() => { setShowConfig(false); sair(); }} onClose={() => setShowConfig(false)} />}
      </>
    );
  }

  return <div style={temaVars}>{content}</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<GestorObras />);
</script>
<script>
  // Compilamos manualmente forzando runtime clásico (React.createElement),
  // porque el runtime "automático" por default de Babel genera imports de
  // módulo ES que un <script> normal no puede ejecutar (pantalla en blanco).
  (function () {
    var src = document.getElementById("app-source").textContent;
    var out = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    var s = document.createElement("script");
    s.textContent = out;
    document.body.appendChild(s);
  })();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((e) => console.log("SW falhou:", e));
    });
  }
</script>
