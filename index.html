// --- Auth local (sem backend): hash de senha, código de recuperação, WebAuthn ---
async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function randomCode(len = 10) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const arr = crypto.getRandomValues(new Uint8Array(len));
  let out = "";
  for (let i = 0; i < len; i++) out += chars[arr[i] % chars.length];
  return out;
}
function bufToBase64url(buf) {
  const bytes = new Uint8Array(buf);
  let str = "";
  bytes.forEach((b) => (str += String.fromCharCode(b)));
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function base64urlToBuf(b64url) {
  let b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  const str = atob(b64);
  const bytes = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
  return bytes.buffer;
}
const biometriaSuportada = () => typeof window !== "undefined" && !!window.PublicKeyCredential;

function compressImage(file, maxWidth = 800, quality = 0.55) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const EXT_IMAGEM = ["jpg", "jpeg", "png", "gif", "webp", "heic", "heif", "bmp", "svg"];
function isImagemDoc(doc) {
  if (doc.tipo && doc.tipo.startsWith("image/")) return true;
  const ext = (doc.nome || "").split(".").pop().toLowerCase();
  return EXT_IMAGEM.includes(ext);
}

    <button onClick={onClick} title="Toque para mudar o estado" style={{ color: e.color, borderColor: e.color, transform: "rotate(-6deg)", fontFamily: "ui-monospace, monospace" }} className="text-[10px] font-extrabold tracking-widest border-2 rounded px-2 py-0.5 uppercase bg-transparent hover:opacity-70 transition shrink-0">
      {e.label}

}

function Thumbnail({ fotoId, fileCache, loadFile, onView }) {
  useEffect(() => { if (!fileCache[fotoId]) loadFile(fotoId); }, [fotoId]);
  const file = fileCache[fotoId];
  if (file === "MISSING") return <div title="Foto não encontrada (falha ao salvar)" style={{ background: C.bg, borderColor: C.rust, color: C.rust }} className="w-16 h-16 rounded border-2 border-dashed shrink-0 flex items-center justify-center text-lg">⚠</div>;
  if (!file) return <div style={{ background: C.border }} className="w-16 h-16 rounded animate-pulse shrink-0" />;
  return <img src={file.dataUrl} alt="" onClick={() => onView && onView(file.dataUrl)} className="w-16 h-16 object-cover rounded border shrink-0 cursor-pointer active:opacity-70" style={{ borderColor: C.border }} />;
}

function EditableRow({ glyph, color, label, dateStr, text, onSave, onDelete, extra }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(text);
  if (editing) {
    return (
      <div style={{ background: C.surface, borderLeftColor: color }} className="border-l-4 rounded-r-md p-3 shadow-sm">
        <textarea value={val} onChange={(e) => setVal(e.target.value)} rows={2} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-2 py-1.5 text-sm outline-none resize-none mb-2" autoFocus />
        <div className="flex gap-2">
          <button onClick={() => { onSave(val); setEditing(false); }} style={{ background: C.green }} className="text-white text-xs font-bold uppercase rounded px-2.5 py-1">💾 Salvar</button>
          <button onClick={() => { setVal(text); setEditing(false); }} style={{ color: C.inkMuted, borderColor: C.border }} className="border text-xs font-bold uppercase rounded px-2.5 py-1">Cancelar</button>
        </div>
      </div>
    );
  }
  return (
    <div style={{ background: C.surface, borderLeftColor: color }} className="border-l-4 rounded-r-md p-3 shadow-sm flex gap-3 group">
      {glyph && <span className="mt-0.5 shrink-0">{glyph}</span>}
      <div className="flex-1">
        <div className="flex items-center gap-2">
          {label && <span style={{ color }} className="text-[11px] font-bold uppercase tracking-wide">{label}</span>}
          {dateStr && <span style={{ color: C.inkMuted }} className="text-[11px] font-mono">{dateStr}</span>}
        </div>
        <p style={{ color: C.ink }} className="text-sm mt-0.5">{text}</p>
        {extra}
      </div>
      <div className="flex gap-2 shrink-0">
        <button onClick={() => setEditing(true)} style={{ color: C.inkMuted }}>✎</button>
        <button onClick={onDelete} style={{ color: C.rust }}>🗑</button>
      </div>
    </div>
  );
}

  const submit = () => { if (!cliente.trim()) return; onSave({ id: uid(), cliente: cliente.trim(), endereco: endereco.trim(), tipo: tipo.trim(), dataInicio, estado: "ativa" }); };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">

        </div>
        <div className="space-y-3">
          <div><label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Cliente</label>

          <div><label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Endereço</label>
            <input value={endereco} onChange={(e) => setEndereco(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" placeholder="Bairro / endereço" /></div>
          <div><label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Tipo de trabalho</label>
            <input value={tipo} onChange={(e) => setTipo(e.target.value)} list="tipos-historicos" style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" placeholder="Ex: reforma elétrica, pintura" /></div>
          <div><label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Data de início</label>

function CollapsibleSection({ title, defaultOpen = true, children }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div style={{ background: C.surface, borderColor: C.border }} className="border rounded-md mb-5">
      <button onClick={() => setOpen(!open)} className="w-full flex items-center justify-between p-4">
        <span style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">{title}</span>
        <span>{open ? "🔺" : "🔻"}</span>
      </button>
      {open && <div className="px-4 pb-4">{children}</div>}
    </div>
  );
}

function DocumentosSection({ obraId, documentos, onAdd, onDelete, fileCache, loadFile, saveArquivo, onViewImage }) {
  const inputRef = useRef(null);
  const [uploading, setUploading] = useState(false);
  const list = documentos.filter((d) => d.obraId === obraId);

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 4.5 * 1024 * 1024) {
      alert("O arquivo é muito grande (máx ~4MB).");
      e.target.value = "";
      return;
    }
    setUploading(true);
    try {
      const dataUrl = await fileToDataURL(file);
      const arquivoId = uid();
      const ok = await saveArquivo(arquivoId, { nome: file.name, tipo: file.type, dataUrl });
      if (ok) {
        onAdd({ id: uid(), obraId, nome: file.name, tipo: file.type, data: todayISO(), arquivoId });
      } else {
        alert("Não foi possível salvar o arquivo — provavelmente falta espaço no aparelho. Verifique o indicador de espaço no topo e apague dados antigos ou faça backup e limpe.");
      }
    } catch (err) {
      console.error(err);
      alert("Não foi possível processar o arquivo.");
    }
    setUploading(false);
    e.target.value = "";
  };

  useEffect(() => { list.forEach((d) => { if (!fileCache[d.arquivoId]) loadFile(d.arquivoId); }); }, [obraId, list.map((d) => d.arquivoId).join(",")]);

  const download = (doc) => {
    const f = fileCache[doc.arquivoId];
    if (!f || f === "MISSING") return;
    const a = document.createElement("a");
    a.href = f.dataUrl;
    a.download = doc.nome;
    a.click();
  };

  return (
    <div>
      <div className="space-y-1.5 mb-3">
        {list.map((d) => {
          const isImg = isImagemDoc(d);
          const f = fileCache[d.arquivoId];
          const faltando = f === "MISSING";
          return (
            <div key={d.id} style={{ background: C.bg, borderColor: faltando ? C.rust : C.border }} className="border rounded px-3 py-2 flex items-center gap-2">
              {isImg && f && !faltando ? (
                <img src={f.dataUrl} onClick={() => onViewImage(f.dataUrl)} className="w-9 h-9 object-cover rounded shrink-0 cursor-pointer" />
              ) : (
                <span>{faltando ? "⚠" : isImg ? "🖼" : "📄"}</span>
              )}
              <span style={{ color: faltando ? C.rust : C.ink }} className="text-sm flex-1 min-w-0 truncate">{d.nome}{faltando ? " (indisponível)" : ""}</span>
              <span style={{ color: C.inkMuted }} className="text-[11px] font-mono shrink-0">{fmt(d.data)}</span>
              {isImg && !faltando && <button onClick={() => f && onViewImage(f.dataUrl)} style={{ color: C.teal }} className="text-xs font-bold uppercase shrink-0">Ver</button>}
              {!faltando && <button onClick={() => download(d)} style={{ color: C.blue }} className="text-xs font-bold uppercase shrink-0">Baixar</button>}
              <button onClick={() => onDelete(d.id, d.arquivoId)} style={{ color: C.rust }}>🗑</button>
            </div>
          );
        })}
        {list.length === 0 && <p style={{ color: C.inkMuted }} className="text-sm font-mono">Nenhum documento anexado.</p>}
      </div>
      <input ref={inputRef} type="file" onChange={handleFile} className="hidden" />
      <button onClick={() => inputRef.current?.click()} disabled={uploading} style={{ background: C.ink }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2 disabled:opacity-50">
        + {uploading ? "Enviando..." : "Adicionar projeto"}
      </button>
    </div>
  );
}

function EquipeSection({ obraId, equipe, onAdd, onRemove, onToggleHoje }) {
  const [nome, setNome] = useState("");
  const [funcao, setFuncao] = useState("");
  const list = equipe.filter((m) => m.obraId === obraId);
  const hoje = todayISO();
  const nomesHistoricos = [...new Set(equipe.map((m) => m.nome).filter(Boolean))];
  const funcoesHistoricas = [...new Set([...FUNCOES, ...equipe.map((m) => m.funcao).filter(Boolean)])];
  const submit = () => { if (!nome.trim()) return; onAdd({ id: uid(), obraId, nome: nome.trim(), funcao: (funcao || FUNCOES[0]).trim(), asistencias: [] }); setNome(""); setFuncao(""); };
  return (
    <div>
      <div className="space-y-2 mb-3">
        {list.map((m) => {
          const presenteHoje = m.asistencias?.includes(hoje);
          return (
            <div key={m.id} style={{ background: C.bg, borderColor: C.border }} className="border rounded px-3 py-2 flex items-center gap-2">
              <button onClick={() => onToggleHoje(m.id)} title="Marcar presença hoje" style={{ borderColor: presenteHoje ? C.green : C.border, background: presenteHoje ? C.green : "transparent" }} className="w-5 h-5 border-2 rounded flex items-center justify-center shrink-0 text-white text-xs">
                {presenteHoje ? "✓" : ""}
              </button>
              <div className="flex-1 min-w-0 truncate"><span style={{ color: C.ink }} className="font-semibold text-sm">{m.nome}</span> <span style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">· {m.funcao}</span></div>
              <span style={{ color: C.inkMuted }} className="text-xs font-mono shrink-0">{m.asistencias?.length || 0}d</span>
              <button onClick={() => onRemove(m.id)} style={{ color: C.inkMuted }} className="shrink-0">×</button>
            </div>
          );
        })}
        {list.length === 0 && <p style={{ color: C.inkMuted }} className="text-sm font-mono">Sem equipe atribuída.</p>}
      </div>
      <div className="flex gap-2">
        <input value={nome} onChange={(e) => setNome(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="Nome" list="nomes-equipe" style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-3 py-1.5 text-sm outline-none" />
        <input value={funcao} onChange={(e) => setFuncao(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder={FUNCOES[0]} list="funcoes-equipe" style={{ borderColor: C.border, color: C.ink }} className="border rounded px-2 py-1.5 text-xs outline-none w-24 shrink-0" />
        <datalist id="nomes-equipe">{nomesHistoricos.map((n) => <option key={n} value={n} />)}</datalist>
        <datalist id="funcoes-equipe">{funcoesHistoricas.map((f) => <option key={f} value={f} />)}</datalist>
        <button onClick={submit} disabled={!nome.trim()} style={{ background: C.teal }} className="text-white rounded px-3 disabled:opacity-40 shrink-0">+</button>
      </div>
    </div>
  );
}

      <button onClick={onClose} className="absolute top-4 right-4 text-white text-3xl leading-none">×</button>
    </div>
  );
}

function EtapaNode({ etapa, allEtapas, avancos, depth, onToggle, onRemove, onAddSub, onEditEtapa, onAddAvanco, onEditAvanco, onDeleteAvanco, fileCache, loadFile, saveArquivo, onViewImage, nomesHistoricos = [] }) {
  const [openAvancos, setOpenAvancos] = useState(false);
  const [openSub, setOpenSub] = useState(false);
  const [editando, setEditando] = useState(false);
  const [nomeEdit, setNomeEdit] = useState(etapa.texto);
  const [texto, setTexto] = useState("");
  const [novoSub, setNovoSub] = useState("");
  const [photoPreview, setPhotoPreview] = useState(null);
  const [uploading, setUploading] = useState(false);
  const inputRef = useRef(null);
  const filhos = allEtapas.filter((e) => e.parentId === etapa.id);
  const list = avancos.filter((a) => a.etapaId === etapa.id).sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
  const temFilhos = filhos.length > 0;

  const salvarNome = () => {
    if (nomeEdit.trim()) onEditEtapa(etapa.id, nomeEdit.trim());
    else setNomeEdit(etapa.texto);
    setEditando(false);
  };

  const handlePhoto = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try { setPhotoPreview(await compressImage(file)); } catch (err) { console.error(err); }
    e.target.value = "";
  };

  const submit = async () => {
    if (!texto.trim() && !photoPreview) return;
    setUploading(true);
    let fotoIds = [];
    if (photoPreview) {
      const fotoId = uid();
      const ok = await saveArquivo(fotoId, { nome: "foto.jpg", tipo: "image/jpeg", dataUrl: photoPreview });
      if (!ok) {
        alert("Não foi possível salvar a foto — provavelmente falta espaço no aparelho. Verifique o indicador de espaço no topo.");
        setUploading(false);
        return;
      }
      fotoIds = [fotoId];
    }
    onAddAvanco({ id: uid(), etapaId: etapa.id, obraId: etapa.obraId, fecha: todayISO(), texto: texto.trim() || "(foto)", fotoIds });
    setTexto(""); setPhotoPreview(null); setUploading(false);
  };

  const addSub = () => {
    if (!novoSub.trim()) return;
    onAddSub(etapa.id, novoSub.trim());
    setNovoSub("");
  };

  return (
    <div style={{ marginLeft: depth * 14 }}>
      <div style={{ borderColor: C.border }} className="border rounded-md overflow-hidden mb-2">
        <div className="flex items-center gap-1.5 p-2.5" style={{ background: C.bg }}>
          <button onClick={() => onToggle(etapa.id)} style={{ borderColor: etapa.completada ? C.green : C.border, background: etapa.completada ? C.green : "transparent" }} className="w-4 h-4 border-2 rounded flex items-center justify-center shrink-0 text-white text-[10px]">{etapa.completada ? "✓" : ""}</button>
          <button onClick={() => setOpenSub(!openSub)} title="Subetapas" className="shrink-0">{temFilhos ? (openSub ? "📂" : "📁") : "📄"}</button>
          {editando ? (
            <input value={nomeEdit} onChange={(e) => setNomeEdit(e.target.value)} onKeyDown={(e) => e.key === "Enter" && salvarNome()} onBlur={salvarNome} autoFocus style={{ borderColor: C.border, color: C.ink, background: C.surface }} className="flex-1 min-w-0 border rounded px-2 py-0.5 text-sm outline-none" />
          ) : (
            <span onClick={() => setOpenAvancos(!openAvancos)} style={{ color: etapa.completada ? C.inkMuted : C.ink, textDecoration: etapa.completada ? "line-through" : "none" }} className="text-sm flex-1 min-w-0 truncate cursor-pointer">{etapa.texto}</span>
          )}
          {temFilhos && <span style={{ color: C.inkMuted }} className="text-[10px] font-mono shrink-0">{filhos.filter((f) => f.completada).length}/{filhos.length}</span>}
          {list.length > 0 && <span style={{ color: C.inkMuted }} className="text-xs font-mono shrink-0">📷{list.length}</span>}
          {!editando && <button onClick={() => { setNomeEdit(etapa.texto); setEditando(true); }} style={{ color: C.inkMuted }} className="shrink-0">✎</button>}
          <button onClick={() => setOpenAvancos(!openAvancos)} style={{ color: C.inkMuted }} className="shrink-0">{openAvancos ? "▲" : "▼"}</button>
          <button onClick={() => onRemove(etapa.id)} style={{ color: C.rust }} className="shrink-0">🗑</button>
        </div>

        {openAvancos && (
          <div style={{ background: C.surface }} className="p-3 border-t">
            <div className="space-y-2 mb-3">
              {list.map((a) => (
                <div key={a.id} style={{ background: C.bg, borderColor: C.border }} className="border rounded p-2.5 flex gap-2">
                  {a.fotoIds?.map((fid) => <Thumbnail key={fid} fotoId={fid} fileCache={fileCache} loadFile={loadFile} onView={onViewImage} />)}
                  <div className="flex-1">
                    <span style={{ color: C.inkMuted }} className="text-[11px] font-mono">{fmt(a.fecha)}</span>
                    <p style={{ color: C.ink }} className="text-sm">{a.texto}</p>
                  </div>
                  <div className="flex gap-2 shrink-0">
                    <button onClick={() => { const nv = prompt("Editar avanço:", a.texto); if (nv != null && nv.trim()) onEditAvanco(a.id, nv.trim()); }} style={{ color: C.inkMuted }}>✎</button>
                    <button onClick={() => onDeleteAvanco(a.id)} style={{ color: C.rust }}>🗑</button>
                  </div>
                </div>
              ))}
              {list.length === 0 && <p style={{ color: C.inkMuted }} className="text-xs font-mono">Sem avanços registrados ainda.</p>}
            </div>
            {photoPreview && (
              <div className="mb-2 flex items-center gap-2">
                <img src={photoPreview} className="w-14 h-14 object-cover rounded border" style={{ borderColor: C.border }} />
                <button onClick={() => setPhotoPreview(null)} style={{ color: C.rust }} className="text-xs font-mono">remover foto</button>
              </div>
            )}
            <div className="flex gap-2">
              <input value={texto} onChange={(e) => setTexto(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="Avanço de hoje..." style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-3 py-1.5 text-sm outline-none" />
              <input ref={inputRef} type="file" accept="image/*" capture="environment" onChange={handlePhoto} className="hidden" />
              <button onClick={() => inputRef.current?.click()} style={{ borderColor: C.border, color: C.ink }} className="border rounded px-2.5 shrink-0">📷</button>
              <button onClick={submit} disabled={(!texto.trim() && !photoPreview) || uploading} style={{ background: C.ink }} className="text-white rounded px-3 disabled:opacity-40 shrink-0">+</button>
            </div>
          </div>
        )}
      </div>

      {openSub && (
        <div style={{ borderLeft: `2px dashed ${C.border}`, marginLeft: 8 }} className="pl-2 mb-2">
          {filhos.map((f) => (
            <EtapaNode key={f.id} etapa={f} allEtapas={allEtapas} avancos={avancos} depth={0} onToggle={onToggle} onRemove={onRemove} onAddSub={onAddSub} onEditEtapa={onEditEtapa} onAddAvanco={onAddAvanco} onEditAvanco={onEditAvanco} onDeleteAvanco={onDeleteAvanco} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={onViewImage} nomesHistoricos={nomesHistoricos} />
          ))}
          <div className="flex gap-2 mb-2">
            <input value={novoSub} onChange={(e) => setNovoSub(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addSub()} placeholder="Nova subetapa" list="nomes-etapas" style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-3 py-1.5 text-sm outline-none" />
            <button onClick={addSub} disabled={!novoSub.trim()} style={{ background: C.teal }} className="text-white rounded px-3 disabled:opacity-40 shrink-0">+</button>
          </div>
        </div>
      )}
    </div>
  );
}

function EtapasSection({ obraId, etapas, avancos, onAdd, onToggle, onRemove, onEditEtapa, onAddAvanco, onEditAvanco, onDeleteAvanco, fileCache, loadFile, saveArquivo, onViewImage }) {
  const [texto, setTexto] = useState("");
  const todasObra = etapas.filter((e) => e.obraId === obraId).map((e) => ({ ...e, obraId }));
  const raiz = todasObra.filter((e) => !e.parentId);
  const done = todasObra.filter((e) => e.completada).length;
  const nomesHistoricos = [...new Set(etapas.map((e) => e.texto).filter(Boolean))];
  const submit = () => { if (!texto.trim()) return; onAdd({ id: uid(), obraId, parentId: null, texto: texto.trim(), completada: false }); setTexto(""); };
  const addSub = (parentId, txt) => onAdd({ id: uid(), obraId, parentId, texto: txt, completada: false });
  return (
    <div>
      <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mb-2">📁 abre subetapas · toque no texto para registrar avanços com foto.</p>

        {raiz.map((e) => (
          <EtapaNode key={e.id} etapa={e} allEtapas={todasObra} avancos={avancos} depth={0} onToggle={onToggle} onRemove={onRemove} onAddSub={addSub} onEditEtapa={onEditEtapa} onAddAvanco={onAddAvanco} onEditAvanco={onEditAvanco} onDeleteAvanco={onDeleteAvanco} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={onViewImage} nomesHistoricos={nomesHistoricos} />
        ))}
        {raiz.length === 0 && <p style={{ color: C.inkMuted }} className="text-sm font-mono">Sem etapas cadastradas.</p>}

      <div className="flex gap-2">
        <input value={texto} onChange={(e) => setTexto(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="Ex: instalação elétrica" list="nomes-etapas" style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-3 py-1.5 text-sm outline-none" />

        <button onClick={submit} disabled={!texto.trim()} style={{ background: C.ink }} className="text-white rounded px-3 disabled:opacity-40 shrink-0">+</button>
      </div>
    </div>
  );
}

function ReportView({ obras, registros, etapas, avancos, onBack }) {
  const [copied, setCopied] = useState(false);
  const cutoff = todayISO();
  const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
  const reportText = useMemo(() => {
    const lines = [`*RELATÓRIO SEMANAL — GESTÃO & CONTROLE*`, `${fmt(weekAgo)} a ${fmt(cutoff)}`, ""];
    const openPend = registros.filter((r) => r.categoria === "pendencia" && !r.resolvido);
    if (openPend.length > 0) {
      lines.push(`*⚠ PENDÊNCIAS ABERTAS (${openPend.length})*`);
      openPend.forEach((c) => { const o = obras.find((x) => x.id === c.obraId); lines.push(`  • [${o?.cliente || "?"}] ${c.texto}`); });
      lines.push("");
    }
    let any = false;
    obras.forEach((obra) => {
      const regRecent = registros.filter((r) => r.obraId === obra.id && r.fecha >= weekAgo).sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
      const avRecent = avancos.filter((a) => a.obraId === obra.id && a.fecha >= weekAgo).sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
      const etapasObra = etapas.filter((e) => e.obraId === obra.id);
      const doneCount = etapasObra.filter((e) => e.completada).length;
      if (regRecent.length === 0 && avRecent.length === 0 && etapasObra.length === 0) return;
      any = true;
      lines.push(`*${obra.cliente}* (${ESTADOS[obra.estado].label}) — ${obra.endereco}`);
      if (etapasObra.length > 0) lines.push(`  Etapas: ${doneCount}/${etapasObra.length} concluídas`);
      avRecent.forEach((a) => lines.push(`  • [Avanço] ${a.texto}`));
      regRecent.forEach((r) => lines.push(`  • [${REG_CATS[r.categoria].label}] ${r.texto}`));
      lines.push("");
    });
    if (!any && openPend.length === 0) lines.push("Sem novidades registradas essa semana.");
    return lines.join("\n");
  }, [obras, registros, etapas, avancos]);
  const copy = async () => { try { await navigator.clipboard.writeText(reportText); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) {} };
  const openWhatsapp = () => window.open(`https://wa.me/?text=${encodeURIComponent(reportText)}`, "_blank");
  const openEmail = () => { const subject = encodeURIComponent(`Relatório semanal — ${fmt(weekAgo)} a ${fmt(cutoff)}`); const body = encodeURIComponent(reportText.replace(/\*/g, "")); window.location.href = `mailto:?subject=${subject}&body=${body}`; };
  return (
    <div>
      <button onClick={onBack} style={{ color: C.inkMuted }} className="flex items-center gap-1 text-sm font-mono mb-4">‹ voltar</button>
      <h2 style={{ color: C.ink }} className="text-xl font-extrabold uppercase tracking-wide mb-1">Relatório semanal</h2>
      <p style={{ color: C.inkMuted }} className="text-sm font-mono mb-4">{fmt(weekAgo)} — {fmt(cutoff)}</p>
      <pre style={{ background: C.surface, borderColor: C.border, color: C.ink }} className="border rounded-md p-4 text-sm whitespace-pre-wrap font-sans leading-relaxed mb-4">{reportText}</pre>
      <div className="flex flex-wrap gap-2">
        <button onClick={openWhatsapp} style={{ background: C.green }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">💬 WhatsApp</button>
        <button onClick={openEmail} style={{ background: C.blue }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">✉ Email</button>
        <button onClick={copy} style={{ borderColor: C.border, color: C.ink }} className="border font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">{copied ? "✓ Copiado" : "⧉ Copiar"}</button>
      </div>
    </div>
  );
}

function CriarContaScreen({ onDone }) {
  const [step, setStep] = useState("form");
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [senha2, setSenha2] = useState("");
  const [aceito, setAceito] = useState(false);
  const [erro, setErro] = useState("");
  const [salvando, setSalvando] = useState(false);
  const [authDraft, setAuthDraft] = useState(null);
  const [recoveryCode, setRecoveryCode] = useState("");
  const [copiado, setCopiado] = useState(false);

  const criarConta = async () => {
    setErro("");
    if (!email.trim()) { setErro("Informe um email ou telefone."); return; }
    if (senha.length < 4) { setErro("A senha precisa ter ao menos 4 caracteres."); return; }
    if (senha !== senha2) { setErro("As senhas não coincidem."); return; }
    if (!aceito) { setErro("Você precisa aceitar os Termos de Uso."); return; }
    setSalvando(true);
    const salt = randomCode(16);
    const passwordHash = await sha256Hex(salt + senha);
    const code = randomCode(10);
    const recoveryHash = await sha256Hex(code);
    setAuthDraft({ email: email.trim(), salt, passwordHash, recoveryHash, passkeyCredentialId: null, createdAt: todayISO() });
    setRecoveryCode(code);
    setSalvando(false);
    setStep("recovery");
  };

  const copiarCodigo = async () => {
    try { await navigator.clipboard.writeText(recoveryCode); setCopiado(true); setTimeout(() => setCopiado(false), 2000); } catch (e) {}
  };

  const configurarBiometria = async () => {
    try {
      const cred = await navigator.credentials.create({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          rp: { name: "Gestão & Controle" },
          user: { id: crypto.getRandomValues(new Uint8Array(16)), name: authDraft.email, displayName: authDraft.email },
          pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
          authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
          timeout: 60000,
        },
      });
      onDone({ ...authDraft, passkeyCredentialId: bufToBase64url(cred.rawId) });
    } catch (err) {
      console.error(err);
      alert("Não foi possível configurar agora. Você pode continuar só com senha.");
      onDone(authDraft);
    }
  };

  if (step === "recovery") {
    return (
      <AuthWrap>
        <div className="text-center mb-4">
          <span className="text-3xl">🔑</span>
          <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mt-2">Seu código de recuperação</h2>
        </div>
        <p style={{ color: C.inkMuted }} className="text-sm mb-3">Guarde este código em lugar seguro. É a ÚNICA forma de recuperar sua senha, já que este app não tem servidor para enviar email/SMS.</p>
        <div style={{ background: C.bg, borderColor: C.border }} className="border rounded p-4 text-center mb-3">
          <span style={{ color: C.ink, letterSpacing: "0.15em" }} className="text-xl font-mono font-extrabold">{recoveryCode}</span>
        </div>
        <button onClick={copiarCodigo} style={{ borderColor: C.border, color: C.ink }} className="w-full border font-bold uppercase tracking-wide text-sm rounded py-2 mb-2">{copiado ? "✓ Copiado" : "⧉ Copiar código"}</button>
        <button onClick={() => setStep(biometriaSuportada() ? "biometria" : "final")} style={{ background: C.amber }} className="w-full text-white font-bold uppercase tracking-wide rounded py-2.5">Já guardei, continuar</button>
      </AuthWrap>
    );
  }

  if (step === "biometria") {
    return (
      <AuthWrap>
        <div className="text-center mb-4">
          <span className="text-3xl">🔒</span>
          <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mt-2">Login rápido</h2>
        </div>
        <p style={{ color: C.inkMuted }} className="text-sm mb-4">Quer usar sua digital, PIN ou padrão do celular para entrar mais rápido da próxima vez? Pode configurar depois também.</p>
        <button onClick={configurarBiometria} style={{ background: C.amber }} className="w-full text-white font-bold uppercase tracking-wide rounded py-2.5 mb-2">Configurar agora</button>
        <button onClick={() => onDone(authDraft)} style={{ color: C.inkMuted }} className="w-full text-xs font-mono uppercase py-2">Pular por enquanto</button>
      </AuthWrap>
    );
  }

  return (
    <AuthWrap>
      <div className="flex items-center justify-center gap-2.5 mb-1">
        <img src="logo.png" alt="G&C" className="w-11 h-11 rounded-full shrink-0" />
        <h1 style={{ color: C.ink }} className="font-comic text-xl tracking-wide whitespace-nowrap">Gestão & Controle</h1>
      </div>
      <p style={{ color: C.inkMuted }} className="text-xs font-mono text-center mb-5">Criar conta</p>
      <div className="space-y-3">
        <div>
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Email ou telefone</label>
          <input value={email} onChange={(e) => setEmail(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" placeholder="voce@exemplo.com" autoFocus />
        </div>
        <div>
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Senha</label>
          <input type="password" value={senha} onChange={(e) => setSenha(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" placeholder="Mínimo 4 caracteres" />
        </div>
        <div>
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Confirmar senha</label>
          <input type="password" value={senha2} onChange={(e) => setSenha2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && criarConta()} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" />
        </div>
        <label className="flex items-start gap-2 text-xs" style={{ color: C.inkMuted }}>
          <input type="checkbox" checked={aceito} onChange={(e) => setAceito(e.target.checked)} className="mt-0.5" />
          <span>Li e aceito os Termos de Uso e a Política de Privacidade <span className="italic">(em elaboração)</span>.</span>
        </label>
        {erro && <p style={{ color: C.rust }} className="text-xs font-mono">{erro}</p>}
      </div>
      <button onClick={criarConta} disabled={salvando} style={{ background: C.amber }} className="w-full mt-5 text-white font-bold uppercase tracking-wide rounded py-2.5 disabled:opacity-50">{salvando ? "Criando..." : "Criar conta"}</button>
      <p style={{ color: C.inkMuted }} className="text-[11px] font-mono text-center mt-3">Tudo fica salvo só neste aparelho.</p>
    </AuthWrap>
  );
}

function RecuperarSenhaScreen({ auth, onBack, onReset }) {
  const [codigo, setCodigo] = useState("");
  const [novaSenha, setNovaSenha] = useState("");
  const [novaSenha2, setNovaSenha2] = useState("");
  const [validado, setValidado] = useState(false);
  const [erro, setErro] = useState("");

  const validarCodigo = async () => {
    setErro("");
    const hash = await sha256Hex(codigo.trim().toUpperCase());
    if (hash === auth.recoveryHash) setValidado(true);
    else setErro("Código inválido.");
  };

  const redefinir = async () => {
    setErro("");
    if (novaSenha.length < 4) { setErro("A senha precisa ter ao menos 4 caracteres."); return; }
    if (novaSenha !== novaSenha2) { setErro("As senhas não coincidem."); return; }
    const salt = randomCode(16);
    const passwordHash = await sha256Hex(salt + novaSenha);
    onReset({ ...auth, salt, passwordHash });
  };

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }} className="flex items-center justify-center p-6">
      <div style={{ background: C.surface, borderColor: C.border }} className="border rounded-lg p-6 w-full max-w-sm shadow-xl">
        <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mb-4">Recuperar senha</h2>
        {!validado ? (
          <>
            <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Código de recuperação</label>
            <input value={codigo} onChange={(e) => setCodigo(e.target.value)} onKeyDown={(e) => e.key === "Enter" && validarCodigo()} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none uppercase" placeholder="Cole o código guardado" autoFocus />
            {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-2">{erro}</p>}
            <button onClick={validarCodigo} style={{ background: C.amber }} className="w-full mt-4 text-white font-bold uppercase tracking-wide rounded py-2.5">Validar</button>
          </>
        ) : (
          <>
            <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Nova senha</label>
            <input type="password" value={novaSenha} onChange={(e) => setNovaSenha(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" autoFocus />
            <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase mt-3 block">Confirmar nova senha</label>
            <input type="password" value={novaSenha2} onChange={(e) => setNovaSenha2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && redefinir()} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" />
            {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-2">{erro}</p>}
            <button onClick={redefinir} style={{ background: C.amber }} className="w-full mt-4 text-white font-bold uppercase tracking-wide rounded py-2.5">Redefinir senha</button>
          </>
        )}
        <button onClick={onBack} style={{ color: C.inkMuted }} className="w-full text-xs font-mono uppercase mt-3">‹ voltar ao login</button>
      </div>
    </div>
  );
}

function LoginScreen({ auth, onUnlock }) {
  const [senha, setSenha] = useState("");
  const [lembrar, setLembrar] = useState(true);
  const [erro, setErro] = useState("");
  const [recuperar, setRecuperar] = useState(false);
  const podeBiometria = !!auth.passkeyCredentialId && biometriaSuportada();

  const entrarComBiometria = async () => {
    setErro("");
    try {
      await navigator.credentials.get({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials: [{ id: base64urlToBuf(auth.passkeyCredentialId), type: "public-key" }],
          userVerification: "required",
          timeout: 60000,
        },
      });
      onUnlock(lembrar, null);
    } catch (err) {
      console.error(err);
      setErro("Não foi possível validar. Tente com a senha.");
    }
  };

  const entrarComSenha = async () => {
    setErro("");
    const hash = await sha256Hex(auth.salt + senha);
    if (hash === auth.passwordHash) onUnlock(lembrar, null);
    else setErro("Senha incorreta.");
  };

  if (recuperar) return <RecuperarSenhaScreen auth={auth} onBack={() => setRecuperar(false)} onReset={(novoAuth) => onUnlock(true, novoAuth)} />;

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }} className="flex flex-col items-center justify-center p-6">
      <div style={{ background: C.surface, borderColor: C.border }} className="border rounded-lg p-6 w-full max-w-sm shadow-xl">

        </div>
        <p style={{ color: C.inkMuted }} className="text-xs font-mono text-center mb-5">{auth.email}</p>

          <button onClick={entrarComBiometria} style={{ background: C.ink }} className="w-full text-white font-bold uppercase tracking-wide rounded py-2.5 mb-3">🔒 Entrar com digital / PIN</button>
        )}
        <div>
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Senha</label>
          <input type="password" value={senha} onChange={(e) => setSenha(e.target.value)} onKeyDown={(e) => e.key === "Enter" && entrarComSenha()} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" autoFocus={!podeBiometria} />
        </div>
        <label className="flex items-center gap-2 text-xs mt-3" style={{ color: C.inkMuted }}>
          <input type="checkbox" checked={lembrar} onChange={(e) => setLembrar(e.target.checked)} />

        </label>
        {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-2">{erro}</p>}
        <button onClick={entrarComSenha} style={{ background: C.amber }} className="w-full mt-4 text-white font-bold uppercase tracking-wide rounded py-2.5">Entrar</button>
        <button onClick={() => setRecuperar(true)} style={{ color: C.inkMuted }} className="w-full text-xs font-mono uppercase mt-3">Esqueceu sua senha?</button>
      </div>
      <p style={{ color: C.inkMuted }} className="text-[11px] font-mono text-center mt-5">© 2026 Gestão & Controle</p>
    </div>
  );
}

function GestorObras() {
  const [data, setData] = useState(EMPTY);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("dashboard");
  const [selectedId, setSelectedId] = useState(null);
  const [showModal, setShowModal] = useState(false);
  const [fileCache, setFileCache] = useState({});
  const [lightboxImg, setLightboxImg] = useState(null);
  const [perfil, setPerfil] = useState(null);
  const [perfilLoading, setPerfilLoading] = useState(true);
  const [auth, setAuth] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [unlocked, setUnlocked] = useState(false);
  const [temaEscuro, setTemaEscuro] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get("gestor-data");
        setData(res ? { ...EMPTY, ...JSON.parse(res.value) } : EMPTY);
      } catch (e) { setData(EMPTY); }
      setLoading(false);
      try {
        const res = await window.storage.get("perfil");
        setPerfil(res ? JSON.parse(res.value) : null);
      } catch (e) { setPerfil(null); }
      setPerfilLoading(false);
      try {
        const res = await window.storage.get("auth");
        const a = res ? JSON.parse(res.value) : null;
        setAuth(a);
        if (a) {
          const sess = await window.storage.get("auth-session");
          if (sess) {
            const s = JSON.parse(sess.value);
            if (s.until && new Date(s.until).getTime() > Date.now()) setUnlocked(true);
          }
        }
      } catch (e) { setAuth(null); }
      setAuthLoading(false);
      try {
        const res = await window.storage.get("tema");
        setTemaEscuro(res ? res.value === "escuro" : false);
      } catch (e) {}
    })();
  }, []);

  const alternarTema = () => {
    const novo = !temaEscuro;
    setTemaEscuro(novo);
    window.storage.set("tema", novo ? "escuro" : "claro").catch(() => {});
  };

  const temaVars = useMemo(() => {
    const p = temaEscuro ? TEMA_ESCURO : TEMA_CLARO;
    return {
      "--c-bg": p.bg, "--c-surface": p.surface, "--c-ink": p.ink, "--c-inkMuted": p.inkMuted,
      "--c-border": p.border, "--c-amber": p.amber, "--c-blue": p.blue, "--c-rust": p.rust,
      "--c-green": p.green, "--c-steel": p.steel, "--c-teal": p.teal,
      background: p.bg, minHeight: "100vh", colorScheme: temaEscuro ? "dark" : "light",
    };
  }, [temaEscuro]);

  const salvarPerfil = async (p) => {
    setPerfil(p);
    try { await window.storage.set("perfil", JSON.stringify(p)); } catch (e) { console.error(e); }
  };

  const contaCriada = async (novoAuth) => {
    setAuth(novoAuth);
    try { await window.storage.set("auth", JSON.stringify(novoAuth)); } catch (e) { console.error(e); }
    setUnlocked(true);
  };

  const desbloquear = async (lembrar, novoAuth) => {
    if (novoAuth) {
      setAuth(novoAuth);
      try { await window.storage.set("auth", JSON.stringify(novoAuth)); } catch (e) { console.error(e); }
    }
    if (lembrar) {
      const until = new Date(Date.now() + 30 * 86400000).toISOString();
      try { await window.storage.set("auth-session", JSON.stringify({ until })); } catch (e) {}
    }
    setUnlocked(true);
  };

  const sair = () => {
    try { localStorage.removeItem("auth-session"); } catch (e) {}
    setUnlocked(false);
  };

  const persist = async (next) => { setData(next); try { await window.storage.set("gestor-data", JSON.stringify(next)); } catch (e) { console.error(e); } };
  const saveArquivo = async (id, payload) => {
    try {
      const res = await fetch("/api/arquivo-set", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: `Bearer ${APP_TOKEN}` },
        body: JSON.stringify({ id, payload: JSON.stringify(payload) }),
      });
      const data = await res.json();
      if (data.ok) {
        setFileCache((p) => ({ ...p, [id]: payload }));
        return true;
      }
      console.error("Falha ao salvar arquivo no servidor", data);
      return false;
    } catch (e) {
      console.error("Falha ao salvar arquivo (sem conexão?)", e);
      return false;
    }
  };
  const loadFile = async (id) => {
    if (fileCache[id]) return;
    try {
      const res = await fetch(`/api/arquivo-get?id=${encodeURIComponent(id)}`, {
        headers: { authorization: `Bearer ${APP_TOKEN}` },
      });
      if (res.status === 404) { setFileCache((p) => ({ ...p, [id]: "MISSING" })); return; }
      const data = await res.json();
      setFileCache((p) => ({ ...p, [id]: data.ok ? JSON.parse(data.payload) : "MISSING" }));
    } catch (e) {
      setFileCache((p) => ({ ...p, [id]: "MISSING" }));
    }
  };
  const deleteArquivoRemoto = (id) => {
    fetch(`/api/arquivo-delete?id=${encodeURIComponent(id)}`, {
      method: "DELETE",
      headers: { authorization: `Bearer ${APP_TOKEN}` },
    }).catch(() => {});
  };

  const addObra = (obra) => { persist({ ...data, obras: [obra, ...data.obras] }); setShowModal(false); };
  const changeEstado = (obraId, estado) => persist({ ...data, obras: data.obras.map((o) => (o.id === obraId ? { ...o, estado } : o)) });
  const deleteObra = (obraId) => {
    persist({ ...data,
      obras: data.obras.filter((o) => o.id !== obraId),
      registros: data.registros.filter((r) => r.obraId !== obraId),
      etapas: data.etapas.filter((e) => e.obraId !== obraId),
      avancos: data.avancos.filter((a) => a.obraId !== obraId),
      equipe: data.equipe.filter((m) => m.obraId !== obraId),
      documentos: data.documentos.filter((d) => d.obraId !== obraId),
    });
    setView("dashboard");
  };
  const addReg = (r) => persist({ ...data, registros: [r, ...data.registros] });
  const editReg = (id, texto, resolvidoOverride) => persist({ ...data, registros: data.registros.map((r) => (r.id === id ? { ...r, texto, ...(resolvidoOverride !== undefined ? { resolvido: resolvidoOverride } : {}) } : r)) });
  const deleteReg = (id) => persist({ ...data, registros: data.registros.filter((r) => r.id !== id) });
  const addEtapa = (e) => persist({ ...data, etapas: [...data.etapas, e] });
  const toggleEtapa = (id) => persist({ ...data, etapas: data.etapas.map((e) => (e.id === id ? { ...e, completada: !e.completada } : e)) });
  const editEtapa = (id, texto) => persist({ ...data, etapas: data.etapas.map((e) => (e.id === id ? { ...e, texto } : e)) });
  const removeEtapa = (id) => {
    const idsParaBorrar = new Set([id]);
    let changed = true;
    while (changed) {
      changed = false;
      data.etapas.forEach((e) => { if (e.parentId && idsParaBorrar.has(e.parentId) && !idsParaBorrar.has(e.id)) { idsParaBorrar.add(e.id); changed = true; } });
    }
    persist({ ...data, etapas: data.etapas.filter((e) => !idsParaBorrar.has(e.id)), avancos: data.avancos.filter((a) => !idsParaBorrar.has(a.etapaId)) });
  };
  const addAvanco = (a) => persist({ ...data, avancos: [a, ...data.avancos] });
  const editAvanco = (id, texto) => persist({ ...data, avancos: data.avancos.map((a) => (a.id === id ? { ...a, texto } : a)) });
  const deleteAvanco = (id) => persist({ ...data, avancos: data.avancos.filter((a) => a.id !== id) });
  const addEquipo = (m) => persist({ ...data, equipe: [...data.equipe, m] });
  const removeEquipo = (id) => persist({ ...data, equipe: data.equipe.filter((m) => m.id !== id) });
  const toggleHoje = (id) => {
    const hoje = todayISO();
    persist({ ...data, equipe: data.equipe.map((m) => { if (m.id !== id) return m; const has = m.asistencias?.includes(hoje); return { ...m, asistencias: has ? m.asistencias.filter((d) => d !== hoje) : [...(m.asistencias || []), hoje] }; }) });
  };
  const addDoc = (d) => persist({ ...data, documentos: [d, ...data.documentos] });
  const deleteDoc = (id, arquivoId) => { if (arquivoId) deleteArquivoRemoto(arquivoId); persist({ ...data, documentos: data.documentos.filter((d) => d.id !== id) }); };

  const exportBackup = () => {
    const backup = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key === "gestor-data" || key.startsWith("arquivo:")) backup[key] = localStorage.getItem(key);
    }
    const blob = new Blob([JSON.stringify(backup)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `gestor-obras-backup-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importInputRef = useRef(null);
  const importBackup = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const keys = Object.keys(parsed);
      if (!keys.includes("gestor-data")) throw new Error("arquivo inválido");
      if (!window.confirm(`Isso vai SUBSTITUIR os dados atuais por este backup (${keys.length} itens). Continuar?`)) {
        e.target.value = "";
        return;
      }
      keys.forEach((k) => localStorage.setItem(k, parsed[k]));
      window.location.reload();
    } catch (err) {
      alert("Não foi possível ler este arquivo de backup.");
      console.error(err);
    }
    e.target.value = "";
  };

  const espacoUsadoMB = useMemo(() => {
    let bytes = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      const val = localStorage.getItem(key) || "";
      bytes += key.length + val.length;
    }
    return bytes / (1024 * 1024);
  }, [data, fileCache]);
  const LIMITE_MB = 5; // estimativa conservadora do limite típico do navegador

  const [showLimpar, setShowLimpar] = useState(false);
  const limparTudo = () => {
    const keysParaBorrar = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key === "gestor-data" || key.startsWith("arquivo:")) keysParaBorrar.push(key);
    }
    keysParaBorrar.forEach((k) => localStorage.removeItem(k));
    setData(EMPTY);
    setFileCache({});
    setShowLimpar(false);
    setView("dashboard");
  };

  const { obras, registros, etapas, avancos, equipe, documentos } = data;
  const selectedObra = obras.find((o) => o.id === selectedId);
  const totalPendientes = obras.reduce((acc, o) => acc + registros.filter((r) => r.obraId === o.id && r.categoria === "pendencia" && !r.resolvido).length + etapas.filter((e) => e.obraId === o.id && !e.completada).length, 0);

  let content;
  if (loading || perfilLoading || authLoading) {
    content = <SplashScreen />;
  } else if (!perfil) {
    content = <BemVindoScreen onSave={salvarPerfil} />;
  } else if (!auth) {
    content = <CriarContaScreen onDone={contaCriada} />;
  } else if (!unlocked) {
    content = <LoginScreen auth={auth} onUnlock={desbloquear} />;
  } else {
    content = (
    <div className="p-4">
      {view === "dashboard" && (
        <>
          <div className="flex items-start gap-3 mb-5 pt-2">
            <img src="logo.png" alt="G&C" className="w-14 h-14 rounded-full shrink-0" />
            <div className="flex-1 min-w-0">
              <div className="flex items-center justify-between gap-2">
                <span style={{ color: C.inkMuted }} className="text-[11px] font-mono truncate">{perfil.empresa}</span>
                <span style={{ color: C.inkMuted }} className="text-[11px] font-mono truncate">{perfil.usuario}</span>
              </div>
              <h1 style={{ color: C.ink }} className="font-comic text-xl tracking-wide leading-tight mt-0.5">Gestão & Controle</h1>
              <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                <span title="Espaço usado no aparelho" style={{ color: espacoUsadoMB > LIMITE_MB * 0.8 ? C.rust : C.inkMuted }} className="text-[11px] font-mono">
                  💾 {espacoUsadoMB.toFixed(1)}/{LIMITE_MB}MB
                </span>
                <button onClick={exportBackup} title="Baixar backup completo" style={{ color: C.inkMuted }} className="text-lg px-0.5">⤓</button>
                <input ref={importInputRef} type="file" accept="application/json" onChange={importBackup} className="hidden" />
                <button onClick={() => importInputRef.current?.click()} title="Restaurar de um backup" style={{ color: C.inkMuted }} className="text-lg px-0.5">⤒</button>
                <button onClick={sair} title="Sair (bloquear app)" style={{ color: C.inkMuted }} className="flex items-center gap-0.5 text-[11px] font-mono">🔒 sair</button>
                <button onClick={alternarTema} title="Alternar modo claro/escuro" style={{ color: C.inkMuted }} className="text-lg px-0.5">{temaEscuro ? "☀️" : "🌙"}</button>
              </div>
            </div>
          </div>
          <div className="flex flex-wrap gap-2 mb-2">
            <button onClick={() => setShowModal(true)} style={{ background: C.amber }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">+ Nova obra</button>
            <button onClick={() => setView("pendientes")} style={{ background: totalPendientes > 0 ? C.rust : "transparent", borderColor: C.rust, color: totalPendientes > 0 ? "#fff" : C.rust }} className="border font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">● Pendências {totalPendientes > 0 && `(${totalPendientes})`}</button>
            <button onClick={() => setView("report")} style={{ borderColor: C.ink, color: C.ink }} className="border font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">📅 Relatório semanal</button>
          </div>
          <button onClick={() => setShowLimpar(true)} style={{ color: C.inkMuted }} className="text-[11px] font-mono uppercase mb-4 underline decoration-dotted">Limpar todos os dados (teste)</button>
          {obras.length === 0 ? (
            <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-16">Nenhuma obra cadastrada. Comece com "Nova obra".</p>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {obras.map((obra) => {
                const oe = registros.filter((r) => r.obraId === obra.id);
                const oa = avancos.filter((a) => a.obraId === obra.id);
                const lastDates = [...oe.map((r) => r.fecha), ...oa.map((a) => a.fecha)].sort().reverse();
                const pendCount = oe.filter((r) => r.categoria === "pendencia" && !r.resolvido).length + etapas.filter((e) => e.obraId === obra.id && !e.completada).length;
                return <TicketCard key={obra.id} obra={obra} pendCount={pendCount} lastDate={lastDates[0]} onOpen={() => { setSelectedId(obra.id); setView("obra"); }} />;
              })}
            </div>
          )}
        </>
      )}
      {view === "obra" && selectedObra && (
        <ObraDetail obra={selectedObra} registros={registros} etapas={etapas} avancos={avancos} equipe={equipe} documentos={documentos}
          onBack={() => setView("dashboard")} onAddReg={addReg} onEditReg={editReg} onDeleteReg={deleteReg}
          onChangeEstado={changeEstado} onDeleteObra={deleteObra}
          onAddEtapa={addEtapa} onToggleEtapa={toggleEtapa} onRemoveEtapa={removeEtapa} onEditEtapa={editEtapa}
          onAddAvanco={addAvanco} onEditAvanco={editAvanco} onDeleteAvanco={deleteAvanco}
          onAddEquipo={addEquipo} onRemoveEquipo={removeEquipo} onToggleHoje={toggleHoje}
          onAddDoc={addDoc} onDeleteDoc={deleteDoc} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={setLightboxImg} />
      )}
      {view === "pendientes" && <PendientesView obras={obras} registros={registros} etapas={etapas} onBack={() => setView("dashboard")} onOpenObra={(id) => { setSelectedId(id); setView("obra"); }} />}
      {view === "report" && <ReportView obras={obras} registros={registros} etapas={etapas} avancos={avancos} onBack={() => setView("dashboard")} />}
      {showModal && <NuevaObraModal onClose={() => setShowModal(false)} onSave={addObra} obras={obras} />}
      {lightboxImg && <Lightbox src={lightboxImg} onClose={() => setLightboxImg(null)} />}
      {showLimpar && <ConfirmarLimpezaModal onClose={() => setShowLimpar(false)} onConfirm={limparTudo} />}
    </div>
    );
  }

  return <div style={temaVars}>{content}</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<GestorObras />);
</script>
<script>
  // Compilamos manualmente forzando runtime clásico (React.createElement),
  // porque el runtime "automático" por default de Babel genera imports de
  // módulo ES que un <script> normal no puede ejecutar (pantalla en blanco).
  (function () {
    var src = document.getElementById("app-source").textContent;
    var out = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    var s = document.createElement("script");
    s.textContent = out;
    document.body.appendChild(s);
  })();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((e) => console.log("SW falhou:", e));
    });
  }
</script>
</body>
</html>
