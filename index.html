function PermissoesScreen({ onBack, usuarioRank = 8 }) {
  const [permissoes, setPermissoes] = useState(null);
  const [erro, setErro] = useState("");
  const [salvandoCelda, setSalvandoCelda] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const r = await apiFetch("/api/permissoes");
        setPermissoes(r.permissoes);
      } catch (err) { setErro(err.message); }
    })();
  }, []);

  const nivelDe = (rank, modulo) => {
    const row = permissoes?.find((p) => p.rank === rank && p.modulo === modulo);
    return row ? row.nivel : "nenhum";
  };

  const ciclo = { nenhum: "visualizar", visualizar: "editar", editar: "nenhum" };
  const corDe = { nenhum: C.inkMuted, visualizar: C.blue, editar: C.green };
  const labelNivel = { nenhum: "Nenhum", visualizar: "Ver", editar: "Editar" };

  const toggle = async (rank, modulo) => {
    const novo = ciclo[nivelDe(rank, modulo)];
    const key = `${rank}-${modulo}`;
    setSalvandoCelda(key);
    setErro("");
    try {
      await apiFetch("/api/permissoes", { method: "PATCH", body: JSON.stringify({ rank, modulo, nivel: novo }) });
      setPermissoes((prev) => {
        const existe = prev.find((p) => p.rank === rank && p.modulo === modulo);
        if (existe) return prev.map((p) => (p.rank === rank && p.modulo === modulo ? { ...p, nivel: novo } : p));
        return [...prev, { rank, modulo, nivel: novo }];
      });
    } catch (err) { setErro(err.message); }
    setSalvandoCelda(null);
  };

  if (!permissoes) return <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-16">Carregando...</p>;

  return (
    <div>
      <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mb-1">🔑 Permissões</h2>
      <p style={{ color: C.inkMuted }} className="text-xs font-mono mb-4">Toque numa célula para alternar: Nenhum → Ver → Editar. Você só altera os ranks abaixo do seu (as linhas apagadas estão travadas).</p>
      <div className="overflow-x-auto -mx-4 px-4">
        <table className="w-full text-xs border-collapse">
          <thead>
            <tr>
              <th className="text-left p-1"></th>
              {MODULOS_OBRA.map((m) => <th key={m.key} style={{ color: C.inkMuted }} className="p-1 font-mono font-normal text-center">{m.glyph}</th>)}
            </tr>
          </thead>
          <tbody>
            {[1, 2, 3, 4, 5, 6, 7, 8].map((rank) => (
              <tr key={rank}>
                <td style={{ color: C.ink }} className="p-1 font-mono whitespace-nowrap pr-2 text-[11px]">{RANK_LABELS[rank]}</td>
                {MODULOS_OBRA.map((m) => {
                  const nivel = nivelDe(rank, m.key);
                  const key = `${rank}-${m.key}`;
                  return (
                    <td key={m.key} className="p-1 text-center">
                      <button onClick={() => toggle(rank, m.key)} disabled={salvandoCelda === key || rank <= usuarioRank || usuarioRank > 3}
                        style={{ borderColor: corDe[nivel], color: corDe[nivel] }}
                        className="border rounded w-14 py-1 text-[10px] font-mono uppercase disabled:opacity-50">
                        {salvandoCelda === key ? "..." : labelNivel[nivel]}
                      </button>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-3">{erro}</p>}
    </div>
  );
}

const MODULOS_OBRA = [
  { key: "equipe", label: "Equipe", glyph: "👥", cajao: "cajon_equipe_2.webp", icone: "icone_equipe_2.webp" },
  { key: "etapas", label: "Etapas", glyph: "☑", cajao: "cajon_etapas_1.webp", icone: "icone_etapas_1.webp" },
  { key: "ferramentas", label: "Ferramentas", glyph: "🔧", cajao: "cajon_ferramentas_4.webp", icone: "icone_ferramentas_4.webp" },
  { key: "materiais", label: "Materiais", glyph: "📦", cajao: "cajon_materiais_5.webp", icone: "icone_materiais_5.webp" },
  { key: "observacoes", label: "Observações", glyph: "📝", cajao: "cajon_observacoes_6.webp", icone: "icone_observacoes_6.webp" },
  { key: "documentos", label: "Documentos", glyph: "📎", cajao: "cajon_documentos_3.webp", icone: "icone_documentos_3.webp" },
];

function ObraDetail({ obra, obraDetalhe, onBack, onChangeEstado, onDeleteObra, onTransferirObra,
  onAddEtapa, onToggleEtapa, onRemoveEtapa, onEditEtapa, onAddFotoEtapa, onDeleteFotoEtapa,
  onAddFerramenta, onDeleteFerramenta, onAddMaterial, onDeleteMaterial, onAddObservacao, onDeleteObservacao, onEditObservacao,
  onAddEquipo, onRemoveEquipo, onToggleHoje, onSetExcecao, usuarioRank, usuarioAPI, niveis,
  onAddDoc, onDeleteDoc, fileCache, loadFile, saveArquivo, onViewImage, modulo, onAbrirModulo }) {
  const [erroObra, setErroObra] = useState("");
  const [erroPresenca, setErroPresenca] = useState("");
  const [transferindo, setTransferindo] = useState(false);
  const [novoResponsavel, setNovoResponsavel] = useState("");
  const { etapas, equipe, ferramentas, materiais, observacoes, documentos } = obraDetalhe;
  const etapasObraCount = etapas.length;
  const etapasObraDone = etapas.filter((e) => e.concluida).length;
  const responsavelAtual = equipe.find((m) => m.usuario_id === obra.responsavel_id);
  // Nível efetivo NESTA obra: o da tela de Permissões, recortado pelo bloqueio que o responsável da obra definiu.
  const meuMembro = equipe.find((m) => m.usuario_id === usuarioAPI?.id);
  const nivelDoModulo = (key) => {
    const base = niveis?.[key] || "nenhum";
    const exc = meuMembro?.excecao_modulos?.[key];
    if (exc === "nenhum") return "nenhum";
    if (exc === "visualizar" && base === "editar") return "visualizar";
    return base;
  };
  const souChefe = usuarioRank <= 2;

  const cycleEstado = async () => {
    setErroObra("");
    const order = ["ativa", "pausada", "concluida"];
    try { await onChangeEstado(obra.id, order[(order.indexOf(obra.estado) + 1) % order.length]); }
    catch (err) { setErroObra(err.message); }
  };

  const excluir = async () => {
    setErroObra("");
    try { await onDeleteObra(obra.id); }
    catch (err) { setErroObra(err.message); }
  };

  const transferir = async () => {
    if (!novoResponsavel) return;
    setErroObra("");
    try {
      await onTransferirObra(obra.id, Number(novoResponsavel));
      setTransferindo(false);
      setNovoResponsavel("");
    } catch (err) { setErroObra(err.message); }
  };

  const contagens = {
    etapas: etapasObraCount > 0 ? `${etapasObraDone}/${etapasObraCount}` : null,
    equipe: equipe.length || null,
    documentos: documentos.length || null,
    ferramentas: ferramentas.length || null,
    materiais: materiais.length || null,
    observacoes: observacoes.length || null,
  };

  if (modulo) {
    const mod = MODULOS_OBRA.find((m) => m.key === modulo);
    const podeEditar = nivelDoModulo(modulo) === "editar";
    return (
      <div>
        <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mb-4 flex flex-wrap items-center gap-2"><img src={mod.icone} alt="" className="w-8 h-8 rounded-full object-cover" draggable="false" /> {mod.label}<AjudaModulo modulo={modulo} /></h2>
        {modulo === "documentos" && <PedidosPanel obraId={obra.id} tipo="documento" tipoLabel="Documentos" equipe={equipe} usuarioAPI={usuarioAPI} />}
        {modulo === "documentos" && <DocumentosSection obraId={obra.id} documentos={documentos} onAdd={onAddDoc} onDelete={onDeleteDoc} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={onViewImage} podeEditar={podeEditar} />}
        {modulo === "equipe" && <EquipeSection obraId={obra.id} equipe={equipe} onAdd={onAddEquipo} onRemove={onRemoveEquipo} onToggleHoje={onToggleHoje} onSetExcecao={onSetExcecao} usuarioRank={usuarioRank} usuarioId={usuarioAPI?.id} responsavelId={obra.responsavel_id} podeEditar={podeEditar} />}
        {modulo === "etapas" && <EtapasSection obraId={obra.id} etapas={etapas} onAdd={onAddEtapa} onToggle={onToggleEtapa} onRemove={onRemoveEtapa} onEditEtapa={onEditEtapa} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={onViewImage} onAddFoto={onAddFotoEtapa} onDeleteFoto={onDeleteFotoEtapa} podeEditar={podeEditar} />}
        {modulo === "ferramentas" && <PedidosPanel obraId={obra.id} tipo="ferramenta" tipoLabel="Ferramentas" equipe={equipe} usuarioAPI={usuarioAPI} />}
        {modulo === "ferramentas" && <ListaSimplesSection items={ferramentas} onAdd={onAddFerramenta} onDelete={onDeleteFerramenta} placeholder="Ex: furadeira, andaime..." color={C.steel} glyph="🔧" datalistId="hist-ferramentas" podeEditar={podeEditar} />}
        {modulo === "materiais" && <PedidosPanel obraId={obra.id} tipo="material" tipoLabel="Materiais" equipe={equipe} usuarioAPI={usuarioAPI} />}
        {modulo === "materiais" && <ListaSimplesSection items={materiais} onAdd={onAddMaterial} onDelete={onDeleteMaterial} placeholder="Ex: 10 sacos de cimento..." color={C.amber} glyph="📦" datalistId="hist-materiais" podeEditar={podeEditar} />}
        {modulo === "observacoes" && (
          <div style={{ background: C.surface, borderColor: C.border }} className="border rounded-md p-4 mb-4">
            <div className="flex items-center justify-between flex-wrap gap-2">
              <p style={{ color: C.inkMuted }} className="text-xs font-mono">
                👤 Responsável: <span style={{ color: C.ink }}>{responsavelAtual ? `${responsavelAtual.nome} (${RANK_LABELS[responsavelAtual.rank]})` : "—"}</span>
              </p>
              {souChefe && <button onClick={() => setTransferindo(!transferindo)} style={{ color: C.blue }} className="text-xs font-mono uppercase">🔄 Transferir</button>}
            </div>
            {transferindo && (
              <div className="flex gap-2 mt-2">
                <select value={novoResponsavel} onChange={(e) => setNovoResponsavel(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-2 py-1.5 text-xs outline-none bg-white">
                  <option value="">Escolha o novo responsável...</option>
                  {equipe.filter((m) => !m.removido_em).map((m) => <option key={m.usuario_id} value={m.usuario_id}>{m.nome} ({RANK_LABELS[m.rank]})</option>)}
                </select>
                <button onClick={transferir} disabled={!novoResponsavel} style={{ background: C.blue }} className="text-white text-xs font-bold uppercase rounded px-3 disabled:opacity-40 shrink-0">Confirmar</button>
              </div>
            )}
            {souChefe && <button onClick={excluir} style={{ color: C.rust }} className="mt-4 text-xs font-mono">🗑 excluir obra</button>}
            {erroObra && <p style={{ color: C.rust }} className="text-xs font-mono mt-2">{erroObra}</p>}
          </div>
        )}
        {modulo === "observacoes" && <ObservacoesSection items={observacoes} onAdd={onAddObservacao} onDelete={onDeleteObservacao} onEdit={onEditObservacao} usuarioAPI={usuarioAPI} podeEditar={podeEditar} />}
      </div>
    );
  }

  return (
    <div>
      <div className="relative -mx-4 -mt-4 mb-3">
        <img src="arquivero_completo_16.webp" alt="" className="w-full h-auto block" draggable="false" style={{ aspectRatio: "1048 / 1797" }} />

        {/* ===== POSICIONAMENTO DO TEXTO SOBRE O ARCHIVERO =====
            Imagem fonte: arquivero_completo_16.webp, 1048×1797px exatos (ver aspectRatio acima).
            % (não px fixo) DE PROPÓSITO: container é w-full/h-auto, escala com a tela do aparelho.
            Margem de contorno = 25% da largura/altura DA PRÓPRIA FOLHA (não da imagem toda) —
            dobrada em relação à versão anterior, pra sobrar espaço visível de forma inequívoca.

            HOJA 1 — borda da folha medida (%): left=1.9% top=4.9% right=44.8% bottom=35.0%
                     (largura=42.9% altura=30.1%) → margem 25%: ~10.7% horizontal, ~7.5% vertical
                     caixa de texto final: left=13% top=12% width=24%
            HOJA 2 — borda da folha medida (%): left=59.7% top=17.0% right=83.1% bottom=34.1%
                     (largura=23.4% altura=17.1%) → margem 25%: ~5.9% horizontal, ~4.3% vertical
                     caixa de texto final: left=66% top=22% width=12%
            Rotação com transformOrigin "top left" (pivota do canto declarado, não do centro). */}
        <div className="absolute" style={{ left: "13%", top: "12%", width: "24%", transform: "rotate(-3deg)", transformOrigin: "top left" }}>
          <p style={{ color: "#4A4640" }} className="text-[11px] font-bold font-mono uppercase tracking-wide">{obra.tipo || "Obra"}{obra.data_inicio ? ` · desde ${fmt(obra.data_inicio)}` : ""}</p>
          <h2 style={{ color: "#1A1815", display: "-webkit-box", WebkitLineClamp: 3, WebkitBoxOrient: "vertical", overflow: "hidden" }} className="text-lg font-extrabold leading-tight mt-1">{obra.cliente}</h2>
          <p style={{ color: "#3D3934", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }} className="text-xs font-bold mt-1">{obra.endereco}</p>
        </div>

        <div className="absolute" style={{ left: "66%", top: "22%", width: "12%", transform: "rotate(-2deg)", transformOrigin: "top left" }}>
          <p style={{ color: "#4A4640" }} className="text-[9px] font-bold font-mono uppercase tracking-wide">Responsável</p>
          <p style={{ color: "#1A1815", display: "-webkit-box", WebkitLineClamp: 3, WebkitBoxOrient: "vertical", overflow: "hidden" }} className="text-xs font-extrabold leading-tight mt-1">{responsavelAtual ? responsavelAtual.nome : "—"}</p>
        </div>

        {/* Selo de status, ENORME, bem visível */}
        <div className="absolute" style={{ right: "3%", top: "1%", width: "42%" }}>
          <StampBadge estado={obra.estado} onClick={cycleEstado} enorme />
        </div>

        {/* Botões invisíveis sobre cada caixa do archivero — a imagem já tem mascote + texto */}
        <div className="absolute grid grid-cols-2" style={{ left: 0, right: 0, top: "37%", bottom: 0, gridTemplateRows: "repeat(3, 1fr)" }}>
          {/* Um botão por gaveta, SEMPRE na posição do desenho. Sem acesso → gaveta "trancada" (escurecida, com cadeado). */}
          {MODULOS_OBRA.map((m) => {
            const liberado = nivelDoModulo(m.key) !== "nenhum";
            return liberado ? (
              <button key={m.key} onClick={() => onAbrirModulo(m.key)} className="relative active:bg-black/10 transition">
                {contagens[m.key] != null && <div style={{ background: "rgba(0,0,0,0.75)" }} className="absolute top-2 right-4 text-white text-[11px] font-extrabold rounded-full min-w-[22px] h-[22px] px-1 flex items-center justify-center shadow">{contagens[m.key]}</div>}
              </button>
            ) : (
              <button key={m.key} disabled title="Sem acesso a esta gaveta" aria-label={`${m.label}: sem acesso`} style={{ background: "rgba(20,18,15,0.62)" }} className="relative flex items-center justify-center cursor-not-allowed">
                <span className="text-2xl opacity-90">🔒</span>
              </button>
            );
          })}
        </div>
      </div>
      {/* Presença do dia: cada um marca a sua, mesmo sem acesso ao cajón Equipe (decisão 03/10). */}
      {meuMembro && (() => {
        const hojeP = todayISO();
        const presente = (meuMembro.asistencias || []).includes(hojeP);
        return (
          <div className="mt-3">
            <button onClick={async () => { setErroPresenca(""); try { await onToggleHoje(meuMembro.id, hojeP); } catch (err) { setErroPresenca(err.message); } }}
              style={{ background: presente ? C.green : C.surface, borderColor: presente ? C.green : C.border, color: presente ? "#fff" : C.ink }}
              className="w-full border-2 rounded-md py-3 font-bold uppercase tracking-wide text-sm">
              {presente ? "✓ Minha presença de hoje está marcada" : "✋ Marcar minha presença hoje"}
            </button>
            {erroPresenca && <p style={{ color: C.rust }} className="text-xs font-mono mt-1 text-center">{erroPresenca}</p>}
          </div>
        );
      })()}
    </div>
  );
}

function PendientesView({ obras, onBack, onOpenObra }) {
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);

  useEffect(() => {
    (async () => {
      setLoading(true);
      const resultados = await Promise.all(obras.map(async (obra) => {
        try {
          const r = await apiFetch(`/api/etapas?obra_id=${obra.id}`);
          return { obra, pendentes: r.etapas.filter((e) => !e.concluida) };
        } catch (e) { return { obra, pendentes: [] }; }
      }));
      setItems(resultados.filter((x) => x.pendentes.length > 0));
      setLoading(false);
    })();
  }, [obras]);

  return (
    <div>
      <h2 style={{ color: C.ink }} className="text-xl font-extrabold uppercase tracking-wide mb-1">● Pendências</h2>
      <p style={{ color: C.inkMuted }} className="text-sm font-mono mb-4">Etapas ainda não concluídas, em todas as obras</p>
      {loading && <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-12">Carregando...</p>}
      {!loading && items.length === 0 && <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-12">Nada pendente. Tudo em ordem.</p>}
      <div className="space-y-4">
        {items.map(({ obra, pendentes }) => (
          <div key={obra.id} style={{ background: C.surface, borderColor: C.border }} className="border rounded-md p-4">
            <button onClick={() => onOpenObra(obra.id)} style={{ color: C.ink }} className="font-extrabold text-sm uppercase tracking-wide">
              {obra.cliente} <span style={{ color: C.inkMuted }} className="font-normal normal-case">— {obra.endereco}</span>
            </button>
            {pendentes.map((e) => <div key={e.id} className="flex items-start gap-2 text-sm mt-2"><span>☑</span><span style={{ color: C.inkMuted }}>{e.texto}</span></div>)}
          </div>
        ))}
      </div>
    </div>
  );
}

function ReportView({ obras, onBack }) {
  const [loading, setLoading] = useState(true);
  const [reportText, setReportText] = useState("");
  const [copied, setCopied] = useState(false);
  const cutoff = todayISO();
  const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);

  useEffect(() => {
    (async () => {
      setLoading(true);
      const lines = [`*RELATÓRIO SEMANAL — GESTÃO & CONTROLE*`, `${fmt(weekAgo)} a ${fmt(cutoff)}`, ""];
      let totalPendentes = 0;
      const blocos = [];
      for (const obra of obras) {
        try {
          const [etR, feR, maR, obR] = await Promise.all([
            apiFetch(`/api/etapas?obra_id=${obra.id}`),
            apiFetch(`/api/ferramentas?obra_id=${obra.id}`),
            apiFetch(`/api/materiais?obra_id=${obra.id}`),
            apiFetch(`/api/observacoes?obra_id=${obra.id}`),
          ]);
          const etapas = etR.etapas, ferramentas = feR.ferramentas, materiais = maR.materiais, observacoes = obR.observacoes;
          const pendentes = etapas.filter((e) => !e.concluida);
          totalPendentes += pendentes.length;
          const doneCount = etapas.filter((e) => e.concluida).length;
          const concluidasRecentes = etapas.filter((e) => e.concluida && e.concluida_em >= weekAgo);
          const ferRecent = ferramentas.filter((f) => f.criado_em >= weekAgo);
          const matRecent = materiais.filter((m) => m.criado_em >= weekAgo);
          const obsRecent = observacoes.filter((o) => o.criado_em >= weekAgo);
          if (etapas.length === 0 && ferRecent.length === 0 && matRecent.length === 0 && obsRecent.length === 0) continue;
          const bloco = [`*${obra.cliente}* (${ESTADOS[obra.estado].label}) — ${obra.endereco}`];
          if (etapas.length > 0) bloco.push(`  Etapas: ${doneCount}/${etapas.length} concluídas`);
          concluidasRecentes.forEach((e) => bloco.push(`  • [Concluída] ${e.texto}`));
          ferRecent.forEach((f) => bloco.push(`  • [Ferramenta] ${f.texto}`));
          matRecent.forEach((m) => bloco.push(`  • [Material] ${m.texto}`));
          obsRecent.forEach((o) => bloco.push(`  • [Observação] ${o.texto}`));
          blocos.push(bloco.join("\n"));
        } catch (e) {}
      }
      if (totalPendentes > 0) lines.push(`*⚠ ETAPAS PENDENTES (${totalPendentes})*`, "");
      lines.push(...blocos.map((b) => b + "\n"));
      if (blocos.length === 0 && totalPendentes === 0) lines.push("Sem novidades registradas essa semana.");
      setReportText(lines.join("\n"));
      setLoading(false);
    })();
  }, [obras]);

  const copy = async () => { try { await navigator.clipboard.writeText(reportText); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) {} };
  const openWhatsapp = () => window.open(`https://wa.me/?text=${encodeURIComponent(reportText)}`, "_blank");
  const openEmail = () => { const subject = encodeURIComponent(`Relatório semanal — ${fmt(weekAgo)} a ${fmt(cutoff)}`); const body = encodeURIComponent(reportText.replace(/\*/g, "")); window.location.href = `mailto:?subject=${subject}&body=${body}`; };

  return (
    <div>
      <h2 style={{ color: C.ink }} className="text-xl font-extrabold uppercase tracking-wide mb-1">Relatório semanal</h2>
      <p style={{ color: C.inkMuted }} className="text-sm font-mono mb-4">{fmt(weekAgo)} — {fmt(cutoff)}</p>
      {loading ? (
        <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-12">Carregando...</p>
      ) : (
        <>
          <pre style={{ background: C.surface, borderColor: C.border, color: C.ink }} className="border rounded-md p-4 text-sm whitespace-pre-wrap font-sans leading-relaxed mb-4">{reportText}</pre>
          <div className="flex flex-wrap gap-2">
            <button onClick={openWhatsapp} style={{ background: C.green }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">💬 WhatsApp</button>
            <button onClick={openEmail} style={{ background: C.blue }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">✉ Email</button>
            <button onClick={copy} style={{ borderColor: C.border, color: C.ink }} className="border font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">{copied ? "✓ Copiado" : "⧉ Copiar"}</button>
          </div>
        </>
      )}
    </div>
  );
}

// Reparte cada letra con una animación tipo "carta servida por el crupier", en cascada.
// 15 caracteres totales (GESTÃO=6 + &=1 + CONTROLE=8) repartidos en 1 segundo -> ~66.7ms entre letra y letra.
function DealText({ text, startIndex, color, fontSize }) {
  return text.split("").map((ch, i) => (
    <span key={i} className="deal-letter" style={{ color, fontSize, animationDelay: `${1000 + (startIndex + i) * (1000 / 15)}ms` }}>
      {ch === " " ? "\u00A0" : ch}
    </span>
  ));
}

function AuthWrap({ children }) {
  return (
    <div style={{ background: C.bg, minHeight: "100vh" }} className="flex flex-col items-center justify-center p-6">
      <div style={{ background: C.surface, borderColor: C.border }} className="border rounded-lg p-6 w-full max-w-sm shadow-xl">{children}</div>
      <p style={{ color: C.inkMuted }} className="text-[11px] font-mono text-center mt-5">© 2026 Gestão & Controle · <a href="/termos" style={{ color: C.inkMuted }} className="underline">Termos</a> · <a href="/privacidade" style={{ color: C.inkMuted }} className="underline">Privacidade</a></p>
    </div>
  );
}

function LogoTitulo() {
  return (
    <div className="flex items-center justify-center gap-2.5 mb-1">
      <img src="logo.png" alt="G&C" className="w-11 h-11 rounded-full shrink-0" />
      <h1 style={{ color: C.ink }} className="font-comic text-xl tracking-wide whitespace-nowrap">Gestão & Controle</h1>
    </div>
  );
}

// Tela "Confirme seu e-mail" (depois do cadastro, ou ao tentar entrar sem ter confirmado).
function ConfirmeEmailAviso({ email, enviado = true, onIrLogin }) {
  const [msg, setMsg] = useState("");
  const [enviando, setEnviando] = useState(false);
  const reenviar = async () => {
    setEnviando(true); setMsg("");
    try { const r = await apiPublica("/api/auth/reenviar-confirmacao", { email }); setMsg(r.mensagem || "Enviado."); }
    catch (err) { setMsg(err.message); }
    setEnviando(false);
  };
  return (
    <AuthWrap>
      <LogoTitulo />
      <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide text-center mb-3">📧 Confirme seu e-mail</h2>
      {enviado
        ? <p style={{ color: C.ink }} className="text-sm mb-3">Enviamos um link para <b>{email}</b>. Abra o e-mail e toque no link para ativar sua conta. Depois, volte aqui e entre com seu e-mail e senha.</p>
        : <p style={{ color: C.rust }} className="text-sm mb-3">Sua conta foi criada, mas não conseguimos enviar o e-mail agora. Toque em "Reenviar" daqui a pouco.</p>}
      <p style={{ color: C.inkMuted }} className="text-xs font-mono mb-4">Não chegou? Olhe a caixa de spam ou "Promoções". O link vale 24 horas.</p>
      <button onClick={reenviar} disabled={enviando} style={{ borderColor: C.border, color: C.ink }} className="w-full border font-bold uppercase tracking-wide text-sm rounded py-2.5 disabled:opacity-50">{enviando ? "Enviando..." : "Reenviar e-mail"}</button>
      {msg && <p style={{ color: C.green }} className="text-xs font-mono mt-2 text-center">{msg}</p>}
      <button onClick={onIrLogin} style={{ background: C.amber }} className="w-full mt-4 text-white font-bold uppercase tracking-wide rounded py-2.5">Já confirmei — entrar</button>
    </AuthWrap>
  );
}

function CadastroScreen({ onIrLogin, onCadastrado }) {
  const [confirmar, setConfirmar] = useState(null);
  const [email, setEmail] = useState("");
  const [nome, setNome] = useState("");
  const [senha, setSenha] = useState("");
  const [senha2, setSenha2] = useState("");
  const [aceito, setAceito] = useState(false);
  const [tsToken, setTsToken] = useState("");
  const [tsChave, setTsChave] = useState(0);
  const [erro, setErro] = useState("");
  const [salvando, setSalvando] = useState(false);

  const cadastrar = async () => {
    setErro("");
    if (!email.trim() || !nome.trim()) { setErro("Preencha nome e email."); return; }
    if (senha.length < 8) { setErro("A senha precisa ter ao menos 8 caracteres."); return; }
    if (senha !== senha2) { setErro("As senhas não coincidem."); return; }
    if (!aceito) { setErro("Você precisa aceitar os Termos de Uso."); return; }
    setSalvando(true);
    try {
      if (!tsToken) { setErro("Aguarde a verificação \"não sou um robô\" terminar."); setSalvando(false); return; }
      const r = await apiSignup(email.trim(), senha, nome.trim(), aceito, tsToken);
      if (r.token) { saveSession(r); onCadastrado(); }
      else setConfirmar({ email: r.email || email.trim().toLowerCase(), enviado: r.enviado !== false });
    } catch (err) {
      setErro(err.message);
      setTsChave((k) => k + 1); // o token do Turnstile vale uma vez só: refaz a verificação
    }
    setSalvando(false);
  };

  if (confirmar) return <ConfirmeEmailAviso email={confirmar.email} enviado={confirmar.enviado} onIrLogin={onIrLogin} />;

  return (
    <AuthWrap>
      <LogoTitulo />
      <p style={{ color: C.inkMuted }} className="text-xs font-mono text-center mb-5">Criar conta</p>
      <a href="/api/auth/google" aria-label="Entrar com Google" className="block mb-4 active:opacity-80">
        <img src="google-login.png" alt="Entrar com Google" className="mx-auto h-14 w-auto" draggable="false" />
      </a>
      <div className="flex items-center gap-2 mb-4">
        <div style={{ borderColor: C.border }} className="flex-1 border-t" />
        <span style={{ color: C.inkMuted }} className="text-[11px] font-mono">ou com email</span>
        <div style={{ borderColor: C.border }} className="flex-1 border-t" />
      </div>
      <div className="space-y-3">
        <div>
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Nome</label>
          <input value={nome} onChange={(e) => setNome(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" placeholder="Seu nome" autoFocus />
        </div>
        <div>
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Email</label>
          <input value={email} onChange={(e) => setEmail(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" placeholder="voce@exemplo.com" />
        </div>
        <div>
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Senha</label>
          <input type="password" value={senha} onChange={(e) => setSenha(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" placeholder="Mínimo 8 caracteres" />
        </div>
        <div>
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Confirmar senha</label>
          <input type="password" value={senha2} onChange={(e) => setSenha2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && cadastrar()} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" />
        </div>
        <label className="flex items-start gap-2 text-xs" style={{ color: C.inkMuted }}>
          <input type="checkbox" checked={aceito} onChange={(e) => setAceito(e.target.checked)} className="mt-0.5" />
          <span>Tenho 18 anos ou mais, li e aceito os <a href="/termos" target="_blank" rel="noopener" style={{ color: C.amber }} className="underline">Termos de Uso</a> e a <a href="/privacidade" target="_blank" rel="noopener" style={{ color: C.amber }} className="underline">Política de Privacidade</a>.</span>
        </label>
        <Turnstile onToken={setTsToken} chave={tsChave} />
        {erro && <p style={{ color: C.rust }} className="text-xs font-mono">{erro}</p>}
      </div>
      <button onClick={cadastrar} disabled={salvando} style={{ background: C.amber }} className="w-full mt-5 text-white font-bold uppercase tracking-wide rounded py-2.5 disabled:opacity-50">{salvando ? "Criando..." : "Criar conta"}</button>
      <button onClick={onIrLogin} style={{ color: C.inkMuted }} className="w-full text-xs font-mono uppercase mt-3">Já tenho conta — entrar</button>
    </AuthWrap>
  );
}

function LoginScreen({ onLogado, onIrCadastro }) {
  const [semConfirmar, setSemConfirmar] = useState(null);
  const [pedeTs, setPedeTs] = useState(false);
  const [tsToken, setTsToken] = useState("");
  const [tsChave, setTsChave] = useState(0);
  const [esqueciAberto, setEsqueciAberto] = useState(false);
  const [emailEsqueci, setEmailEsqueci] = useState("");
  const [msgEsqueci, setMsgEsqueci] = useState("");
  const [erroEsqueci, setErroEsqueci] = useState("");
  const [enviandoEsqueci, setEnviandoEsqueci] = useState(false);
  const [modo, setModo] = useState(() => { try { return localStorage.getItem("gc-login-modo") || "email"; } catch (e) { return "email"; } });
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [cpf, setCpf] = useState("");
  const [pin, setPin] = useState("");
  const [erro, setErro] = useState("");
  const [entrando, setEntrando] = useState(false);

  const trocarModo = (m) => { setModo(m); setErro(""); try { localStorage.setItem("gc-login-modo", m); } catch (e) {} };

  const entrar = async () => {
    setErro("");
    setEntrando(true);
    try {
      if (pedeTs && !tsToken) { setErro("Aguarde a verificação \"não sou um robô\" e toque em Entrar de novo."); setEntrando(false); return; }
      const authData = await apiLogin(email.trim(), senha, tsToken || undefined);
      saveSession(authData);
      onLogado();
    } catch (err) {
      if (err.codigo === "email_nao_confirmado") { setSemConfirmar(email.trim().toLowerCase()); setEntrando(false); return; }
      if (err.codigo === "turnstile") setPedeTs(true);
      if (pedeTs || err.codigo === "turnstile") setTsChave((k) => k + 1);
      setErro(err.message);
    }
    setEntrando(false);
  };

  const abrirEsqueci = () => { setEmailEsqueci(email.trim()); setMsgEsqueci(""); setErroEsqueci(""); setEsqueciAberto(true); };
  const enviarEsqueci = async () => {
    setErroEsqueci(""); setMsgEsqueci("");
    if (!/^\S+@\S+\.\S+$/.test(emailEsqueci.trim())) { setErroEsqueci("Digite um e-mail válido."); return; }
    setEnviandoEsqueci(true);
    try { const r = await apiPublica("/api/auth/esqueci-senha", { email: emailEsqueci.trim() }); setMsgEsqueci((r.mensagem || "") + " O link vale 1 hora."); }
    catch (err) { setErroEsqueci(err.message); }
    setEnviandoEsqueci(false);
  };

  if (semConfirmar) return <ConfirmeEmailAviso email={semConfirmar} onIrLogin={() => setSemConfirmar(null)} />;

  const entrarCpf = async () => {
    setErro("");
    if (!cpfValido(cpf)) { setErro("CPF inválido. Confira os números."); return; }
    if (!/^\d{4}$/.test(pin)) { setErro("O PIN tem 4 números."); return; }
    setEntrando(true);
    try {
      if (pedeTs && !tsToken) { setErro("Aguarde a verificação \"não sou um robô\" e toque em Entrar de novo."); setEntrando(false); return; }
      const authData = await apiPublica("/api/auth/login-cpf", { cpf: limparCpf(cpf), pin, turnstile: tsToken || undefined });
      saveSession(authData);
      onLogado();
    } catch (err) {
      if (err.codigo === "turnstile") setPedeTs(true);
      if (pedeTs || err.codigo === "turnstile") setTsChave((k) => k + 1);
      setErro(err.message);
    }
    setEntrando(false);
  };

  const abaEstilo = (ativa) => ({ background: ativa ? C.ink : "transparent", color: ativa ? "#fff" : C.inkMuted, borderColor: C.ink });

  if (modo === "cpf") {
    return (
      <AuthWrap>
        <LogoTitulo />
        <p style={{ color: C.inkMuted }} className="text-xs font-mono text-center mb-4">Entrar</p>
        <div className="flex mb-4">
          <button onClick={() => trocarModo("cpf")} style={abaEstilo(true)} className="flex-1 border rounded-l py-2 text-xs font-bold uppercase">CPF + PIN</button>
          <button onClick={() => trocarModo("email")} style={abaEstilo(false)} className="flex-1 border rounded-r py-2 text-xs font-bold uppercase">Email / Google</button>
        </div>
        <div>
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">CPF</label>
          <input value={cpf} onChange={(e) => setCpf(formatarCpf(e.target.value))} inputMode="numeric" placeholder="000.000.000-00" style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-3 mt-1 outline-none text-lg tracking-wider" autoFocus />
        </div>
        <div className="mt-3">
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">PIN (4 números)</label>
          <input value={pin} onChange={(e) => setPin(e.target.value.replace(/\D/g, "").slice(0, 4))} onKeyDown={(e) => e.key === "Enter" && entrarCpf()} type="password" inputMode="numeric" autoComplete="off" placeholder="••••" style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-3 mt-1 outline-none text-2xl tracking-[0.5em] text-center" />
        </div>
        {pedeTs && <Turnstile onToken={setTsToken} chave={tsChave} />}
        {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-2">{erro}</p>}
        <button onClick={entrarCpf} disabled={entrando} style={{ background: C.amber }} className="w-full mt-4 text-white font-bold uppercase tracking-wide rounded py-3 disabled:opacity-50">{entrando ? "Entrando..." : "Entrar"}</button>
        <p style={{ color: C.inkMuted }} className="text-[11px] font-mono text-center mt-3">Esqueceu o PIN? Peça um "Novo PIN" ao seu chefe.</p>
      </AuthWrap>
    );
  }

  return (
    <AuthWrap>
      <LogoTitulo />
      <p style={{ color: C.inkMuted }} className="text-xs font-mono text-center mb-4">Entrar</p>
      <div className="flex mb-4">
        <button onClick={() => trocarModo("cpf")} style={abaEstilo(false)} className="flex-1 border rounded-l py-2 text-xs font-bold uppercase">CPF + PIN</button>
        <button onClick={() => trocarModo("email")} style={abaEstilo(true)} className="flex-1 border rounded-r py-2 text-xs font-bold uppercase">Email / Google</button>
      </div>
      <a href="/api/auth/google" aria-label="Entrar com Google" className="block mb-4 active:opacity-80">
        <img src="google-login.png" alt="Entrar com Google" className="mx-auto h-14 w-auto" draggable="false" />
      </a>
      <div className="flex items-center gap-2 mb-4">
        <div style={{ borderColor: C.border }} className="flex-1 border-t" />
        <span style={{ color: C.inkMuted }} className="text-[11px] font-mono">ou com email</span>
        <div style={{ borderColor: C.border }} className="flex-1 border-t" />
      </div>
      <div>
        <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Email</label>
        <input value={email} onChange={(e) => setEmail(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" autoFocus />
      </div>
      <div className="mt-3">
        <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Senha</label>
        <input type="password" value={senha} onChange={(e) => setSenha(e.target.value)} onKeyDown={(e) => e.key === "Enter" && entrar()} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" />
      </div>
      {pedeTs && <Turnstile onToken={setTsToken} chave={tsChave} />}
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-2">{erro}</p>}
      <button onClick={entrar} disabled={entrando} style={{ background: C.green }} className="w-full mt-4 text-white font-bold uppercase tracking-wide rounded py-2.5 disabled:opacity-50">{entrando ? "Entrando..." : "Entrar"}</button>
      <button onClick={onIrCadastro} style={{ background: C.amber }} className="w-full mt-2 text-white font-bold uppercase tracking-wide rounded py-2.5">Criar conta</button>
      <button onClick={abrirEsqueci} style={{ color: C.inkMuted }} className="w-full text-xs font-mono mt-3 underline">Esqueci a senha</button>
      {esqueciAberto && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" onClick={() => setEsqueciAberto(false)}>
          <div style={{ background: C.surface }} className="rounded-lg p-6 w-full max-w-sm shadow-xl" onClick={(e) => e.stopPropagation()}>
            <div className="flex justify-between items-center mb-3">
              <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide">Esqueci a senha</h2>
              <button onClick={() => setEsqueciAberto(false)} style={{ color: C.inkMuted }} className="text-xl leading-none">×</button>
            </div>
            {msgEsqueci ? (
              <>
                <p style={{ color: C.green }} className="text-sm">📧 {msgEsqueci}</p>
                <button onClick={() => setEsqueciAberto(false)} style={{ background: C.green }} className="w-full mt-5 text-white font-bold uppercase tracking-wide rounded py-2.5">Fechar</button>
              </>
            ) : (
              <>
                <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">E-mail da sua conta</label>
                <input type="email" value={emailEsqueci} onChange={(e) => setEmailEsqueci(e.target.value)} onKeyDown={(e) => e.key === "Enter" && enviarEsqueci()} autoFocus style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" placeholder="voce@exemplo.com" />
                {erroEsqueci && <p style={{ color: C.rust }} className="text-xs font-mono mt-2">{erroEsqueci}</p>}
                <button onClick={enviarEsqueci} disabled={enviandoEsqueci} style={{ background: C.amber }} className="w-full mt-4 text-white font-bold uppercase tracking-wide rounded py-2.5 disabled:opacity-50">{enviandoEsqueci ? "Enviando..." : "Enviar link por e-mail"}</button>
              </>
            )}
          </div>
        </div>
      )}
    </AuthWrap>
  );
}

function ConviteScreen({ token, onEntrou, onCancelar }) {
  const [info, setInfo] = useState(null);
  const [aceito, setAceito] = useState(false);
  const [erroLink, setErroLink] = useState("");
  const [cpf, setCpf] = useState("");
  const [pin, setPin] = useState("");
  const [pin2, setPin2] = useState("");
  const [erro, setErro] = useState("");
  const [salvando, setSalvando] = useState(false);

  useEffect(() => {
    apiPublica(`/api/convite-info?token=${encodeURIComponent(token)}`)
      .then(setInfo)
      .catch((e) => setErroLink(e.message));
  }, [token]);

  const confirmar = async () => {
    setErro("");
    if (!cpfValido(cpf)) { setErro("CPF inválido. Confira os números."); return; }
    if (!/^\d{4}$/.test(pin)) { setErro("O PIN precisa ter 4 números."); return; }
    if (pin !== pin2) { setErro("Os dois PIN não são iguais."); return; }
    if (!aceito) { setErro("Para entrar, aceite os Termos de Uso e a Política de Privacidade."); return; }
    setSalvando(true);
    try {
      const authData = await apiPublica("/api/auth/aceitar-convite", { token, cpf: limparCpf(cpf), pin, aceitouTermos: true });
      saveSession(authData);
      try { localStorage.setItem("gc-login-modo", "cpf"); } catch (e) {}
      onEntrou();
    } catch (err) {
      setErro(err.message);
      setSalvando(false);
    }
  };

  if (erroLink) {
    return (
      <AuthWrap>
        <LogoTitulo />
        <p style={{ color: C.rust }} className="text-sm text-center my-4">{erroLink}</p>
        <button onClick={onCancelar} style={{ background: C.ink }} className="w-full text-white font-bold uppercase tracking-wide rounded py-2.5">Ir para o login</button>
      </AuthWrap>
    );
  }
  if (!info) return <SplashScreen />;

  const novoPin = info.tipo === "novo-pin";
  return (
    <AuthWrap>
      <LogoTitulo />
      <h2 style={{ color: C.ink }} className="text-lg font-extrabold text-center mt-3">Olá, {info.nome}!</h2>
      {novoPin ? (
        <p style={{ color: C.inkMuted }} className="text-sm text-center mb-4">Crie seu novo PIN de 4 números.</p>
      ) : (
        <p style={{ color: C.inkMuted }} className="text-sm text-center mb-4">
          Você foi convidado{info.obra ? <> para a obra <b style={{ color: C.ink }}>{info.obra.cliente}</b></> : null} como <b style={{ color: C.ink }}>{RANK_LABELS[info.rank]}</b>{info.funcao ? ` (${info.funcao})` : ""}.
        </p>
      )}
      <div>
        <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Seu CPF</label>
        <input value={cpf} onChange={(e) => setCpf(formatarCpf(e.target.value))} inputMode="numeric" placeholder="000.000.000-00" style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-3 mt-1 outline-none text-lg tracking-wider" />
        <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mt-1">É o que você vai usar para entrar.</p>
      </div>
      <div className="mt-3">
        <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Crie um PIN (4 números)</label>
        <input value={pin} onChange={(e) => setPin(e.target.value.replace(/\D/g, "").slice(0, 4))} type="password" inputMode="numeric" autoComplete="off" placeholder="••••" style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-3 mt-1 outline-none text-2xl tracking-[0.5em] text-center" />
      </div>
      <div className="mt-3">
        <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Repita o PIN</label>
        <input value={pin2} onChange={(e) => setPin2(e.target.value.replace(/\D/g, "").slice(0, 4))} onKeyDown={(e) => e.key === "Enter" && confirmar()} type="password" inputMode="numeric" autoComplete="off" placeholder="••••" style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-3 mt-1 outline-none text-2xl tracking-[0.5em] text-center" />
        <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mt-1">Não use 1234, números repetidos nem parte do CPF. Não conte o PIN para ninguém.</p>
      </div>
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-2">{erro}</p>}
      <label className="flex items-start gap-2 text-xs mt-3" style={{ color: C.inkMuted }}>
        <input type="checkbox" checked={aceito} onChange={(e) => setAceito(e.target.checked)} className="mt-0.5" />
        <span>Tenho 18 anos ou mais, li e aceito os <a href="/termos" target="_blank" rel="noopener" style={{ color: C.amber }} className="underline">Termos de Uso</a> e a <a href="/privacidade" target="_blank" rel="noopener" style={{ color: C.amber }} className="underline">Política de Privacidade</a>.</span>
      </label>
      <button onClick={confirmar} disabled={salvando} style={{ background: C.amber }} className="w-full mt-4 text-white font-bold uppercase tracking-wide rounded py-3 disabled:opacity-50">{salvando ? "Entrando..." : "Entrar"}</button>
    </AuthWrap>
  );
}

// Cartão com o link gerado: botão WhatsApp + copiar.
function LinkConviteCard({ link, nome, telefone, novoPin, onFechar }) {
  const [copiado, setCopiado] = useState(false);
  const texto = novoPin
    ? `Olá ${nome}! Este é seu link para criar um novo PIN no Gestão & Controle (vale 7 dias, uso único):\n${link}`
    : `Olá ${nome}! Você foi convidado para a equipe da obra no Gestão & Controle. Toque no link para entrar (vale 7 dias, uso único):\n${link}`;
  const copiar = async () => {
    try { await navigator.clipboard.writeText(link); setCopiado(true); setTimeout(() => setCopiado(false), 2000); }
    catch (e) { window.prompt("Copie o link:", link); }
  };
  return (
    <div style={{ background: C.bg, borderColor: C.green }} className="border-2 rounded p-3 mt-2">
      <p style={{ color: C.ink }} className="text-sm font-bold mb-1">{novoPin ? `Link de Novo PIN para ${nome}` : `Convite criado para ${nome}`}</p>
      <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mb-2 break-all">{link}</p>
      <div className="flex gap-2">
        <a href={urlWhatsApp(telefone, texto)} target="_blank" rel="noopener" style={{ background: "#25D366" }} className="flex-1 text-white font-bold text-sm rounded py-2 text-center no-underline">📲 WhatsApp</a>
        <button onClick={copiar} style={{ borderColor: C.border, color: C.ink }} className="flex-1 border font-bold text-sm rounded py-2">{copiado ? "✓ Copiado" : "📋 Copiar link"}</button>
      </div>
      <button onClick={onFechar} style={{ color: C.inkMuted }} className="w-full text-[11px] font-mono uppercase mt-2">Fechar</button>
    </div>
  );
}

function AceiteTermosScreen({ usuario, onAceito, onSair }) {

  return (

      {usuario.empresa_nome && (
        <p style={{ color: C.inkMuted }} className="text-sm text-center mt-2">
          Você está entrando na empresa <b style={{ color: C.ink }}>{usuario.empresa_nome}</b> como <b style={{ color: C.ink }}>{RANK_LABELS[usuario.rank]}</b>.
