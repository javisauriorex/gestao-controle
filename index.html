// --- Auth local (sem backend): hash de senha, código de recuperação, WebAuthn ---
async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function randomCode(len = 10) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const arr = crypto.getRandomValues(new Uint8Array(len));
  let out = "";
  for (let i = 0; i < len; i++) out += chars[arr[i] % chars.length];
  return out;
}
function bufToBase64url(buf) {
  const bytes = new Uint8Array(buf);
  let str = "";
  bytes.forEach((b) => (str += String.fromCharCode(b)));
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function base64urlToBuf(b64url) {
  let b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  const str = atob(b64);
  const bytes = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
  return bytes.buffer;
}

function saveSession(authData) {
  const session = { token: authData.token, usuario: authData.usuario };
  localStorage.setItem("gc-session", JSON.stringify(session));
  return session;
}

function getSession() {
  try {
    return JSON.parse(localStorage.getItem("gc-session"));
  } catch (e) {
    return null;
  }
}

function clearSession() {
  localStorage.removeItem("gc-session");
}

// Helper central: toda llamada a nuestras Functions pasa por acá.
// Agrega el token automáticamente y tira un error legible si el server rechaza.
async function apiFetch(path, opts = {}) {
  const token = await getValidAccessToken();
  if (!token) throw new Error("Sessão expirada. Entre novamente.");
  const headers = { authorization: `Bearer ${token}`, ...(opts.headers || {}) };
  if (opts.body) headers["content-type"] = "application/json";
  const res = await fetch(path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Erro ${res.status}`);
  return data;
}

// El token propio dura 30 dias (definido en el backend); si el servidor lo rechaza (401),
// el propio apiFetch/carregarUsuarioAPI limpia la sesión. No hay refresh — más simple, alcanza para esta etapa.
async function getValidAccessToken() {
  const session = getSession();
  return session?.token || null;
}

function compressImage(file, maxWidth = 800, quality = 0.55) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const EXT_IMAGEM = ["jpg", "jpeg", "png", "gif", "webp", "heic", "heif", "bmp", "svg"];
function isImagemDoc(doc) {
  if (doc.tipo && doc.tipo.startsWith("image/")) return true;
  const ext = (doc.nome || "").split(".").pop().toLowerCase();
  return EXT_IMAGEM.includes(ext);
}

// Formatos permitidos en Documentos: planos (PDF), administrativo (Word/Excel), fotos.
// Nada de video: es justo lo que más pesa el bandwidth sin aportar tanto valor acá.
const TIPO_MIME_DOC = {
  "application/pdf": "pdf",
  "application/msword": "word",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document": "word",
  "application/vnd.ms-excel": "excel",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": "excel",
  "image/jpeg": "imagem",

};
const TIPO_EXT_DOC = { pdf: "pdf", doc: "word", docx: "word", xls: "excel", xlsx: "excel", jpg: "imagem", jpeg: "imagem", png: "imagem" };
function categoriaDoc(doc) {
  if (doc.tipo && TIPO_MIME_DOC[doc.tipo]) return TIPO_MIME_DOC[doc.tipo];
  const ext = (doc.nome || "").split(".").pop().toLowerCase();
  return TIPO_EXT_DOC[ext] || "outro";
}

    const file = e.target.files[0];
    if (!file) return;
    const categoria = categoriaDoc({ tipo: file.type, nome: file.name });
    if (categoria === "outro") {
      setErro("Formato não suportado. Apenas PDF, Word (.doc/.docx), Excel (.xls/.xlsx), JPG ou PNG.");
      e.target.value = "";
      return;
    }
    if (file.size > 4.5 * 1024 * 1024) {
      alert("O arquivo é muito grande (máx ~4MB).");
      e.target.value = "";
      return;
    }
    setErro("");
    setUploading(true);
    try {
      const dataUrl = await fileToDataURL(file);
      const arquivoId = uid();
      const ok = await saveArquivo(arquivoId, { nome: file.name, tipo: file.type, dataUrl });
      if (ok) {
        await onAdd({ obraId, nome: file.name, tipo: file.type, arquivoId });
      } else {
        alert("Não foi possível salvar o arquivo — provavelmente falta espaço. Verifique o indicador de espaço no topo.");
      }
    } catch (err) {
      setErro(err.message || "Não foi possível processar o arquivo.");
    }
    setUploading(false);
    e.target.value = "";
  };

  useEffect(() => { list.forEach((d) => { if (!fileCache[d.arquivo_id]) loadFile(d.arquivo_id); }); }, [obraId, list.map((d) => d.arquivo_id).join(",")]);

  const download = (doc) => {
    const f = fileCache[doc.arquivo_id];
    if (!f || f === "MISSING") return;
    const a = document.createElement("a");
    a.href = f.dataUrl;
    a.download = doc.nome;
    a.click();
  };

  const abrir = (doc) => {
    const f = fileCache[doc.arquivo_id];
    if (!f || f === "MISSING") return;
    const categoria = categoriaDoc(doc);
    if (categoria === "imagem") onViewImage(f.dataUrl);
    else if (categoria === "pdf") setPdfAberto({ src: f.dataUrl, nome: doc.nome });
    else download(doc);
  };

  const remover = async (doc) => {
    setErro("");
    try {
      await onDelete(doc.id, doc.arquivo_id);
    } catch (err) {
      setErro(err.message);
    }
  };

  return (
    <div>
      <div className="grid grid-cols-3 gap-2 mb-3">
        {list.map((d) => {
          const categoria = categoriaDoc(d);
          const f = fileCache[d.arquivo_id];
          const faltando = f === "MISSING";
          return (
            <div key={d.id} className="relative flex flex-col items-center gap-1">
              <button onClick={() => abrir(d)} disabled={faltando} style={{ background: C.bg, borderColor: faltando ? C.rust : C.border }} className="w-full aspect-square border rounded-lg overflow-hidden flex items-center justify-center disabled:opacity-60">
                {categoria === "imagem" && f && !faltando ? (
                  <img src={f.dataUrl} className="w-full h-full object-cover" />
                ) : (
                  <span className="text-3xl">{faltando ? "⚠" : ICONE_DOC[categoria]}</span>
                )}
              </button>
              {podeEditar && (
                <button onClick={() => remover(d)} style={{ background: C.rust }} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full flex items-center justify-center text-white text-xs leading-none shadow">×</button>
              )}
              <span style={{ color: faltando ? C.rust : C.inkMuted }} className="text-[10px] font-mono text-center truncate w-full px-0.5">{d.nome}{faltando ? " (indisp.)" : ""}</span>
            </div>
          );
        })}
        {list.length === 0 && <p style={{ color: C.inkMuted }} className="text-sm font-mono col-span-3">Nenhum documento anexado.</p>}
      </div>
      {!podeEditar && <p style={{ color: C.inkMuted }} className="text-[11px] font-mono">Seu nível de acesso é somente visualização neste módulo.</p>}
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mb-2">{erro}</p>}
      {podeEditar && (
        <>
          <input ref={inputRef} type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,image/jpeg,image/png" onChange={handleFile} className="hidden" />
          <button onClick={() => inputRef.current?.click()} disabled={uploading} style={{ background: C.ink }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2 disabled:opacity-50">
            + {uploading ? "Enviando..." : "Adicionar projeto"}
          </button>
          <p style={{ color: C.inkMuted }} className="text-[10px] font-mono mt-1.5">PDF, Word, Excel, JPG ou PNG — até 4MB.</p>
        </>
      )}
      {pdfAberto && <PdfViewer src={pdfAberto.src} nome={pdfAberto.nome} onClose={() => setPdfAberto(null)} />}
    </div>
  );
}

function EquipeSection({ obraId, equipe, onAdd, onRemove, onToggleHoje, onSetExcecao, usuarioRank, podeEditar = true }) {
  const [email, setEmail] = useState("");
  const [funcao, setFuncao] = useState("");
  const [rank, setRank] = useState(usuarioRank + 1 <= 7 ? usuarioRank + 1 : 7);
  const [erro, setErro] = useState("");
  const [msg, setMsg] = useState("");
  const [salvando, setSalvando] = useState(false);
  const [excecaoAberta, setExcecaoAberta] = useState(null);
  const list = equipe;
  const hoje = todayISO();
  const funcoesHistoricas = [...new Set([...FUNCOES, ...equipe.map((m) => m.funcao).filter(Boolean)])];
  const ranksDisponiveis = [1, 2, 3, 4, 5, 6, 7].filter((r) => r >= usuarioRank);
  const funcaoSugerida = `${RANK_LABELS[rank]} ${list.filter((m) => m.rank === rank).length + 1}`;

  const submit = async () => {
    if (!email.trim()) return;
    setErro(""); setMsg(""); setSalvando(true);
    try {
      const r = await onAdd({ obraId, email: email.trim(), rank, funcao: (funcao || funcaoSugerida).trim() });
      setMsg(r.convite ? `Convite enviado para ${email.trim()} — vai entrar assim que criar a conta.` : "Adicionado.");
      setEmail(""); setFuncao("");
    } catch (err) {
      setErro(err.message);
    }
    setSalvando(false);
  };

  const remover = async (m) => {
    setErro("");
    try { await onRemove(m.id); } catch (err) { setErro(err.message); }
  };

  const marcarPresenca = async (m) => {
    setErro("");
    try { await onToggleHoje(m.id, hoje); } catch (err) { setErro(err.message); }
  };

  const toggleBloqueio = async (m, moduloKey) => {
    setErro("");
    const atual = m.excecao_modulos || {};
    const bloqueado = atual[moduloKey] === "nenhum";
    const novo = { ...atual };
    if (bloqueado) delete novo[moduloKey];
    else novo[moduloKey] = "nenhum";
    try { await onSetExcecao(m.id, Object.keys(novo).length > 0 ? novo : null); } catch (err) { setErro(err.message); }
  };

  return (
    <div>
      <div className="space-y-2 mb-3">
        {list.map((m) => {
          const presenteHoje = m.asistencias?.includes(hoje);
          const temExcecao = m.excecao_modulos && Object.keys(m.excecao_modulos).length > 0;
          return (
            <div key={m.id} style={{ background: C.bg, borderColor: C.border }} className="border rounded px-3 py-2">
              <div className="flex items-center gap-2">
                <button onClick={() => podeEditar && marcarPresenca(m)} disabled={!podeEditar} title="Marcar presença hoje" style={{ borderColor: presenteHoje ? C.green : C.border, background: presenteHoje ? C.green : "transparent" }} className="w-5 h-5 border-2 rounded flex items-center justify-center shrink-0 text-white text-xs disabled:opacity-60">
                  {presenteHoje ? "✓" : ""}
                </button>
                <div className="flex-1 min-w-0 truncate">
                  <span style={{ color: C.ink }} className="font-semibold text-sm">{m.nome}</span> <span style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">· {m.funcao || RANK_LABELS[m.rank]}</span>
                  <div style={{ color: C.inkMuted }} className="text-[11px] font-mono truncate">{m.email} · {RANK_LABELS[m.rank]}{temExcecao ? " · acesso personalizado" : ""}</div>
                </div>
                <span style={{ color: C.inkMuted }} className="text-xs font-mono shrink-0">{m.asistencias?.length || 0}d</span>
                {podeEditar && <button onClick={() => setExcecaoAberta(excecaoAberta === m.id ? null : m.id)} style={{ color: temExcecao ? C.amber : C.inkMuted }} title="Personalizar acesso" className="shrink-0">⚙</button>}
                {podeEditar && <button onClick={() => remover(m)} style={{ color: C.inkMuted }} className="shrink-0">×</button>}
              </div>
              {excecaoAberta === m.id && (
                <div style={{ borderColor: C.border }} className="mt-2 pt-2 border-t">
                  <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mb-1.5">Bloquear acesso a (independente do rank):</p>
                  <div className="flex flex-wrap gap-2">
                    {MODULOS_OBRA.map((mod) => {
                      const bloqueado = m.excecao_modulos?.[mod.key] === "nenhum";
                      return (
                        <button key={mod.key} onClick={() => toggleBloqueio(m, mod.key)} style={{ borderColor: bloqueado ? C.rust : C.border, background: bloqueado ? C.rust : "transparent", color: bloqueado ? "#fff" : C.inkMuted }} className="border rounded px-2 py-1 text-[11px] font-mono">
                          {mod.glyph} {mod.label}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          );
        })}
        {list.length === 0 && <p style={{ color: C.inkMuted }} className="text-sm font-mono">Sem equipe atribuída.</p>}
      </div>
      {!podeEditar && <p style={{ color: C.inkMuted }} className="text-[11px] font-mono">Seu nível de acesso é somente visualização neste módulo.</p>}
      {podeEditar && (
        <>
          <div className="flex flex-wrap gap-2">
            <input value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="email@exemplo.com" style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-3 py-1.5 text-sm outline-none" />
            <input value={funcao} onChange={(e) => setFuncao(e.target.value)} placeholder={funcaoSugerida} list="funcoes-equipe" style={{ borderColor: C.border, color: C.ink }} className="border rounded px-2 py-1.5 text-xs outline-none w-28 shrink-0" />
            <select value={rank} onChange={(e) => setRank(Number(e.target.value))} style={{ borderColor: C.border, color: C.ink }} className="border rounded px-1 py-1.5 text-xs outline-none bg-white shrink-0">
              {ranksDisponiveis.map((r) => <option key={r} value={r}>{RANK_LABELS[r]}</option>)}
            </select>
            <datalist id="funcoes-equipe">{funcoesHistoricas.map((f) => <option key={f} value={f} />)}</datalist>
            <button onClick={submit} disabled={!email.trim() || salvando} style={{ background: C.teal }} className="text-white rounded px-3 disabled:opacity-40 shrink-0">+</button>
          </div>
          <p style={{ color: C.amber }} className="text-[11px] font-mono mt-1.5">→ {RANK_LABELS[rank]} · {RANK_DESCRICOES[rank]}</p>
          <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mt-1">Se o email ainda não tem conta, fica um convite pendente. Sugestão de função: "{funcaoSugerida}".</p>
        </>
      )}
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-1">{erro}</p>}
      {msg && <p style={{ color: C.green }} className="text-xs font-mono mt-1">{msg}</p>}
    </div>
  );
}

function EtapaNode({ etapa, allEtapas, depth, onToggle, onRemove, onAddSub, onEditEtapa, fileCache, loadFile, saveArquivo, onViewImage, nomesHistoricos = [], podeEditar = true }) {
  const [openSub, setOpenSub] = useState(false);
  const [editando, setEditando] = useState(false);
  const [nomeEdit, setNomeEdit] = useState(etapa.texto);
  const [novoSub, setNovoSub] = useState("");
  const [uploading, setUploading] = useState(false);
  const [erro, setErro] = useState("");
  const inputRef = useRef(null);
  const filhos = allEtapas.filter((e) => e.parent_id === etapa.id);
  const temFilhos = filhos.length > 0;

  const salvarNome = async () => {
    if (nomeEdit.trim() && nomeEdit.trim() !== etapa.texto) {
      try { await onEditEtapa(etapa.id, nomeEdit.trim()); } catch (err) { setErro(err.message); setNomeEdit(etapa.texto); }
    } else setNomeEdit(etapa.texto);
    setEditando(false);
  };

  const toggleSimples = async () => {
    if (!podeEditar) return;
    setErro("");
    try { await onToggle(etapa.id, !etapa.concluida, etapa.foto_conclusao_id); } catch (err) { setErro(err.message); }
  };

  const handlePhoto = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    setErro("");
    try {
      const dataUrl = await compressImage(file);
      const fotoId = uid();
      const ok = await saveArquivo(fotoId, { nome: "conclusao.jpg", tipo: "image/jpeg", dataUrl });
      if (!ok) { setErro("Não foi possível salvar a foto (sem espaço?)."); setUploading(false); e.target.value = ""; return; }
      await onToggle(etapa.id, true, fotoId);
    } catch (err) { setErro(err.message); }
    setUploading(false);
    e.target.value = "";
  };

  const addSub = async () => {
    if (!novoSub.trim()) return;
    setErro("");
    try { await onAddSub(etapa.id, novoSub.trim()); setNovoSub(""); } catch (err) { setErro(err.message); }
  };

  const removerEtapa = async () => {
    setErro("");
    try { await onRemove(etapa.id); } catch (err) { setErro(err.message); }
  };

  return (
    <div style={{ marginLeft: depth * 14 }}>
      <div style={{ borderColor: C.border, background: C.bg }} className="border rounded-md p-2.5 mb-2">
        <div className="flex items-center gap-1.5">
          <button onClick={toggleSimples} disabled={!podeEditar} style={{ borderColor: etapa.concluida ? C.green : C.border, background: etapa.concluida ? C.green : "transparent" }} className="w-4 h-4 border-2 rounded flex items-center justify-center shrink-0 text-white text-[10px] disabled:opacity-60">{etapa.concluida ? "✓" : ""}</button>
          <button onClick={() => setOpenSub(!openSub)} title="Subetapas" className="shrink-0">{temFilhos ? (openSub ? "📂" : "📁") : "📄"}</button>
          {editando ? (
            <input value={nomeEdit} onChange={(e) => setNomeEdit(e.target.value)} onKeyDown={(e) => e.key === "Enter" && salvarNome()} onBlur={salvarNome} autoFocus style={{ borderColor: C.border, color: C.ink, background: C.surface }} className="flex-1 min-w-0 border rounded px-2 py-0.5 text-sm outline-none" />
          ) : (
            <span style={{ color: etapa.concluida ? C.inkMuted : C.ink, textDecoration: etapa.concluida ? "line-through" : "none" }} className="text-sm flex-1 min-w-0 truncate">{etapa.texto}</span>
          )}
          {temFilhos && <span style={{ color: C.inkMuted }} className="text-[10px] font-mono shrink-0">{filhos.filter((f) => f.concluida).length}/{filhos.length}</span>}
          {podeEditar && !editando && <button onClick={() => { setNomeEdit(etapa.texto); setEditando(true); }} style={{ color: C.inkMuted }} className="shrink-0">✎</button>}
          {podeEditar && <input ref={inputRef} type="file" accept="image/*" capture="environment" onChange={handlePhoto} className="hidden" />}
          {podeEditar && <button onClick={() => inputRef.current?.click()} disabled={uploading} title="Concluir com foto" style={{ color: C.inkMuted }} className="shrink-0">📷</button>}
          {podeEditar && <button onClick={removerEtapa} style={{ color: C.rust }} className="shrink-0">🗑</button>}
        </div>
        {etapa.foto_conclusao_id && (
          <div className="mt-2 flex items-center gap-2">
            <Thumbnail fotoId={etapa.foto_conclusao_id} fileCache={fileCache} loadFile={loadFile} onView={onViewImage} />
            <span style={{ color: C.inkMuted }} className="text-[11px] font-mono">Concluída em {fmtTs(etapa.concluida_em)}</span>
          </div>
        )}
        {erro && <p style={{ color: C.rust }} className="text-[11px] font-mono mt-1">{erro}</p>}
      </div>

      {openSub && (
        <div style={{ borderLeft: `2px dashed ${C.border}`, marginLeft: 8 }} className="pl-2 mb-2">
          {filhos.map((f) => (
            <EtapaNode key={f.id} etapa={f} allEtapas={allEtapas} depth={0} onToggle={onToggle} onRemove={onRemove} onAddSub={onAddSub} onEditEtapa={onEditEtapa} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={onViewImage} nomesHistoricos={nomesHistoricos} podeEditar={podeEditar} />
          ))}
          {podeEditar && (
            <div className="flex gap-2 mb-2">
              <input value={novoSub} onChange={(e) => setNovoSub(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addSub()} placeholder="Nova subetapa" list="nomes-etapas" style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-3 py-1.5 text-sm outline-none" />
              <button onClick={addSub} disabled={!novoSub.trim()} style={{ background: C.teal }} className="text-white rounded px-3 disabled:opacity-40 shrink-0">+</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function EtapasSection({ obraId, etapas, onAdd, onToggle, onRemove, onEditEtapa, fileCache, loadFile, saveArquivo, onViewImage, podeEditar = true }) {
  const [texto, setTexto] = useState("");
  const [erro, setErro] = useState("");
  const raiz = etapas.filter((e) => !e.parent_id);
  const nomesHistoricos = [...new Set(etapas.map((e) => e.texto).filter(Boolean))];

  const submit = async () => {
    if (!texto.trim()) return;
    setErro("");
    try { await onAdd(null, texto.trim()); setTexto(""); } catch (err) { setErro(err.message); }
  };

  return (
    <div>
      <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mb-2">📁 abre subetapas · ✎ edita nome · 📷 conclui com foto.</p>
      <div className="mb-3">
        {raiz.map((e) => (
          <EtapaNode key={e.id} etapa={e} allEtapas={etapas} depth={0} onToggle={onToggle} onRemove={onRemove} onAddSub={onAdd} onEditEtapa={onEditEtapa} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={onViewImage} nomesHistoricos={nomesHistoricos} podeEditar={podeEditar} />
        ))}
        {raiz.length === 0 && <p style={{ color: C.inkMuted }} className="text-sm font-mono">Sem etapas cadastradas.</p>}
      </div>
      {!podeEditar && <p style={{ color: C.inkMuted }} className="text-[11px] font-mono">Seu nível de acesso é somente visualização neste módulo.</p>}
      {podeEditar && (
        <div className="flex gap-2">
          <input value={texto} onChange={(e) => setTexto(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="Ex: instalação elétrica" list="nomes-etapas" style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-3 py-1.5 text-sm outline-none" />
          <datalist id="nomes-etapas">{nomesHistoricos.map((n) => <option key={n} value={n} />)}</datalist>
          <button onClick={submit} disabled={!texto.trim()} style={{ background: C.ink }} className="text-white rounded px-3 disabled:opacity-40 shrink-0">+</button>
        </div>
      )}
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-1">{erro}</p>}
    </div>
  );
}

  const [erro, setErro] = useState("");

    if (!texto.trim()) return;
    setErro("");
    try { await onAdd(texto.trim()); setTexto(""); } catch (err) { setErro(err.message); }
  };
  const remover = async (item) => {
    setErro("");
    try { await onDelete(item.id); } catch (err) { setErro(err.message); }

  return (
    <div>
      <div className="space-y-2 mb-3">
        {items.map((item) => (
          <div key={item.id} style={{ background: C.surface, borderLeftColor: color }} className="border-l-4 rounded-r-md p-3 shadow-sm flex gap-3 group">
            <span className="mt-0.5 shrink-0">{glyph}</span>
            <div className="flex-1">
              <span style={{ color: C.inkMuted }} className="text-[11px] font-mono">{fmtTs(item.criado_em)}</span>
              <p style={{ color: C.ink }} className="text-sm">{item.texto}</p>
            </div>
            {podeEditar && <button onClick={() => remover(item)} style={{ color: C.rust }} className="opacity-0 group-hover:opacity-100 hover:opacity-60 transition shrink-0">🗑</button>}
          </div>
        ))}
        {items.length === 0 && <p style={{ color: C.inkMuted }} className="text-sm font-mono">Nada registrado ainda.</p>}
      </div>
      {!podeEditar && <p style={{ color: C.inkMuted }} className="text-[11px] font-mono">Seu nível de acesso é somente visualização neste módulo.</p>}
      {podeEditar && (
        <div className="flex gap-2">

function PermissoesScreen({ onBack }) {
  const [permissoes, setPermissoes] = useState(null);
  const [erro, setErro] = useState("");
  const [salvandoCelda, setSalvandoCelda] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const r = await apiFetch("/api/permissoes");
        setPermissoes(r.permissoes);
      } catch (err) { setErro(err.message); }
    })();
  }, []);

  const nivelDe = (rank, modulo) => {
    const row = permissoes?.find((p) => p.rank === rank && p.modulo === modulo);
    return row ? row.nivel : "nenhum";
  };

  const ciclo = { nenhum: "visualizar", visualizar: "editar", editar: "nenhum" };
  const corDe = { nenhum: C.inkMuted, visualizar: C.blue, editar: C.green };
  const labelNivel = { nenhum: "Nenhum", visualizar: "Ver", editar: "Editar" };

  const toggle = async (rank, modulo) => {
    const novo = ciclo[nivelDe(rank, modulo)];
    const key = `${rank}-${modulo}`;
    setSalvandoCelda(key);
    setErro("");
    try {
      await apiFetch("/api/permissoes", { method: "PATCH", body: JSON.stringify({ rank, modulo, nivel: novo }) });
      setPermissoes((prev) => {
        const existe = prev.find((p) => p.rank === rank && p.modulo === modulo);
        if (existe) return prev.map((p) => (p.rank === rank && p.modulo === modulo ? { ...p, nivel: novo } : p));
        return [...prev, { rank, modulo, nivel: novo }];
      });
    } catch (err) { setErro(err.message); }
    setSalvandoCelda(null);
  };

  if (!permissoes) return <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-16">Carregando...</p>;

  return (
    <div>
      <button onClick={onBack} style={{ color: C.inkMuted }} className="flex items-center gap-1 text-sm font-mono mb-4">‹ voltar</button>
      <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mb-1">🔑 Permissões</h2>
      <p style={{ color: C.inkMuted }} className="text-xs font-mono mb-4">Toque numa célula para alternar: Nenhum → Ver → Editar</p>
      <div className="overflow-x-auto -mx-4 px-4">
        <table className="w-full text-xs border-collapse">
          <thead>
            <tr>
              <th className="text-left p-1"></th>
              {MODULOS_OBRA.map((m) => <th key={m.key} style={{ color: C.inkMuted }} className="p-1 font-mono font-normal text-center">{m.glyph}</th>)}
            </tr>
          </thead>
          <tbody>
            {[1, 2, 3, 4, 5, 6, 7].map((rank) => (
              <tr key={rank}>
                <td style={{ color: C.ink }} className="p-1 font-mono whitespace-nowrap pr-2 text-[11px]">{RANK_LABELS[rank]}</td>
                {MODULOS_OBRA.map((m) => {
                  const nivel = nivelDe(rank, m.key);
                  const key = `${rank}-${m.key}`;
                  return (
                    <td key={m.key} className="p-1 text-center">
                      <button onClick={() => toggle(rank, m.key)} disabled={salvandoCelda === key}
                        style={{ borderColor: corDe[nivel], color: corDe[nivel] }}
                        className="border rounded w-14 py-1 text-[10px] font-mono uppercase disabled:opacity-50">
                        {salvandoCelda === key ? "..." : labelNivel[nivel]}
                      </button>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-3">{erro}</p>}
    </div>
  );
}

const MODULOS_OBRA = [
  { key: "etapas", label: "Etapas", glyph: "☑", cajao: "cajon_etapas_1.webp" },
  { key: "equipe", label: "Equipe", glyph: "👥", cajao: "cajon_equipe_2.webp" },
  { key: "documentos", label: "Documentos", glyph: "📎", cajao: "cajon_documentos_3.webp" },
  { key: "ferramentas", label: "Ferramentas", glyph: "🔧", cajao: "cajon_ferramentas_4.webp" },
  { key: "materiais", label: "Materiais", glyph: "📦", cajao: "cajon_materiais_5.webp" },

function ObraDetail({ obra, obraDetalhe, onBack, onChangeEstado, onDeleteObra, onTransferirObra,
  onAddEtapa, onToggleEtapa, onRemoveEtapa, onEditEtapa,
  onAddFerramenta, onDeleteFerramenta, onAddMaterial, onDeleteMaterial, onAddObservacao, onDeleteObservacao,
  onAddEquipo, onRemoveEquipo, onToggleHoje, onSetExcecao, usuarioRank, niveis,
  onAddDoc, onDeleteDoc, fileCache, loadFile, saveArquivo, onViewImage }) {
  const [erroObra, setErroObra] = useState("");
  const [modulo, setModulo] = useState(null);
  const [transferindo, setTransferindo] = useState(false);
  const [novoResponsavel, setNovoResponsavel] = useState("");
  const { etapas, equipe, ferramentas, materiais, observacoes, documentos } = obraDetalhe;
  const etapasObraCount = etapas.length;
  const etapasObraDone = etapas.filter((e) => e.concluida).length;
  const responsavelAtual = equipe.find((m) => m.usuario_id === obra.responsavel_id);
  const modulosVisiveis = MODULOS_OBRA.filter((m) => (niveis?.[m.key] || "nenhum") !== "nenhum");

  const cycleEstado = async () => {
    setErroObra("");
    const order = ["ativa", "pausada", "concluida"];
    try { await onChangeEstado(obra.id, order[(order.indexOf(obra.estado) + 1) % order.length]); }
    catch (err) { setErroObra(err.message); }
  };

  const excluir = async () => {
    setErroObra("");
    try { await onDeleteObra(obra.id); }
    catch (err) { setErroObra(err.message); }
  };

  const transferir = async () => {
    if (!novoResponsavel) return;
    setErroObra("");
    try {
      await onTransferirObra(obra.id, Number(novoResponsavel));
      setTransferindo(false);
      setNovoResponsavel("");
    } catch (err) { setErroObra(err.message); }
  };

  const contagens = {
    etapas: etapasObraCount > 0 ? `${etapasObraDone}/${etapasObraCount}` : null,
    equipe: equipe.length || null,
    documentos: documentos.length || null,
    ferramentas: ferramentas.length || null,
    materiais: materiais.length || null,
    observacoes: observacoes.length || null,
  };

  if (modulo) {
    const mod = MODULOS_OBRA.find((m) => m.key === modulo);
    const podeEditar = (niveis?.[modulo] || "nenhum") === "editar";
    return (
      <div>
        <button onClick={() => setModulo(null)} style={{ color: C.inkMuted }} className="flex items-center gap-1 text-sm font-mono mb-4">‹ {obra.cliente}</button>
        <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mb-4">{mod.label}</h2>
        {modulo === "documentos" && <DocumentosSection obraId={obra.id} documentos={documentos} onAdd={onAddDoc} onDelete={onDeleteDoc} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={onViewImage} podeEditar={podeEditar} />}
        {modulo === "equipe" && <EquipeSection obraId={obra.id} equipe={equipe} onAdd={onAddEquipo} onRemove={onRemoveEquipo} onToggleHoje={onToggleHoje} onSetExcecao={onSetExcecao} usuarioRank={usuarioRank} podeEditar={podeEditar} />}
        {modulo === "etapas" && <EtapasSection obraId={obra.id} etapas={etapas} onAdd={onAddEtapa} onToggle={onToggleEtapa} onRemove={onRemoveEtapa} onEditEtapa={onEditEtapa} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={onViewImage} podeEditar={podeEditar} />}
        {modulo === "ferramentas" && <ListaSimplesSection items={ferramentas} onAdd={onAddFerramenta} onDelete={onDeleteFerramenta} placeholder="Ex: furadeira, andaime..." color={C.steel} glyph="🔧" datalistId="hist-ferramentas" podeEditar={podeEditar} />}
        {modulo === "materiais" && <ListaSimplesSection items={materiais} onAdd={onAddMaterial} onDelete={onDeleteMaterial} placeholder="Ex: 10 sacos de cimento..." color={C.amber} glyph="📦" datalistId="hist-materiais" podeEditar={podeEditar} />}
        {modulo === "observacoes" && <ListaSimplesSection items={observacoes} onAdd={onAddObservacao} onDelete={onDeleteObservacao} placeholder="Anotação livre..." color={C.teal} glyph="📝" datalistId="hist-observacoes" podeEditar={podeEditar} />}
      </div>
    );
  }

  return (
    <div>
      <button onClick={onBack} style={{ color: C.inkMuted }} className="flex items-center gap-1 text-sm font-mono mb-4">‹ voltar</button>
      <div style={{ background: C.surface, borderColor: C.border }} className="border rounded-md p-5 mb-5">
        <div className="flex justify-between items-start gap-3">
          <div>
            <p style={{ color: C.inkMuted }} className="text-[11px] font-mono uppercase tracking-wide">{obra.tipo || "Obra"} · desde {fmt(obra.data_inicio)}</p>
            <h2 style={{ color: C.ink }} className="text-2xl font-extrabold leading-tight mt-1">{obra.cliente}</h2>
            <p style={{ color: C.inkMuted }} className="text-sm mt-1">{obra.endereco}</p>
          </div>
          <StampBadge estado={obra.estado} onClick={cycleEstado} grande />
        </div>
        <div style={{ borderColor: C.border }} className="border-t mt-4 pt-3 flex items-center justify-between flex-wrap gap-2">
          <p style={{ color: C.inkMuted }} className="text-xs font-mono">
            👤 Responsável: <span style={{ color: C.ink }}>{responsavelAtual ? `${responsavelAtual.nome} (${RANK_LABELS[responsavelAtual.rank]})` : "—"}</span>
          </p>
          <button onClick={() => setTransferindo(!transferindo)} style={{ color: C.blue }} className="text-xs font-mono uppercase">🔄 Transferir</button>
        </div>
        {transferindo && (
          <div className="flex gap-2 mt-2">
            <select value={novoResponsavel} onChange={(e) => setNovoResponsavel(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-2 py-1.5 text-xs outline-none bg-white">
              <option value="">Escolha o novo responsável...</option>
              {equipe.map((m) => <option key={m.usuario_id} value={m.usuario_id}>{m.nome} ({RANK_LABELS[m.rank]})</option>)}
            </select>
            <button onClick={transferir} disabled={!novoResponsavel} style={{ background: C.blue }} className="text-white text-xs font-bold uppercase rounded px-3 disabled:opacity-40 shrink-0">Confirmar</button>
          </div>
        )}
        <button onClick={excluir} style={{ color: C.rust }} className="mt-4 text-xs font-mono">🗑 excluir obra</button>
        {erroObra && <p style={{ color: C.rust }} className="text-xs font-mono mt-2">{erroObra}</p>}
      </div>
      <div className="grid grid-cols-2 gap-3">
        {modulosVisiveis.map((m) => (
          <button key={m.key} onClick={() => setModulo(m.key)} style={{ borderColor: C.border }} className="relative border rounded-md overflow-hidden active:opacity-80 transition">
            <img src={m.cajao} alt={m.label} className="w-full h-auto block" draggable="false" />
            {contagens[m.key] != null && <div style={{ background: "rgba(0,0,0,0.75)" }} className="absolute top-2 right-2 text-white text-[11px] font-extrabold rounded-full min-w-[22px] h-[22px] px-1 flex items-center justify-center shadow">{contagens[m.key]}</div>}
          </button>
        ))}
      </div>
    </div>
  );
}

  const [copied, setCopied] = useState(false);
  const cutoff = todayISO();
  const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);

  useEffect(() => {
    (async () => {
      setLoading(true);
      const lines = [`*RELATÓRIO SEMANAL — GESTÃO & CONTROLE*`, `${fmt(weekAgo)} a ${fmt(cutoff)}`, ""];
      let totalPendentes = 0;
      const blocos = [];
      for (const obra of obras) {
        try {
          const [etR, feR, maR, obR] = await Promise.all([
            apiFetch(`/api/etapas?obra_id=${obra.id}`),
            apiFetch(`/api/ferramentas?obra_id=${obra.id}`),
            apiFetch(`/api/materiais?obra_id=${obra.id}`),
            apiFetch(`/api/observacoes?obra_id=${obra.id}`),
          ]);
          const etapas = etR.etapas, ferramentas = feR.ferramentas, materiais = maR.materiais, observacoes = obR.observacoes;
          const pendentes = etapas.filter((e) => !e.concluida);
          totalPendentes += pendentes.length;
          const doneCount = etapas.filter((e) => e.concluida).length;
          const concluidasRecentes = etapas.filter((e) => e.concluida && e.concluida_em >= weekAgo);
          const ferRecent = ferramentas.filter((f) => f.criado_em >= weekAgo);
          const matRecent = materiais.filter((m) => m.criado_em >= weekAgo);
          const obsRecent = observacoes.filter((o) => o.criado_em >= weekAgo);
          if (etapas.length === 0 && ferRecent.length === 0 && matRecent.length === 0 && obsRecent.length === 0) continue;
          const bloco = [`*${obra.cliente}* (${ESTADOS[obra.estado].label}) — ${obra.endereco}`];
          if (etapas.length > 0) bloco.push(`  Etapas: ${doneCount}/${etapas.length} concluídas`);
          concluidasRecentes.forEach((e) => bloco.push(`  • [Concluída] ${e.texto}`));
          ferRecent.forEach((f) => bloco.push(`  • [Ferramenta] ${f.texto}`));
          matRecent.forEach((m) => bloco.push(`  • [Material] ${m.texto}`));
          obsRecent.forEach((o) => bloco.push(`  • [Observação] ${o.texto}`));
          blocos.push(bloco.join("\n"));
        } catch (e) {}
      }
      if (totalPendentes > 0) lines.push(`*⚠ ETAPAS PENDENTES (${totalPendentes})*`, "");
      lines.push(...blocos.map((b) => b + "\n"));
      if (blocos.length === 0 && totalPendentes === 0) lines.push("Sem novidades registradas essa semana.");
      setReportText(lines.join("\n"));
      setLoading(false);
    })();
  }, [obras]);

  const copy = async () => { try { await navigator.clipboard.writeText(reportText); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) {} };
  const openWhatsapp = () => window.open(`https://wa.me/?text=${encodeURIComponent(reportText)}`, "_blank");
  const openEmail = () => { const subject = encodeURIComponent(`Relatório semanal — ${fmt(weekAgo)} a ${fmt(cutoff)}`); const body = encodeURIComponent(reportText.replace(/\*/g, "")); window.location.href = `mailto:?subject=${subject}&body=${body}`; };

  return (
    <div>
      <button onClick={onBack} style={{ color: C.inkMuted }} className="flex items-center gap-1 text-sm font-mono mb-4">‹ voltar</button>
      <h2 style={{ color: C.ink }} className="text-xl font-extrabold uppercase tracking-wide mb-1">Relatório semanal</h2>
      <p style={{ color: C.inkMuted }} className="text-sm font-mono mb-4">{fmt(weekAgo)} — {fmt(cutoff)}</p>
      {loading ? (
        <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-12">Carregando...</p>
      ) : (
        <>
          <pre style={{ background: C.surface, borderColor: C.border, color: C.ink }} className="border rounded-md p-4 text-sm whitespace-pre-wrap font-sans leading-relaxed mb-4">{reportText}</pre>
          <div className="flex flex-wrap gap-2">
            <button onClick={openWhatsapp} style={{ background: C.green }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">💬 WhatsApp</button>
            <button onClick={openEmail} style={{ background: C.blue }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">✉ Email</button>
            <button onClick={copy} style={{ borderColor: C.border, color: C.ink }} className="border font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">{copied ? "✓ Copiado" : "⧉ Copiar"}</button>
          </div>
        </>
      )}
    </div>
  );
}

// Reparte cada letra con una animación tipo "carta servida por el crupier", en cascada.
// 15 caracteres totales (GESTÃO=6 + &=1 + CONTROLE=8) repartidos en 1 segundo -> ~66.7ms entre letra y letra.
function DealText({ text, startIndex, color, fontSize }) {
  return text.split("").map((ch, i) => (
    <span key={i} className="deal-letter" style={{ color, fontSize, animationDelay: `${1000 + (startIndex + i) * (1000 / 15)}ms` }}>
      {ch === " " ? "\u00A0" : ch}
    </span>
  ));
}

function TrancaBiometricaScreen({ onDesbloqueado, onUsarSenha }) {

        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials: credId ? [{ id: base64urlToBuf(credId), type: "public-key" }] : [],

          timeout: 60000,
        },
      });
      onDesbloqueado();

function GestorObras() {
  const [view, setView] = useState("dashboard");
  const [selectedId, setSelectedId] = useState(null);
  const [showModal, setShowModal] = useState(false);
  const [fileCache, setFileCache] = useState({});
  const [lightboxImg, setLightboxImg] = useState(null);
  const [temaEscuro, setTemaEscuro] = useState(false);

  const [sessionLoading, setSessionLoading] = useState(true);
  const [temSessao, setTemSessao] = useState(false);
  const [usuarioAPI, setUsuarioAPI] = useState(null);
  const [authView, setAuthView] = useState("login");
  const [biometriaConfigurada, setBiometriaConfigurada] = useState(false);
  const [biometriaPassada, setBiometriaPassada] = useState(false);
  const [configurandoBiometria, setConfigurandoBiometria] = useState(false);

  const [obras, setObras] = useState([]);
  const [obrasLoading, setObrasLoading] = useState(false);
  const [pendentesPorObra, setPendentesPorObra] = useState({});
  const [obraDetalhe, setObraDetalhe] = useState(null);
  const [obraDetalheLoading, setObraDetalheLoading] = useState(false);
  const [erroGlobal, setErroGlobal] = useState("");
  const [showConfig, setShowConfig] = useState(false);
  const [meusNiveis, setMeusNiveis] = useState(null);
  const [fazendoBackup, setFazendoBackup] = useState(false);
  const navRestauradaRef = useRef(false);

  const carregarUsuarioAPI = async () => {
    const token = await getValidAccessToken();
    if (!token) { setTemSessao(false); setUsuarioAPI(null); return; }
    setTemSessao(true);
    try {
      const res = await fetch("/api/usuarios-me", { headers: { authorization: `Bearer ${token}` } });
      const dataRes = await res.json();
      if (dataRes.ok) setUsuarioAPI(dataRes.usuario);
      else { clearSession(); setTemSessao(false); }
    } catch (e) {
      // sem rede: mantemos a sessão, só não temos os dados do servidor por enquanto
    }
  };

  useEffect(() => {
    (async () => {
      await carregarUsuarioAPI();
      setSessionLoading(false);

      setBiometriaConfigurada(!!localStorage.getItem("biometria-credential-id"));

      try {
        const res = await window.storage.get("tema");
        setTemaEscuro(res ? res.value === "escuro" : false);
      } catch (e) {}
    })();
  }, []);

  useEffect(() => {
    try {
      if (view === "dashboard") localStorage.removeItem("gc-nav");
      else localStorage.setItem("gc-nav", JSON.stringify({ view, selectedId }));
    } catch (e) {}
  }, [view, selectedId]);

  const carregarPendentes = async (lista) => {
    const mapa = {};
    await Promise.all(lista.map(async (o) => {
      try {
        const r = await apiFetch(`/api/etapas?obra_id=${o.id}`);
        mapa[o.id] = r.etapas.filter((e) => !e.concluida).length;
      } catch (e) { mapa[o.id] = 0; }
    }));
    setPendentesPorObra(mapa);
  };

  const restaurarNavegacao = (listaObras) => {
    try {
      const saved = JSON.parse(localStorage.getItem("gc-nav") || "null");
      if (!saved) return;
      if (saved.view === "obra" && saved.selectedId && listaObras.some((o) => o.id === saved.selectedId)) {
        abrirObra(saved.selectedId);
      } else if (["pendientes", "report", "permissoes", "leads"].includes(saved.view)) {
        setView(saved.view);
      }
    } catch (e) {}
  };

  const carregarObras = async () => {
    setObrasLoading(true);
    setErroGlobal("");
    try {
      const r = await apiFetch("/api/obras");
      setObras(r.obras);
      carregarPendentes(r.obras);
      if (!navRestauradaRef.current) {
        navRestauradaRef.current = true;
        restaurarNavegacao(r.obras);
      }
    } catch (err) {
      setErroGlobal(err.message);
    }
    setObrasLoading(false);
  };

  const carregarNiveis = async (usuario) => {
    try {
      const r = await apiFetch("/api/permissoes");
      const meus = {};
      r.permissoes.filter((p) => p.rank === usuario.rank).forEach((p) => { meus[p.modulo] = p.nivel; });
      setMeusNiveis(meus);
    } catch (e) {
      setMeusNiveis({});
    }
  };

  useEffect(() => { if (usuarioAPI) { carregarObras(); carregarNiveis(usuarioAPI); } }, [usuarioAPI]);

  const aoLogar = async () => {
    setBiometriaPassada(true);
    await carregarUsuarioAPI();
    if (!localStorage.getItem("biometria-credential-id") && biometriaSuportada()) {
      setConfigurandoBiometria(true);
    }
  };

  const sair = () => {
    clearSession();
    setTemSessao(false);
    setUsuarioAPI(null);
    setBiometriaPassada(false);
    setObras([]);
    setObraDetalhe(null);
  };

  const alternarTema = () => {
    const novo = !temaEscuro;
    setTemaEscuro(novo);
    window.storage.set("tema", novo ? "escuro" : "claro").catch(() => {});
  };

  const temaVars = useMemo(() => {
    const p = temaEscuro ? TEMA_ESCURO : TEMA_CLARO;
    return {
      "--c-bg": p.bg, "--c-surface": p.surface, "--c-ink": p.ink, "--c-inkMuted": p.inkMuted,
      "--c-border": p.border, "--c-amber": p.amber, "--c-blue": p.blue, "--c-rust": p.rust,
      "--c-green": p.green, "--c-steel": p.steel, "--c-teal": p.teal,
      background: p.bg, minHeight: "100vh", colorScheme: temaEscuro ? "dark" : "light",
    };
  }, [temaEscuro]);

  const saveArquivo = async (id, payload) => {
    try {
      const res = await fetch("/api/arquivo-set", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: `Bearer ${APP_TOKEN}` },
        body: JSON.stringify({ id, payload: JSON.stringify(payload) }),
      });
      const data = await res.json();
      if (data.ok) {
        setFileCache((p) => ({ ...p, [id]: payload }));
        return true;
      }
      return false;
    } catch (e) {
      return false;
    }
  };
  const loadFile = async (id) => {
    if (fileCache[id]) return;
    try {
      const res = await fetch(`/api/arquivo-get?id=${encodeURIComponent(id)}`, {
        headers: { authorization: `Bearer ${APP_TOKEN}` },
      });
      if (res.status === 404) { setFileCache((p) => ({ ...p, [id]: "MISSING" })); return; }
      const data = await res.json();
      setFileCache((p) => ({ ...p, [id]: data.ok ? JSON.parse(data.payload) : "MISSING" }));
    } catch (e) {
      setFileCache((p) => ({ ...p, [id]: "MISSING" }));
    }
  };
  const deleteArquivoRemoto = (id) => {
    fetch(`/api/arquivo-delete?id=${encodeURIComponent(id)}`, {
      method: "DELETE",
      headers: { authorization: `Bearer ${APP_TOKEN}` },
    }).catch(() => {});
  };

  // --- Obras ---
  const criarObra = async (form) => {
    const r = await apiFetch("/api/obras", { method: "POST", body: JSON.stringify(form) });
    setObras((prev) => [r.obra, ...prev]);
    setShowModal(false);
  };

  const changeEstado = async (obraId, estado) => {
    const r = await apiFetch(`/api/obras?id=${obraId}`, { method: "PATCH", body: JSON.stringify({ estado }) });
    setObras((prev) => prev.map((o) => (o.id === obraId ? r.obra : o)));
  };

  const transferirObra = async (obraId, novoResponsavelId) => {
    const r = await apiFetch(`/api/obras?id=${obraId}`, { method: "PATCH", body: JSON.stringify({ novoResponsavelId }) });
    setObras((prev) => prev.map((o) => (o.id === obraId ? r.obra : o)));
  };

  const deleteObra = async (obraId) => {
    await apiFetch(`/api/obras?id=${obraId}`, { method: "DELETE" });
    setObras((prev) => prev.filter((o) => o.id !== obraId));
    setView("dashboard");
  };

  const backupForcado = async () => {
    setFazendoBackup(true);
    try {
      const pacote = { geradoEm: new Date().toISOString(), obras: [] };
      for (const obra of obras) {
        const [et, eq, fe, ma, ob, doc] = await Promise.all([
          apiFetch(`/api/etapas?obra_id=${obra.id}`).catch(() => ({ etapas: [] })),
          apiFetch(`/api/equipe?obra_id=${obra.id}`).catch(() => ({ equipe: [] })),
          apiFetch(`/api/ferramentas?obra_id=${obra.id}`).catch(() => ({ ferramentas: [] })),
          apiFetch(`/api/materiais?obra_id=${obra.id}`).catch(() => ({ materiais: [] })),
          apiFetch(`/api/observacoes?obra_id=${obra.id}`).catch(() => ({ observacoes: [] })),
          apiFetch(`/api/documentos?obra_id=${obra.id}`).catch(() => ({ documentos: [] })),
        ]);
        pacote.obras.push({
          obra, etapas: et.etapas, equipe: eq.equipe, ferramentas: fe.ferramentas,
          materiais: ma.materiais, observacoes: ob.observacoes, documentos: doc.documentos,
        });
      }
      const blob = new Blob([JSON.stringify(pacote, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `gc-backup-${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      setErroGlobal(err.message);
    }
    setFazendoBackup(false);
  };

  // --- Abrir una obra: carga todo lo de esa obra en paralelo ---
  const abrirObra = async (id) => {
    setSelectedId(id);
    setView("obra");
    setObraDetalhe(null);
    setObraDetalheLoading(true);
    try {
      const [et, eq, fe, ma, ob, doc] = await Promise.all([
        apiFetch(`/api/etapas?obra_id=${id}`),
        apiFetch(`/api/equipe?obra_id=${id}`),
        apiFetch(`/api/ferramentas?obra_id=${id}`),
        apiFetch(`/api/materiais?obra_id=${id}`),
        apiFetch(`/api/observacoes?obra_id=${id}`),
        apiFetch(`/api/documentos?obra_id=${id}`),
      ]);
      setObraDetalhe({
        etapas: et.etapas, equipe: eq.equipe, ferramentas: fe.ferramentas,
        materiais: ma.materiais, observacoes: ob.observacoes, documentos: doc.documentos,
      });
    } catch (err) {
      setErroGlobal(err.message);
    }
    setObraDetalheLoading(false);
  };

  const voltarAoDashboard = () => {
    setView("dashboard");
    if (selectedId) carregarPendentes(obras);
  };

  // --- Etapas ---
  const addEtapa = async (parentId, texto) => {
    const r = await apiFetch("/api/etapas", { method: "POST", body: JSON.stringify({ obraId: selectedId, parentId, texto }) });
    setObraDetalhe((d) => ({ ...d, etapas: [...d.etapas, r.etapa] }));
  };
  const toggleEtapa = async (id, concluida, fotoConclusaoId) => {
    const r = await apiFetch(`/api/etapas?id=${id}`, { method: "PATCH", body: JSON.stringify({ concluida, fotoConclusaoId }) });
    setObraDetalhe((d) => ({ ...d, etapas: d.etapas.map((e) => (e.id === id ? r.etapa : e)) }));
  };
  const editEtapa = async (id, texto) => {
    const r = await apiFetch(`/api/etapas?id=${id}`, { method: "PATCH", body: JSON.stringify({ texto }) });
    setObraDetalhe((d) => ({ ...d, etapas: d.etapas.map((e) => (e.id === id ? r.etapa : e)) }));
  };
  const removeEtapa = async (id) => {
    await apiFetch(`/api/etapas?id=${id}`, { method: "DELETE" });
    // recarrega para reflejar la cascada (subetapas borradas junto con el padre)
    const r = await apiFetch(`/api/etapas?obra_id=${selectedId}`);
    setObraDetalhe((d) => ({ ...d, etapas: r.etapas }));
  };

  // --- Ferramentas / Materiais / Observações (mismo patrón para los 3) ---
  const criarListaHandlers = (recurso, campo) => ({
    add: async (texto) => {
      const r = await apiFetch(`/api/${recurso}`, { method: "POST", body: JSON.stringify({ obraId: selectedId, texto }) });
      setObraDetalhe((d) => ({ ...d, [campo]: [r.item, ...d[campo]] }));
    },
    del: async (id) => {
      await apiFetch(`/api/${recurso}?id=${id}`, { method: "DELETE" });
      setObraDetalhe((d) => ({ ...d, [campo]: d[campo].filter((x) => x.id !== id) }));
    },
  });
  const ferramentasH = criarListaHandlers("ferramentas", "ferramentas");
  const materiaisH = criarListaHandlers("materiais", "materiais");
  const observacoesH = criarListaHandlers("observacoes", "observacoes");

  // --- Equipe ---
  const addEquipo = async (payload) => {
    const r = await apiFetch("/api/equipe", { method: "POST", body: JSON.stringify(payload) });
    if (!r.convite) setObraDetalhe((d) => ({ ...d, equipe: [...d.equipe, r.equipe] }));
    return r;
  };
  const removeEquipo = async (id) => {
    await apiFetch(`/api/equipe?id=${id}`, { method: "DELETE" });
    setObraDetalhe((d) => ({ ...d, equipe: d.equipe.filter((m) => m.id !== id) }));
  };
  const toggleHoje = async (id, hoje) => {
    const r = await apiFetch(`/api/equipe?id=${id}`, { method: "PATCH", body: JSON.stringify({ data: hoje }) });
    setObraDetalhe((d) => ({ ...d, equipe: d.equipe.map((m) => (m.id === id ? r.equipe : m)) }));
  };
  const setExcecao = async (id, excecaoModulos) => {
    const r = await apiFetch(`/api/equipe?id=${id}`, { method: "PATCH", body: JSON.stringify({ excecaoModulos }) });
    setObraDetalhe((d) => ({ ...d, equipe: d.equipe.map((m) => (m.id === id ? { ...m, excecao_modulos: r.usuario.excecao_modulos } : m)) }));
  };

  // --- Documentos ---
  const addDoc = async (payload) => {
    const r = await apiFetch("/api/documentos", { method: "POST", body: JSON.stringify(payload) });
    setObraDetalhe((d) => ({ ...d, documentos: [r.documento, ...d.documentos] }));
  };
  const deleteDoc = async (id, arquivoId) => {
    await apiFetch(`/api/documentos?id=${id}`, { method: "DELETE" });
    if (arquivoId) deleteArquivoRemoto(arquivoId);
    setObraDetalhe((d) => ({ ...d, documentos: d.documentos.filter((x) => x.id !== id) }));
  };

  const selectedObra = obras.find((o) => o.id === selectedId);
  const totalPendientes = Object.values(pendentesPorObra).reduce((a, b) => a + b, 0);

  let content;
  if (sessionLoading) {
    content = <SplashScreen />;
  } else if (!temSessao) {
    content =
      authView === "cadastro" ? (
        <CadastroScreen onIrLogin={() => setAuthView("login")} onCadastrado={aoLogar} />
      ) : (
        <LoginScreen onLogado={aoLogar} onIrCadastro={() => setAuthView("cadastro")} />
      );
  } else if (configurandoBiometria) {
    content = <ConfigurarBiometriaScreen onFeito={() => { setConfigurandoBiometria(false); setBiometriaConfigurada(!!localStorage.getItem("biometria-credential-id")); }} />;
  } else if (biometriaConfigurada && !biometriaPassada) {
    content = <TrancaBiometricaScreen onDesbloqueado={() => setBiometriaPassada(true)} onUsarSenha={sair} />;
  } else if (!usuarioAPI) {
    content = <SplashScreen />;
  } else {
    content = (
    <div className="p-4 pb-24">
      {view === "dashboard" && (
        <>
          <div className="flex items-start gap-3 mb-5 pt-2">
            <img src="logo.png" alt="G&C" className="w-14 h-14 rounded-full shrink-0" />
            <div className="flex-1 min-w-0">
              <div className="flex items-center justify-between gap-2">
                <span style={{ color: C.inkMuted }} className="text-[11px] font-mono truncate">{RANK_LABELS[usuarioAPI.rank] || ""}</span>
                <span style={{ color: C.inkMuted }} className="text-[11px] font-mono truncate">{usuarioAPI.nome}</span>
              </div>
              <h1 style={{ color: C.ink }} className="font-comic text-xl tracking-wide leading-tight mt-0.5">Gestão & Controle</h1>
            </div>
          </div>
          <div className="flex flex-wrap gap-2 mb-4">
            <button onClick={() => setShowModal(true)} style={{ background: C.amber }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">+ Nova obra</button>
            <button onClick={() => setView("pendientes")} style={{ background: totalPendientes > 0 ? C.rust : "transparent", borderColor: C.rust, color: totalPendientes > 0 ? "#fff" : C.rust }} className="border font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">● Pendências {totalPendientes > 0 && `(${totalPendientes})`}</button>
            <button onClick={() => setView("report")} style={{ borderColor: C.ink, color: C.ink }} className="border font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">📅 Relatório semanal</button>
          </div>
          {erroGlobal && <p style={{ color: C.rust }} className="text-xs font-mono mb-3">{erroGlobal}</p>}
          {obrasLoading ? (
            <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-16">Carregando...</p>
          ) : obras.length === 0 ? (
            <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-16">Nenhuma obra cadastrada. Comece com "Nova obra".</p>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {obras.map((obra) => (
                <TicketCard key={obra.id} obra={obra} pendCount={pendentesPorObra[obra.id] || 0} lastDate={null} onOpen={() => abrirObra(obra.id)} />
              ))}
            </div>
          )}
        </>
      )}
      {view === "obra" && selectedObra && (
        obraDetalheLoading || !obraDetalhe ? (
          <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-16">Carregando...</p>
        ) : (
          <ObraDetail obra={selectedObra} obraDetalhe={obraDetalhe}
            onBack={voltarAoDashboard}
            onChangeEstado={changeEstado} onDeleteObra={deleteObra} onTransferirObra={transferirObra}
            onAddEtapa={addEtapa} onToggleEtapa={toggleEtapa} onRemoveEtapa={removeEtapa} onEditEtapa={editEtapa}
            onAddFerramenta={ferramentasH.add} onDeleteFerramenta={ferramentasH.del}
            onAddMaterial={materiaisH.add} onDeleteMaterial={materiaisH.del}
            onAddObservacao={observacoesH.add} onDeleteObservacao={observacoesH.del}
            onAddEquipo={addEquipo} onRemoveEquipo={removeEquipo} onToggleHoje={toggleHoje} onSetExcecao={setExcecao} usuarioRank={usuarioAPI.rank} niveis={meusNiveis}
            onAddDoc={addDoc} onDeleteDoc={deleteDoc} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={setLightboxImg} />
        )
      )}
      {view === "pendientes" && <PendientesView obras={obras} onBack={() => setView("dashboard")} onOpenObra={abrirObra} />}
      {view === "report" && <ReportView obras={obras} onBack={() => setView("dashboard")} />}
      {view === "permissoes" && <PermissoesScreen onBack={() => setView("dashboard")} />}
      {view === "leads" && <LeadsScreen onBack={() => setView("dashboard")} />}
      {showModal && <NuevaObraModal onClose={() => setShowModal(false)} onSave={criarObra} obras={obras} />}
      {lightboxImg && <Lightbox src={lightboxImg} onClose={() => setLightboxImg(null)} />}
    </div>
    );
    content = (
      <>
        {content}
        <BottomNav active={view === "dashboard" ? "inicio" : ""} onInicio={() => { setView("dashboard"); setSelectedId(null); setObraDetalhe(null); }} onConfig={() => setShowConfig(true)} />
        {showConfig && <ConfigDrawer usuario={usuarioAPI} temaEscuro={temaEscuro} onAlternarTema={alternarTema} onSair={() => { setShowConfig(false); sair(); }} onClose={() => setShowConfig(false)} onAbrirPermissoes={() => { setShowConfig(false); setView("permissoes"); }} onAbrirLeads={() => { setShowConfig(false); setView("leads"); }} onBackupForcado={backupForcado} fazendoBackup={fazendoBackup} />}
      </>
    );
  }

  return <div style={temaVars}>{content}</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<GestorObras />);
</script>
<script>
  // Compilamos manualmente forzando runtime clásico (React.createElement),
  // porque el runtime "automático" por default de Babel genera imports de
  // módulo ES que un <script> normal no puede ejecutar (pantalla en blanco).
  (function () {
    var src = document.getElementById("app-source").textContent;
    var out = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    var s = document.createElement("script");
    s.textContent = out;
    document.body.appendChild(s);
  })();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((e) => console.log("SW falhou:", e));
    });
  }
</script>
</body>
</html>
