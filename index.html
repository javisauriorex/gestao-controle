const DRIVE_ESCOPO = "https://www.googleapis.com/auth/drive.file";
const DRIVE_PASTA = "G&C backup";
const DRIVE_MANTER = 10;
let driveToken = null; // { valor, vence } — só na memória deste aparelho

function carregarGoogleIdentity() {
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  return new Promise((ok, erro) => {
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.onload = () => ok();
    s.onerror = () => erro(new Error("Não foi possível falar com o Google. Confira a internet e tente de novo."));
    document.head.appendChild(s);
  });
}

// Carregado já ao abrir o Config (do Dono): assim a janela do Google abre logo no toque
// e o navegador não a bloqueia como "pop-up".
let driveClientId = null;
async function prepararDrive() {
  if (!driveClientId) {
    const cfg = await fetch("/api/google-config").then((r) => r.json()).catch(() => ({}));
    driveClientId = cfg.clientId || null;
  }
  await carregarGoogleIdentity();
}

async function tokenDrive(emailDica) {
  if (driveToken && driveToken.vence > Date.now() + 60000) return driveToken.valor;
  await prepararDrive();
  const cfg = { clientId: driveClientId };
  if (!cfg.clientId) throw new Error("Backup no Drive indisponível no momento. Use \"Celular Backup\".");
  return new Promise((ok, erro) => {
    const cliente = window.google.accounts.oauth2.initTokenClient({
      client_id: cfg.clientId,
      scope: DRIVE_ESCOPO,
      hint: emailDica || undefined,
      callback: (resp) => {
        if (resp.error || !resp.access_token) return erro(new Error("O Google não autorizou o acesso ao Drive."));
        if (!window.google.accounts.oauth2.hasGrantedAllScopes(resp, DRIVE_ESCOPO)) return erro(new Error("Para salvar no Drive, marque a permissão do Google Drive na tela do Google."));
        driveToken = { valor: resp.access_token, vence: Date.now() + (Number(resp.expires_in) || 3600) * 1000 };
        ok(resp.access_token);
      },
      error_callback: () => erro(new Error("A janela do Google foi fechada antes de autorizar.")),
    });
    cliente.requestAccessToken({ prompt: "" });
  });
}

async function driveApi(token, url, opcoes = {}) {
  const r = await fetch(url, { ...opcoes, headers: { authorization: `Bearer ${token}`, ...(opcoes.headers || {}) } });
  if (r.status === 401) { driveToken = null; throw new Error("A conexão com o Drive venceu. Toque em \"Drive Backup\" de novo."); }
  if (r.status === 403) {
    const t = await r.text().catch(() => "");
    throw new Error(/storageQuota/i.test(t) ? "Seu Google Drive está cheio. Libere espaço ou use \"Celular Backup\"." : "O Google recusou o envio ao Drive.");
  }
  if (!r.ok) throw new Error("Falha ao falar com o Google Drive (" + r.status + ").");
  return r;
}

async function subirParaDrive(token, blob, nome) {
  const API = "https://www.googleapis.com/drive/v3/files";
  const q = (s) => encodeURIComponent(s);
  // 1) Pasta "G&C backup" (o G&C só enxerga a que ele mesmo criou)
  const busca = await (await driveApi(token, `${API}?q=${q(`name='${DRIVE_PASTA}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id)&spaces=drive`)).json();
  let pastaId = busca.files?.[0]?.id;
  if (!pastaId) {
    const nova = await (await driveApi(token, `${API}?fields=id`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ name: DRIVE_PASTA, mimeType: "application/vnd.google-apps.folder" }),
    })).json();
    pastaId = nova.id;
  }
  // 2) Envio "retomável" (serve para arquivos grandes, com muitas fotos)
  const inicio = await driveApi(token, "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id", {
    method: "POST",
    headers: { "content-type": "application/json; charset=UTF-8", "x-upload-content-type": "application/zip", "x-upload-content-length": String(blob.size) },
    body: JSON.stringify({ name: nome, parents: [pastaId], mimeType: "application/zip", appProperties: { gc: "backup" } }),
  });
  const destino = inicio.headers.get("location");
  if (!destino) throw new Error("O Google Drive não aceitou iniciar o envio.");
  await driveApi(token, destino, { method: "PUT", headers: { "content-type": "application/zip" }, body: blob });
  // 3) Guarda só os mais novos: os velhos criados pelo G&C vão para a lixeira (recuperáveis por 30 dias)
  try {
    const lista = await (await driveApi(token, `${API}?q=${q(`'${pastaId}' in parents and trashed=false and appProperties has { key='gc' and value='backup' }`)}&orderBy=createdTime desc&pageSize=100&fields=files(id)`)).json();
    for (const f of (lista.files || []).slice(DRIVE_MANTER)) {
      await driveApi(token, `${API}/${f.id}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ trashed: true }) });
    }
  } catch (e) { /* limpar é opcional: o backup novo já está salvo */ }
}

function MeuPinModal({ usuario, onClose }) {
  const [cpf, setCpf] = useState("");
  const [pin, setPin] = useState("");
  const [pin2, setPin2] = useState("");
  const [erro, setErro] = useState("");
  const [ok, setOk] = useState(false);
  const [salvando, setSalvando] = useState(false);
  const jaTemCpf = !!usuario.cpf_mascarado;
  const salvar = async () => {
    setErro("");
    if (!cpfValido(cpf)) { setErro("CPF inválido. Confira os números."); return; }
    if (!/^\d{4}$/.test(pin)) { setErro("O PIN precisa ter 4 números."); return; }
    if (pin !== pin2) { setErro("Os dois PIN não são iguais."); return; }
    setSalvando(true);
    try {
      await apiFetch("/api/usuarios-me", { method: "PATCH", body: JSON.stringify({ cpf: limparCpf(cpf), pin }) });
      setOk(true);
    } catch (err) { setErro(err.message); }
    setSalvando(false);
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
      <div style={{ background: C.surface }} className="rounded-lg p-6 w-full max-w-sm shadow-xl">
        <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mb-1">📱 {usuario.tem_pin ? "Trocar meu PIN" : "Criar meu PIN"}</h2>
        {ok ? (
          <>
            <p style={{ color: C.green }} className="text-sm my-4">Pronto! Agora você também pode entrar com CPF + PIN.</p>
            <button onClick={onClose} style={{ background: C.teal }} className="w-full text-white font-bold uppercase tracking-wide text-sm rounded py-2.5">Fechar</button>
          </>
        ) : (
          <>
            <p style={{ color: C.inkMuted }} className="text-xs mb-3">Para entrar com CPF + PIN, sem precisar de email nem Google.</p>
            {/* Quem já tem CPF confirma digitando de novo (o G&C não guarda mais o CPF completo). */}
            <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">{jaTemCpf ? `Confirme seu CPF (${usuario.cpf_mascarado})` : "Seu CPF"}</label>
            <input value={cpf} onChange={(e) => setCpf(formatarCpf(e.target.value))} inputMode="numeric" placeholder="000.000.000-00" style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 mb-3 outline-none tracking-wider" />
            <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">PIN (4 números)</label>
            <input value={pin} onChange={(e) => setPin(e.target.value.replace(/\D/g, "").slice(0, 4))} type="password" inputMode="numeric" autoComplete="off" placeholder="••••" style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 mb-3 outline-none text-xl tracking-[0.5em] text-center" />
            <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Repita o PIN</label>
            <input value={pin2} onChange={(e) => setPin2(e.target.value.replace(/\D/g, "").slice(0, 4))} onKeyDown={(e) => e.key === "Enter" && salvar()} type="password" inputMode="numeric" autoComplete="off" placeholder="••••" style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none text-xl tracking-[0.5em] text-center" />
            <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mt-1">Não use 1234, números repetidos nem parte do CPF.</p>

// "Exportar meus dados" (LGPD): página legível para ler/imprimir/salvar em PDF + arquivo JSON.
function escHtml(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function dataBR(v) { if (!v) return ""; const d = new Date(v); return isNaN(d) ? escHtml(v) : d.toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" }); }
function htmlMeusDados(d) {
  const tabela = (titulo, linhas, colunas) => {
    if (!linhas || !linhas.length) return `<h2>${titulo}</h2><p class="vazio">Nada registrado.</p>`;
    return `<h2>${titulo} <small>(${linhas.length})</small></h2><table><tr>${colunas.map((c) => `<th>${c[0]}</th>`).join("")}</tr>` +
      linhas.map((l) => `<tr>${colunas.map((c) => `<td>${c[1](l)}</td>`).join("")}</tr>`).join("") + `</table>`;
  };
  const c = d.cadastro || {};
  const RANKS = ["", "Dono", "Eng. Chefe de Obra", "Eng. Estagiário", "Mestre de Obra", "Encarregado", "Almoxarife", "Chefe de Turma", "Profissional"];
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Meus dados — G&amp;C</title>
<style>body{font-family:system-ui,sans-serif;color:#1A1815;max-width:900px;margin:0 auto;padding:20px;font-size:14px}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:26px 0 8px;border-bottom:2px solid #D98E04;padding-bottom:4px}small{color:#777;font-weight:normal}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:5px 7px;text-align:left;vertical-align:top}th{background:#f3efe6}dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}dt{color:#666}.vazio{color:#888}.meta{color:#666;font-size:12px}
.barra{position:sticky;top:0;background:#fff;padding:8px 0;margin-bottom:8px}.barra button{background:#D98E04;color:#fff;border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer}@media print{.barra{display:none}}</style></head><body>
<div class="barra"><button onclick="window.print()">🖨 Imprimir / salvar em PDF</button></div>
<h1>Meus dados no Gestão &amp; Controle</h1><p class="meta">Gerado em ${dataBR(d.gerado_em)} · ${escHtml(d.sobre)}</p>
<h2>Cadastro</h2><dl>
<dt>Nome</dt><dd>${escHtml(c.nome)}</dd><dt>E-mail</dt><dd>${escHtml(c.email || "—")}${c.email ? (c.email_confirmado ? " (confirmado)" : " (não confirmado)") : ""}</dd>
<dt>CPF</dt><dd>${escHtml(c.cpf || "—")}</dd><dt>Telefone</dt><dd>${escHtml(c.telefone || "—")}</dd>
<dt>Empresa</dt><dd>${escHtml(c.empresa || "—")}</dd><dt>Rank</dt><dd>${escHtml(RANKS[c.rank] || c.rank)}</dd>
<dt>Conta criada em</dt><dd>${dataBR(c.conta_criada_em)}</dd><dt>Formas de entrar</dt><dd>${[c.entra_com_senha && "e-mail e senha", c.entra_com_pin && "CPF e PIN"].filter(Boolean).join(", ") || "Google"}</dd>
<dt>Termos aceitos</dt><dd>${c.termos_aceitos ? `versão ${escHtml(c.termos_aceitos.versao)} em ${dataBR(c.termos_aceitos.em)}` : "—"}</dd></dl>
${tabela("Obras em que participa", d.obras, [["Obra", (l) => escHtml(l.obra)], ["Endereço", (l) => escHtml(l.endereco)], ["Função", (l) => escHtml(l.funcao)], ["Situação", (l) => escHtml(l.estado)], ["Dias de presença", (l) => (Array.isArray(l.presencas) ? l.presencas.length : 0) + (Array.isArray(l.presencas) && l.presencas.length ? `<br><small>${l.presencas.map(escHtml).join(", ")}</small>` : "")]])}
${tabela("Observações (livro de obra) que você escreveu", d.observacoes, [["Obra", (l) => escHtml(l.obra)], ["Texto", (l) => escHtml(l.texto) + (l.versoes_anteriores && l.versoes_anteriores.length ? `<br><small>Versões anteriores: ${l.versoes_anteriores.map((v) => `“${escHtml(v.texto)}” (${dataBR(v.substituido_em)})`).join(" · ")}</small>` : "")], ["Escrita em", (l) => dataBR(l.criado_em)]])}
${tabela("Pedidos e entregas", d.pedidos, [["Obra", (l) => escHtml(l.obra)], ["Você", (l) => escHtml(l.papel)], ["Outra pessoa", (l) => escHtml(l.outra_pessoa)], ["Tipo", (l) => escHtml(l.tipo)], ["Descrição", (l) => escHtml(l.descricao) + (l.quantidade ? ` (${escHtml(l.quantidade)})` : "")], ["Situação", (l) => escHtml(l.status)], ["Data", (l) => dataBR(l.criado_em)]])}
${tabela("Etapas", d.etapas, [["Obra", (l) => escHtml(l.obra)], ["Etapa", (l) => escHtml(l.texto)], ["Criada por você", (l) => (l.criada_por_voce ? "sim" : "")], ["Concluída por você em", (l) => dataBR(l.concluida_por_voce_em)]])}
${tabela("Materiais e ferramentas que você registrou", d.materiais_e_ferramentas, [["Tipo", (l) => escHtml(l.tipo)], ["Obra", (l) => escHtml(l.obra)], ["Item", (l) => escHtml(l.texto)], ["Data", (l) => dataBR(l.criado_em)]])}
${tabela("Fotos e documentos que você enviou", d.arquivos_enviados, [["Tipo", (l) => escHtml(l.tipo)], ["Obra", (l) => escHtml(l.obra)], ["Nome / etapa", (l) => escHtml(l.nome)], ["Data", (l) => dataBR(l.criado_em)]])}
${tabela("Registros de acesso (últimos 6 meses)", d.registros_de_acesso, [["Quando", (l) => dataBR(l.quando)], ["Como", (l) => escHtml(l.como)], ["IP", (l) => escHtml(l.ip)]])}
</body></html>`;
}

function DefinirSenhaModal({ usuario, onClose }) {
  const jaTemSenha = !!usuario?.tem_senha;
  const [senhaAtual, setSenhaAtual] = useState("");
  const [senha, setSenha] = useState("");
  const [senha2, setSenha2] = useState("");
  const [erro, setErro] = useState("");
  const [ok, setOk] = useState(false);
  const [salvando, setSalvando] = useState(false);

  const salvar = async () => {
    setErro("");
    if (jaTemSenha && !senhaAtual) { setErro("Digite a sua senha atual."); return; }
    if (senha.length < 8) { setErro("A senha precisa ter ao menos 8 caracteres."); return; }
    if (senha !== senha2) { setErro("As senhas não coincidem."); return; }
    setSalvando(true);
    try {
      await apiFetch("/api/usuarios-me", { method: "PATCH", body: JSON.stringify({ novaSenha: senha, senhaAtual: jaTemSenha ? senhaAtual : undefined }) });
      // Oferece salvar no gerenciador de senhas do navegador (Google Password Manager no Chrome).
      try {
        if (window.PasswordCredential) {
          const cred = new window.PasswordCredential({ id: usuario.email, password: senha, name: usuario.nome });
          await navigator.credentials.store(cred);
        }
      } catch (e) { /* navegador sem suporte, ou usuário recusou — segue normal */ }
      setOk(true);
    } catch (err) {
      setErro(err.message);
    }
    setSalvando(false);
  };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
      <div style={{ background: C.surface }} className="rounded-lg p-6 w-full max-w-sm shadow-xl">
        <div className="flex justify-between items-center mb-4">
          <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide">{jaTemSenha ? "Trocar senha" : "Definir senha"}</h2>
          <button onClick={onClose} style={{ color: C.inkMuted }} className="text-xl">×</button>
        </div>
        {ok ? (
          <>
            <p style={{ color: C.ink }} className="text-sm">Senha salva! Agora você também pode entrar com email e senha, sem depender do Google. Por segurança, os outros aparelhos em que você estava logado vão pedir para entrar de novo.</p>
            <button onClick={onClose} style={{ background: C.amber }} className="w-full mt-5 text-white font-bold uppercase tracking-wide rounded py-2.5">Fechar</button>
          </>
        ) : (
          <>
            <p style={{ color: C.inkMuted }} className="text-xs font-mono mb-3">Útil se você entrou com Google — assim consegue entrar mesmo sem ele.</p>
            {jaTemSenha && (
              <>
                <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Senha atual</label>
                <input type="password" value={senhaAtual} onChange={(e) => setSenhaAtual(e.target.value)} autoComplete="current-password" style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 mb-3 outline-none" autoFocus />
              </>
            )}
            <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Nova senha</label>
            <input type="password" value={senha} onChange={(e) => setSenha(e.target.value)} autoComplete="new-password" style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 mb-3 outline-none" autoFocus={!jaTemSenha} />
            <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Confirmar senha</label>
            <input type="password" value={senha2} onChange={(e) => setSenha2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && salvar()} autoComplete="new-password" style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" />
            {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-2">{erro}</p>}
            <button onClick={salvar} disabled={salvando} style={{ background: C.amber }} className="w-full mt-5 text-white font-bold uppercase tracking-wide rounded py-2.5 disabled:opacity-50">{salvando ? "Salvando..." : "Salvar senha"}</button>
          </>
        )}
      </div>
    </div>
  );
}

function LeadsScreen({ onBack }) {
  const [leads, setLeads] = useState(null);
  const [erro, setErro] = useState("");

  useEffect(() => {
    (async () => {
      try {
        const r = await apiFetch("/api/leads");
        setLeads(r.leads);
      } catch (err) {
        setErro(err.message);
      }
    })();
  }, []);

  const exportarCSV = () => {
    const linhas = [["Nome", "Empresa", "Contato", "Data"]];
    leads.forEach((l) => linhas.push([l.nome, l.empresa || "", l.contato, fmtTs(l.criado_em)]));
    const csv = linhas.map((linha) => linha.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `leads-gc-${todayISO()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide">📋 Leads (expo)</h2>
        {leads && leads.length > 0 && (
          <button onClick={exportarCSV} style={{ background: C.teal }} className="text-white text-xs font-bold uppercase rounded px-3 py-1.5">⤓ Exportar CSV</button>
        )}
      </div>
      {erro && <p style={{ color: C.rust }} className="text-sm font-mono mb-3">{erro}</p>}
      {!leads && !erro && <p style={{ color: C.inkMuted }} className="text-sm font-mono">Carregando...</p>}
      {leads && leads.length === 0 && <p style={{ color: C.inkMuted }} className="text-sm font-mono">Nenhum lead capturado ainda.</p>}
      {leads && leads.length > 0 && (
        <div className="space-y-2">
          <p style={{ color: C.inkMuted }} className="text-xs font-mono mb-2">{leads.length} contato{leads.length !== 1 ? "s" : ""} capturado{leads.length !== 1 ? "s" : ""}</p>
          {leads.map((l) => (
            <div key={l.id} style={{ background: C.surface, borderColor: C.border }} className="border rounded-md p-3">
              <div className="flex justify-between items-start gap-2">
                <span style={{ color: C.ink }} className="font-bold text-sm">{l.nome}</span>
                <span style={{ color: C.inkMuted }} className="text-[11px] font-mono shrink-0">{fmtTs(l.criado_em)}</span>
              </div>
              {l.empresa && <p style={{ color: C.inkMuted }} className="text-xs">{l.empresa}</p>}
              <p style={{ color: C.amber }} className="text-sm font-mono mt-1">{l.contato}</p>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function PermissoesScreen({ onBack, usuarioRank = 8 }) {
  const [permissoes, setPermissoes] = useState(null);
  const [erro, setErro] = useState("");
  const [salvandoCelda, setSalvandoCelda] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const r = await apiFetch("/api/permissoes");
        setPermissoes(r.permissoes);
      } catch (err) { setErro(err.message); }
    })();
  }, []);

  const nivelDe = (rank, modulo) => {
    const row = permissoes?.find((p) => p.rank === rank && p.modulo === modulo);
    return row ? row.nivel : "nenhum";
  };

  // "Receber" (ver + pedir + confirmar o que recebeu) só existe em Ferramentas e Materiais.
  const comReceber = (modulo) => modulo === "ferramentas" || modulo === "materiais";
  const proximo = (nivel, modulo) => {
    const ordem = comReceber(modulo) ? ["nenhum", "visualizar", "receber", "editar"] : ["nenhum", "visualizar", "editar"];
    return ordem[(ordem.indexOf(nivel) + 1) % ordem.length] || "nenhum";
  };
  const corDe = { nenhum: C.inkMuted, visualizar: C.blue, receber: C.amber, editar: C.green };
  const labelNivel = { nenhum: "Nenhum", visualizar: "Ver", receber: "Receber", editar: "Editar" };
  const [sugestaoAberta, setSugestaoAberta] = useState(false);
  const [sugestao, setSugestao] = useState("");
  const [sugestaoMsg, setSugestaoMsg] = useState("");
  const [enviandoSugestao, setEnviandoSugestao] = useState(false);
  const enviarSugestao = async () => {
    setSugestaoMsg(""); setEnviandoSugestao(true);
    try {
      await apiFetch("/api/sugestao", { method: "POST", body: JSON.stringify({ texto: sugestao }) });
      setSugestao(""); setSugestaoMsg("✓ Enviado! Obrigado — lemos todas as sugestões.");
    } catch (err) { setSugestaoMsg(err.message); }
    setEnviandoSugestao(false);
  };

  const toggle = async (rank, modulo) => {
    const novo = proximo(nivelDe(rank, modulo), modulo);
    const key = `${rank}-${modulo}`;
    setSalvandoCelda(key);
    setErro("");
    try {
      await apiFetch("/api/permissoes", { method: "PATCH", body: JSON.stringify({ rank, modulo, nivel: novo }) });
      setPermissoes((prev) => {
        const existe = prev.find((p) => p.rank === rank && p.modulo === modulo);
        if (existe) return prev.map((p) => (p.rank === rank && p.modulo === modulo ? { ...p, nivel: novo } : p));
        return [...prev, { rank, modulo, nivel: novo }];
      });
    } catch (err) { setErro(err.message); }
    setSalvandoCelda(null);
  };

  if (!permissoes) return <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-16">Carregando...</p>;

  return (
    <div>
      <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mb-1">🔑 Permissões</h2>
      <p style={{ color: C.inkMuted }} className="text-xs font-mono mb-4">{usuarioRank <= 2 ? "Toque numa célula para alternar: Nenhum → Ver → (Receber) → Editar. Você só altera os ranks abaixo do seu (as linhas apagadas estão travadas)." : "Só o Dono e o Engenheiro Chefe alteram esta tabela. Aqui você vê o que cada rank pode fazer."}</p>
      <div className="overflow-x-auto -mx-4 px-4">
        <table className="w-full text-xs border-collapse">
          <thead>
            <tr>
              <th className="text-left p-1"></th>
              {MODULOS_OBRA.map((m) => <th key={m.key} style={{ color: C.inkMuted }} className="p-1 font-mono font-normal text-center">{m.glyph}</th>)}
            </tr>
          </thead>
          <tbody>
            {[1, 2, 3, 4, 5, 6, 7, 8].map((rank) => (
              <tr key={rank}>
                <td style={{ color: C.ink }} className="p-1 font-mono whitespace-nowrap pr-2 text-[11px]">{RANK_LABELS[rank]}</td>
                {MODULOS_OBRA.map((m) => {
                  const nivel = nivelDe(rank, m.key);
                  const key = `${rank}-${m.key}`;
                  return (
                    <td key={m.key} className="p-1 text-center">
                      <button onClick={() => toggle(rank, m.key)} disabled={salvandoCelda === key || rank <= usuarioRank || usuarioRank > 2}
                        style={{ borderColor: corDe[nivel], color: corDe[nivel] }}
                        className="border rounded w-14 py-1 text-[10px] font-mono uppercase disabled:opacity-50">
                        {salvandoCelda === key ? "..." : labelNivel[nivel]}
                      </button>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-3">{erro}</p>}
      <p style={{ color: C.inkMuted }} className="text-[10px] font-mono mt-2">Ver = só olha · Receber = olha, pede e confirma o que recebeu · Editar = cria, entrega, altera.</p>

      <div style={{ borderColor: C.border, background: C.surface }} className="border rounded-md p-3 mt-5">
        <p style={{ color: C.ink }} className="text-xs font-extrabold uppercase tracking-wide mb-2">📏 Regras fixas da hierarquia</p>
        <p style={{ color: C.inkMuted }} className="text-[11px] font-mono mb-2">Valem sempre, além da tabela acima. Não se mudam aqui.</p>
        <ul style={{ color: C.ink }} className="text-xs space-y-1.5 list-disc pl-4">
          <li><b>A autoridade só desce:</b> você altera ou apaga o que é seu e o que é de quem está abaixo de você. Nunca o de um igual ou de um superior.</li>
          <li><b>Livro de obra (Observações):</b> o autor não apaga o que escreveu; só um superior dele.</li>
          <li><b>Obras visíveis:</b> Dono, Eng. Chefe e Eng. Estagiário veem todas as obras; do Mestre para baixo, só as obras em que estão na equipe.</li>
          <li><b>Criar obra:</b> Dono, Eng. Chefe e Mestre de Obra.</li>
          <li><b>Convidar e adicionar:</b> quem tem "Editar" na Equipe, sempre para ranks abaixo do seu. <b>Tirar da obra:</b> só um superior (o responsável da obra sai só depois de transferir).</li>
          <li><b>Mudar rank:</b> Dono, Eng. Chefe e Mestre de Obra, só de quem está abaixo e só para ranks abaixo do seu. O Dono principal pode nomear um co-Dono; mudar ou excluir um Dono é pelo suporte.</li>
          <li><b>Presença:</b> cada um marca a sua, só de hoje. Um superior pode anotar a de alguém de baixo, e fica registrado quem anotou.</li>
          <li><b>Pedidos e entregas:</b> quem fornece marca "entreguei" e quem recebe confirma "recebi". Cancelar: quem criou ou um superior dele.</li>
          <li><b>Etapa concluída:</b> só quem concluiu (ou um superior dele) desmarca.</li>
          <li><b>Esta tabela:</b> só Dono e Eng. Chefe alteram, e só as linhas abaixo do seu rank.</li>
        </ul>
        <button onClick={() => { setSugestaoAberta(true); setSugestaoMsg(""); }} style={{ color: C.amber }} className="text-xs font-mono underline mt-3">💡 Sugestões de fluxo de informação?</button>
      </div>

      {sugestaoAberta && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" onClick={() => setSugestaoAberta(false)}>
          <div style={{ background: C.surface }} className="rounded-lg p-5 w-full max-w-sm shadow-xl" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-2">
              <h2 style={{ color: C.ink }} className="text-base font-extrabold uppercase tracking-wide">💡 Sugestão</h2>
              <button onClick={() => setSugestaoAberta(false)} style={{ color: C.inkMuted }} className="text-xl leading-none">×</button>
            </div>
            <p style={{ color: C.inkMuted }} className="text-xs mb-2">Como a informação deveria circular na sua obra? Quem deveria ver, pedir ou aprovar o quê? Sua mensagem vai direto para a equipe do G&C.</p>
            <textarea value={sugestao} onChange={(e) => setSugestao(e.target.value)} rows={5} maxLength={3000} placeholder="Ex.: o Almoxarife deveria ver a Equipe para saber a quem entregar." style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 text-sm outline-none" />
            {sugestaoMsg && <p style={{ color: sugestaoMsg.startsWith("✓") ? C.green : C.rust }} className="text-xs font-mono mt-1">{sugestaoMsg}</p>}
            <button onClick={enviarSugestao} disabled={enviandoSugestao || sugestao.trim().length < 5} style={{ background: C.amber }} className="w-full mt-3 text-white font-bold uppercase tracking-wide rounded py-2.5 disabled:opacity-50">{enviandoSugestao ? "Enviando..." : "Enviar"}</button>
          </div>
        </div>
      )}
    </div>
  );
}

const MODULOS_OBRA = [
  { key: "equipe", label: "Equipe", glyph: "👥", cajao: "cajon_equipe_2.webp", icone: "icone_equipe_2.webp" },
  { key: "etapas", label: "Etapas", glyph: "☑", cajao: "cajon_etapas_1.webp", icone: "icone_etapas_1.webp" },
  { key: "ferramentas", label: "Ferramentas", glyph: "🔧", cajao: "cajon_ferramentas_4.webp", icone: "icone_ferramentas_4.webp" },
  { key: "materiais", label: "Materiais", glyph: "📦", cajao: "cajon_materiais_5.webp", icone: "icone_materiais_5.webp" },
  { key: "observacoes", label: "Observações", glyph: "📝", cajao: "cajon_observacoes_6.webp", icone: "icone_observacoes_6.webp" },
  { key: "documentos", label: "Documentos", glyph: "📎", cajao: "cajon_documentos_3.webp", icone: "icone_documentos_3.webp" },
];

function ObraDetail({ obra, obraDetalhe, onBack, onChangeEstado, onDeleteObra, onTransferirObra,
  onAddEtapa, onToggleEtapa, onRemoveEtapa, onEditEtapa, onAddFotoEtapa, onDeleteFotoEtapa,
  onAddFerramenta, onDeleteFerramenta, onAddMaterial, onDeleteMaterial, onAddObservacao, onDeleteObservacao, onEditObservacao,
  onAddEquipo, onRemoveEquipo, onToggleHoje, onSetExcecao, usuarioRank, usuarioAPI, niveis,
  onAddDoc, onDeleteDoc, fileCache, loadFile, saveArquivo, onViewImage, modulo, onAbrirModulo, avisosSilenciados = false, onAlternarSilencio }) {
  const [erroObra, setErroObra] = useState("");
  const [erroPresenca, setErroPresenca] = useState("");
  const [transferindo, setTransferindo] = useState(false);
  const [novoResponsavel, setNovoResponsavel] = useState("");
  const { etapas, equipe, ferramentas, materiais, observacoes, documentos } = obraDetalhe;
  const etapasObraCount = etapas.length;
  const etapasObraDone = etapas.filter((e) => e.concluida).length;
  const responsavelAtual = equipe.find((m) => m.usuario_id === obra.responsavel_id);
  // Nível efetivo NESTA obra: o da tela de Permissões, recortado pelo bloqueio que o responsável da obra definiu.
  const meuMembro = equipe.find((m) => m.usuario_id === usuarioAPI?.id);
  const nivelDoModulo = (key) => {
    const base = niveis?.[key] || "nenhum";
    const exc = meuMembro?.excecao_modulos?.[key];
    if (exc && ORDEM_NIVEL[exc] < ORDEM_NIVEL[base]) return exc;
    return base;
  };
  const souChefe = usuarioRank <= 2;

  const cycleEstado = async () => {
    setErroObra("");
    const order = ["ativa", "pausada", "concluida"];
    try { await onChangeEstado(obra.id, order[(order.indexOf(obra.estado) + 1) % order.length]); }
    catch (err) { setErroObra(err.message); }
  };

  const excluir = async () => {
    setErroObra("");
    try { await onDeleteObra(obra.id); }
    catch (err) { setErroObra(err.message); }
  };

  const transferir = async () => {
    if (!novoResponsavel) return;
    setErroObra("");
    try {
      await onTransferirObra(obra.id, Number(novoResponsavel));
      setTransferindo(false);
      setNovoResponsavel("");
    } catch (err) { setErroObra(err.message); }
  };

  const contagens = {
    etapas: etapasObraCount > 0 ? `${etapasObraDone}/${etapasObraCount}` : null,
    equipe: equipe.length || null,
    documentos: documentos.length || null,
    ferramentas: ferramentas.length || null,
    materiais: materiais.length || null,
    observacoes: observacoes.length || null,
  };

  if (modulo) {
    const mod = MODULOS_OBRA.find((m) => m.key === modulo);
    const podeEditar = nivelDoModulo(modulo) === "editar";
    return (
      <div>
        <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mb-4 flex flex-wrap items-center gap-2"><img src={mod.icone} alt="" className="w-8 h-8 rounded-full object-cover" draggable="false" /> {mod.label}<AjudaModulo modulo={modulo} /></h2>
        {modulo === "documentos" && <PedidosPanel obraId={obra.id} tipo="documento" tipoLabel="Documentos" equipe={equipe} usuarioAPI={usuarioAPI} nivel={nivelDoModulo("documentos")} />}
        {modulo === "documentos" && <DocumentosSection obraId={obra.id} documentos={documentos} onAdd={onAddDoc} onDelete={onDeleteDoc} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={onViewImage} podeEditar={podeEditar} />}
        {modulo === "equipe" && <EquipeSection obraId={obra.id} equipe={equipe} onAdd={onAddEquipo} onRemove={onRemoveEquipo} onToggleHoje={onToggleHoje} onSetExcecao={onSetExcecao} usuarioRank={usuarioRank} usuarioId={usuarioAPI?.id} usuarioNome={usuarioAPI?.nome} donoPrincipal={!!usuarioAPI?.dono_principal} responsavelId={obra.responsavel_id} podeEditar={podeEditar} />}
        {modulo === "etapas" && <EtapasSection obraId={obra.id} etapas={etapas} onAdd={onAddEtapa} onToggle={onToggleEtapa} onRemove={onRemoveEtapa} onEditEtapa={onEditEtapa} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={onViewImage} onAddFoto={onAddFotoEtapa} onDeleteFoto={onDeleteFotoEtapa} podeEditar={podeEditar} />}
        {modulo === "ferramentas" && <PedidosPanel obraId={obra.id} tipo="ferramenta" tipoLabel="Ferramentas" equipe={equipe} usuarioAPI={usuarioAPI} nivel={nivelDoModulo("ferramentas")} />}
        {modulo === "ferramentas" && <ListaSimplesSection items={ferramentas} onAdd={onAddFerramenta} onDelete={onDeleteFerramenta} placeholder="Ex: furadeira, andaime..." color={C.steel} glyph="🔧" datalistId="hist-ferramentas" podeEditar={podeEditar}  textoSemEdicao={nivelDoModulo("ferramentas") === "receber" ? "Você pode pedir e confirmar o que recebeu (Pedidos, acima). Registrar itens na lista é com o Almoxarife ou os chefes." : undefined} />}
        {modulo === "materiais" && <PedidosPanel obraId={obra.id} tipo="material" tipoLabel="Materiais" equipe={equipe} usuarioAPI={usuarioAPI} nivel={nivelDoModulo("materiais")} />}
        {modulo === "materiais" && <ListaSimplesSection items={materiais} onAdd={onAddMaterial} onDelete={onDeleteMaterial} placeholder="Ex: 10 sacos de cimento..." color={C.amber} glyph="📦" datalistId="hist-materiais" podeEditar={podeEditar}  textoSemEdicao={nivelDoModulo("materiais") === "receber" ? "Você pode pedir e confirmar o que recebeu (Pedidos, acima). Registrar itens na lista é com o Almoxarife ou os chefes." : undefined} />}
        {modulo === "observacoes" && (
          <div style={{ background: C.surface, borderColor: C.border }} className="border rounded-md p-4 mb-4">
            <div className="flex items-center justify-between flex-wrap gap-2">
              <p style={{ color: C.inkMuted }} className="text-xs font-mono">
                👤 Responsável: <span style={{ color: C.ink }}>{responsavelAtual ? `${responsavelAtual.nome} (${RANK_LABELS[responsavelAtual.rank]})` : "—"}</span>
              </p>
              {souChefe && <button onClick={() => setTransferindo(!transferindo)} style={{ color: C.blue }} className="text-xs font-mono uppercase">🔄 Transferir</button>}
            </div>
            {transferindo && (
              <div className="flex gap-2 mt-2">
                <select value={novoResponsavel} onChange={(e) => setNovoResponsavel(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="flex-1 min-w-0 border rounded px-2 py-1.5 text-xs outline-none bg-white">
                  <option value="">Escolha o novo responsável...</option>
                  {equipe.filter((m) => !m.removido_em).map((m) => <option key={m.usuario_id} value={m.usuario_id}>{m.nome} ({RANK_LABELS[m.rank]})</option>)}
                </select>
                <button onClick={transferir} disabled={!novoResponsavel} style={{ background: C.blue }} className="text-white text-xs font-bold uppercase rounded px-3 disabled:opacity-40 shrink-0">Confirmar</button>
              </div>
            )}
            {souChefe && <button onClick={excluir} style={{ color: C.rust }} className="mt-4 text-xs font-mono">🗑 excluir obra</button>}
            {erroObra && <p style={{ color: C.rust }} className="text-xs font-mono mt-2">{erroObra}</p>}
          </div>
        )}
        {modulo === "observacoes" && <ObservacoesSection items={observacoes} onAdd={onAddObservacao} onDelete={onDeleteObservacao} onEdit={onEditObservacao} usuarioAPI={usuarioAPI} podeEditar={podeEditar} />}
      </div>
    );
  }

  return (
    <div>
      <div className="relative -mx-4 -mt-4 mb-3">
        <img src="arquivero_completo_16.webp" alt="" className="w-full h-auto block" draggable="false" style={{ aspectRatio: "1048 / 1797" }} />

        {/* ===== POSICIONAMENTO DO TEXTO SOBRE O ARCHIVERO =====
            Imagem fonte: arquivero_completo_16.webp, 1048×1797px exatos (ver aspectRatio acima).
            % (não px fixo) DE PROPÓSITO: container é w-full/h-auto, escala com a tela do aparelho.
            Margem de contorno = 25% da largura/altura DA PRÓPRIA FOLHA (não da imagem toda) —
            dobrada em relação à versão anterior, pra sobrar espaço visível de forma inequívoca.

            HOJA 1 — borda da folha medida (%): left=1.9% top=4.9% right=44.8% bottom=35.0%
                     (largura=42.9% altura=30.1%) → margem 25%: ~10.7% horizontal, ~7.5% vertical
                     caixa de texto final: left=13% top=12% width=24%
            HOJA 2 — borda da folha medida (%): left=59.7% top=17.0% right=83.1% bottom=34.1%
                     (largura=23.4% altura=17.1%) → margem 25%: ~5.9% horizontal, ~4.3% vertical
                     caixa de texto final: left=66% top=22% width=12%
            Rotação com transformOrigin "top left" (pivota do canto declarado, não do centro). */}
        <div className="absolute" style={{ left: "13%", top: "12%", width: "24%", transform: "rotate(-3deg)", transformOrigin: "top left" }}>
          <p style={{ color: "#4A4640" }} className="text-[11px] font-bold font-mono uppercase tracking-wide">{obra.tipo || "Obra"}{obra.data_inicio ? ` · desde ${fmt(obra.data_inicio)}` : ""}</p>
          <h2 style={{ color: "#1A1815", display: "-webkit-box", WebkitLineClamp: 3, WebkitBoxOrient: "vertical", overflow: "hidden" }} className="text-lg font-extrabold leading-tight mt-1">{obra.cliente}</h2>
          <p style={{ color: "#3D3934", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }} className="text-xs font-bold mt-1">{obra.endereco}</p>
        </div>

        <div className="absolute" style={{ left: "66%", top: "22%", width: "12%", transform: "rotate(-2deg)", transformOrigin: "top left" }}>
          <p style={{ color: "#4A4640" }} className="text-[9px] font-bold font-mono uppercase tracking-wide">Responsável</p>
          <p style={{ color: "#1A1815", display: "-webkit-box", WebkitLineClamp: 3, WebkitBoxOrient: "vertical", overflow: "hidden" }} className="text-xs font-extrabold leading-tight mt-1">{responsavelAtual ? responsavelAtual.nome : "—"}</p>
        </div>

        {/* Selo de status, ENORME, bem visível */}
        <div className="absolute" style={{ right: "3%", top: "1%", width: "42%" }}>
          <StampBadge estado={obra.estado} onClick={cycleEstado} enorme />
        </div>

        {/* Botões invisíveis sobre cada caixa do archivero — a imagem já tem mascote + texto */}
        <div className="absolute grid grid-cols-2" style={{ left: 0, right: 0, top: "37%", bottom: 0, gridTemplateRows: "repeat(3, 1fr)" }}>
          {/* Um botão por gaveta, SEMPRE na posição do desenho. Sem acesso → gaveta "trancada" (escurecida, com cadeado). */}
          {MODULOS_OBRA.map((m) => {
            const liberado = nivelDoModulo(m.key) !== "nenhum";
            return liberado ? (
              <button key={m.key} onClick={() => onAbrirModulo(m.key)} className="relative active:bg-black/10 transition">
                {contagens[m.key] != null && <div style={{ background: "rgba(0,0,0,0.75)" }} className="absolute top-2 right-4 text-white text-[11px] font-extrabold rounded-full min-w-[22px] h-[22px] px-1 flex items-center justify-center shadow">{contagens[m.key]}</div>}
              </button>
            ) : (
              <button key={m.key} disabled title="Sem acesso a esta gaveta" aria-label={`${m.label}: sem acesso`} style={{ background: "rgba(20,18,15,0.62)" }} className="relative flex items-center justify-center cursor-not-allowed">
                <span className="text-2xl opacity-90">🔒</span>
              </button>
            );
          })}
        </div>
      </div>
      {/* Presença do dia: cada um marca a sua, mesmo sem acesso ao cajón Equipe (decisão 03/10). */}
      {meuMembro && (() => {
        const hojeP = todayISO();
        const presente = (meuMembro.asistencias || []).includes(hojeP);
        return (
          <div className="mt-3">
            <button onClick={async () => { setErroPresenca(""); try { await onToggleHoje(meuMembro.id, hojeP); } catch (err) { setErroPresenca(err.message); } }}
              style={{ background: presente ? C.green : C.surface, borderColor: presente ? C.green : C.border, color: presente ? "#fff" : C.ink }}
              className="w-full border-2 rounded-md py-3 font-bold uppercase tracking-wide text-sm">
              {presente ? "✓ Minha presença de hoje está marcada" : "✋ Marcar minha presença hoje"}
            </button>
            {erroPresenca && <p style={{ color: C.rust }} className="text-xs font-mono mt-1 text-center">{erroPresenca}</p>}
          </div>
        );
      })()}
      {onAlternarSilencio && (
        <button onClick={() => onAlternarSilencio().catch(() => {})} style={{ borderColor: C.border, color: avisosSilenciados ? C.inkMuted : C.ink }} className="w-full mt-2 border rounded-md py-2 text-xs font-mono uppercase">
          {avisosSilenciados ? "🔕 Avisos desta obra: silenciados (toque para ligar)" : "🔔 Avisos desta obra: ligados (toque para silenciar)"}
        </button>
      )}
    </div>
  );
}

function ReportView({ obras, onBack }) {
  const [loading, setLoading] = useState(true);
  const [reportText, setReportText] = useState("");
  const [copied, setCopied] = useState(false);
  const cutoff = todayISO();
  const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);

  useEffect(() => {
    (async () => {
      setLoading(true);
      const lines = [`*RELATÓRIO SEMANAL — GESTÃO & CONTROLE*`, `${fmt(weekAgo)} a ${fmt(cutoff)}`, ""];
      let totalPendentes = 0;
      const blocos = [];
      for (const obra of obras) {
        try {
          const [etR, feR, maR, obR] = await Promise.all([
            apiFetch(`/api/etapas?obra_id=${obra.id}`),
            apiFetch(`/api/ferramentas?obra_id=${obra.id}`),
            apiFetch(`/api/materiais?obra_id=${obra.id}`),
            apiFetch(`/api/observacoes?obra_id=${obra.id}`),
          ]);
          const etapas = etR.etapas, ferramentas = feR.ferramentas, materiais = maR.materiais, observacoes = obR.observacoes;
          const pendentes = etapas.filter((e) => !e.concluida);
          totalPendentes += pendentes.length;
          const doneCount = etapas.filter((e) => e.concluida).length;
          const concluidasRecentes = etapas.filter((e) => e.concluida && e.concluida_em >= weekAgo);
          const ferRecent = ferramentas.filter((f) => f.criado_em >= weekAgo);
          const matRecent = materiais.filter((m) => m.criado_em >= weekAgo);
          const obsRecent = observacoes.filter((o) => o.criado_em >= weekAgo);
          if (etapas.length === 0 && ferRecent.length === 0 && matRecent.length === 0 && obsRecent.length === 0) continue;
          const bloco = [`*${obra.cliente}* (${ESTADOS[obra.estado].label}) — ${obra.endereco}`];
          if (etapas.length > 0) bloco.push(`  Etapas: ${doneCount}/${etapas.length} concluídas`);
          concluidasRecentes.forEach((e) => bloco.push(`  • [Concluída] ${e.texto}`));
          ferRecent.forEach((f) => bloco.push(`  • [Ferramenta] ${f.texto}`));
          matRecent.forEach((m) => bloco.push(`  • [Material] ${m.texto}`));
          obsRecent.forEach((o) => bloco.push(`  • [Observação] ${o.texto}`));
          blocos.push(bloco.join("\n"));
        } catch (e) {}
      }
      if (totalPendentes > 0) lines.push(`*⚠ ETAPAS PENDENTES (${totalPendentes})*`, "");
      lines.push(...blocos.map((b) => b + "\n"));
      if (blocos.length === 0 && totalPendentes === 0) lines.push("Sem novidades registradas essa semana.");
      setReportText(lines.join("\n"));
      setLoading(false);
    })();
  }, [obras]);

  const copy = async () => { try { await navigator.clipboard.writeText(reportText); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) {} };
  const openWhatsapp = () => window.open(`https://wa.me/?text=${encodeURIComponent(reportText)}`, "_blank");
  const openEmail = () => { const subject = encodeURIComponent(`Relatório semanal — ${fmt(weekAgo)} a ${fmt(cutoff)}`); const body = encodeURIComponent(reportText.replace(/\*/g, "")); window.location.href = `mailto:?subject=${subject}&body=${body}`; };

  return (
    <div>
      <h2 style={{ color: C.ink }} className="text-xl font-extrabold uppercase tracking-wide mb-1">Relatório semanal</h2>
      <p style={{ color: C.inkMuted }} className="text-sm font-mono mb-4">{fmt(weekAgo)} — {fmt(cutoff)}</p>
      {loading ? (
        <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-12">Carregando...</p>
      ) : (
        <>
          <pre style={{ background: C.surface, borderColor: C.border, color: C.ink }} className="border rounded-md p-4 text-sm whitespace-pre-wrap font-sans leading-relaxed mb-4">{reportText}</pre>
          <div className="flex flex-wrap gap-2">
            <button onClick={openWhatsapp} style={{ background: C.green }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">💬 WhatsApp</button>
            <button onClick={openEmail} style={{ background: C.blue }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">✉ Email</button>
            <button onClick={copy} style={{ borderColor: C.border, color: C.ink }} className="border font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">{copied ? "✓ Copiado" : "⧉ Copiar"}</button>
          </div>
        </>
      )}
    </div>
  );
}

// Reparte cada letra con una animación tipo "carta servida por el crupier", en cascada.
// 15 caracteres totales (GESTÃO=6 + &=1 + CONTROLE=8) repartidos en 1 segundo -> ~66.7ms entre letra y letra.
function DealText({ text, startIndex, color, fontSize }) {
  return text.split("").map((ch, i) => (
    <span key={i} className="deal-letter gc-3d" style={{ fontSize, animationDelay: `${1000 + (startIndex + i) * (1000 / 15)}ms` }}>
      {ch === " " ? "\u00A0" : ch}
    </span>
  ));
}

function CadastroScreen({ onIrLogin, onCadastrado }) {
  const [confirmar, setConfirmar] = useState(null);
  const [email, setEmail] = useState("");
  const [nome, setNome] = useState("");
  const [senha, setSenha] = useState("");
  const [senha2, setSenha2] = useState("");
  const [aceito, setAceito] = useState(false);
  const [tsToken, setTsToken] = useState("");
  const [tsChave, setTsChave] = useState(0);
  const [erro, setErro] = useState("");
  const [salvando, setSalvando] = useState(false);

  const cadastrar = async () => {
    setErro("");
    if (!email.trim() || !nome.trim()) { setErro("Preencha nome e email."); return; }
    if (senha.length < 8) { setErro("A senha precisa ter ao menos 8 caracteres."); return; }
    if (senha !== senha2) { setErro("As senhas não coincidem."); return; }
    if (!aceito) { setErro("Você precisa aceitar os Termos de Uso."); return; }
    setSalvando(true);
    try {
      if (!tsToken) { setErro("Aguarde a verificação \"não sou um robô\" terminar."); setSalvando(false); return; }
      const r = await apiSignup(email.trim(), senha, nome.trim(), aceito, tsToken);
      if (r.token) { saveSession(r); onCadastrado(); }
      else setConfirmar({ email: r.email || email.trim().toLowerCase(), enviado: r.enviado !== false });
    } catch (err) {
      setErro(err.message);
      setTsChave((k) => k + 1); // o token do Turnstile vale uma vez só: refaz a verificação
    }
    setSalvando(false);
  };

  if (confirmar) return <ConfirmeEmailAviso email={confirmar.email} enviado={confirmar.enviado} onIrLogin={onIrLogin} />;

  return (
    <AuthWrap>
      <LogoTitulo />
      <p style={{ color: C.inkMuted }} className="text-xs font-mono text-center mb-5">Criar conta</p>
      <a href="/api/auth/google" aria-label="Entrar com Google" className="block mb-4 active:opacity-80">
        <img src="google-login.png" alt="Entrar com Google" className="mx-auto h-14 w-auto" draggable="false" />
      </a>
      <div className="flex items-center gap-2 mb-4">
        <div style={{ borderColor: C.border }} className="flex-1 border-t" />
        <span style={{ color: C.inkMuted }} className="text-[11px] font-mono">ou com email</span>
        <div style={{ borderColor: C.border }} className="flex-1 border-t" />
      </div>
      <div className="space-y-3">
        <div>
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Nome</label>
          <input value={nome} onChange={(e) => setNome(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" placeholder="Seu nome" autoFocus />
        </div>
        <div>
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Email</label>
          <input value={email} onChange={(e) => setEmail(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" placeholder="voce@exemplo.com" />
        </div>
        <div>
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Senha</label>
          <input type="password" value={senha} onChange={(e) => setSenha(e.target.value)} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" placeholder="Mínimo 8 caracteres" />
        </div>
        <div>
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">Confirmar senha</label>
          <input type="password" value={senha2} onChange={(e) => setSenha2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && cadastrar()} style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-2 mt-1 outline-none" />
        </div>
        <label className="flex items-start gap-2 text-xs" style={{ color: C.inkMuted }}>
          <input type="checkbox" checked={aceito} onChange={(e) => setAceito(e.target.checked)} className="mt-0.5" />
          <span>Tenho 18 anos ou mais, li e aceito os <a href="/termos" target="_blank" rel="noopener" style={{ color: C.amber }} className="underline">Termos de Uso</a> e a <a href="/privacidade" target="_blank" rel="noopener" style={{ color: C.amber }} className="underline">Política de Privacidade</a>.</span>
        </label>
        <Turnstile onToken={setTsToken} chave={tsChave} />
        {erro && <p style={{ color: C.rust }} className="text-xs font-mono">{erro}</p>}
      </div>
      <button onClick={cadastrar} disabled={salvando} style={{ background: C.amber }} className="w-full mt-5 text-white font-bold uppercase tracking-wide rounded py-2.5 disabled:opacity-50">{salvando ? "Criando..." : "Criar conta"}</button>
      <button onClick={onIrLogin} style={{ color: C.inkMuted }} className="w-full text-xs font-mono uppercase mt-3">Já tenho conta — entrar</button>
    </AuthWrap>
  );
}

function LoginScreen({ onLogado, onIrCadastro }) {
  const [semConfirmar, setSemConfirmar] = useState(null);
  const [pedeTs, setPedeTs] = useState(false);
  const [tsToken, setTsToken] = useState("");
  const [tsChave, setTsChave] = useState(0);
  const [esqueciAberto, setEsqueciAberto] = useState(false);
  const [emailEsqueci, setEmailEsqueci] = useState("");
  const [msgEsqueci, setMsgEsqueci] = useState("");
  const [erroEsqueci, setErroEsqueci] = useState("");
  const [enviandoEsqueci, setEnviandoEsqueci] = useState(false);
  const [modo, setModo] = useState(() => { try { return localStorage.getItem("gc-login-modo") || "email"; } catch (e) { return "email"; } });
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [cpf, setCpf] = useState("");
  const [pin, setPin] = useState("");
  const [erro, setErro] = useState("");
  const [entrando, setEntrando] = useState(false);

  const trocarModo = (m) => { setModo(m); setErro(""); try { localStorage.setItem("gc-login-modo", m); } catch (e) {} };

  const entrar = async () => {
    setErro("");
    setEntrando(true);
    try {
      if (pedeTs && !tsToken) { setErro("Aguarde a verificação \"não sou um robô\" e toque em Entrar de novo."); setEntrando(false); return; }
      const authData = await apiLogin(email.trim(), senha, tsToken || undefined);
      saveSession(authData);
      onLogado();
    } catch (err) {
      if (err.codigo === "email_nao_confirmado") { setSemConfirmar(email.trim().toLowerCase()); setEntrando(false); return; }
      if (err.codigo === "turnstile") setPedeTs(true);
      if (pedeTs || err.codigo === "turnstile") setTsChave((k) => k + 1);
      setErro(err.message);
    }
    setEntrando(false);
  };

  const abrirEsqueci = () => { setEmailEsqueci(email.trim()); setMsgEsqueci(""); setErroEsqueci(""); setEsqueciAberto(true); };
  const enviarEsqueci = async () => {
    setErroEsqueci(""); setMsgEsqueci("");
    if (!/^\S+@\S+\.\S+$/.test(emailEsqueci.trim())) { setErroEsqueci("Digite um e-mail válido."); return; }
    setEnviandoEsqueci(true);
    try { const r = await apiPublica("/api/auth/esqueci-senha", { email: emailEsqueci.trim() }); setMsgEsqueci((r.mensagem || "") + " O link vale 1 hora."); }
    catch (err) { setErroEsqueci(err.message); }
    setEnviandoEsqueci(false);
  };

  if (semConfirmar) return <ConfirmeEmailAviso email={semConfirmar} onIrLogin={() => setSemConfirmar(null)} />;

  const entrarCpf = async () => {
    setErro("");
    if (!cpfValido(cpf)) { setErro("CPF inválido. Confira os números."); return; }
    if (!/^\d{4}$/.test(pin)) { setErro("O PIN tem 4 números."); return; }
    setEntrando(true);
    try {
      if (pedeTs && !tsToken) { setErro("Aguarde a verificação \"não sou um robô\" e toque em Entrar de novo."); setEntrando(false); return; }
      const authData = await apiPublica("/api/auth/login-cpf", { cpf: limparCpf(cpf), pin, turnstile: tsToken || undefined });
      saveSession(authData);
      onLogado();
    } catch (err) {
      if (err.codigo === "turnstile") setPedeTs(true);
      if (pedeTs || err.codigo === "turnstile") setTsChave((k) => k + 1);
      setErro(err.message);
    }
    setEntrando(false);
  };

  const abaEstilo = (ativa) => ({ background: ativa ? C.ink : "transparent", color: ativa ? "#fff" : C.inkMuted, borderColor: C.ink });

  if (modo === "cpf") {
    return (
      <AuthWrap>
        <LogoTitulo />
        <p style={{ color: C.inkMuted }} className="text-xs font-mono text-center mb-4">Entrar</p>
        <div className="flex mb-4">
          <button onClick={() => trocarModo("cpf")} style={abaEstilo(true)} className="flex-1 border rounded-l py-2 text-xs font-bold uppercase">CPF + PIN</button>
          <button onClick={() => trocarModo("email")} style={abaEstilo(false)} className="flex-1 border rounded-r py-2 text-xs font-bold uppercase">Email / Google</button>
        </div>
        <div>
          <label style={{ color: C.inkMuted }} className="text-xs font-mono uppercase">CPF</label>
          <input value={cpf} onChange={(e) => setCpf(formatarCpf(e.target.value))} inputMode="numeric" placeholder="000.000.000-00" style={{ borderColor: C.border, color: C.ink }} className="w-full border rounded px-3 py-3 mt-1 outline-none text-lg tracking-wider" autoFocus />
        </div>

  useEffect(() => {
    apiPublica(`/api/convite-info?token=${encodeURIComponent(token)}`)
      .then(setInfo)
      .catch((e) => setErroLink(e.message));
  }, [token]);

  const confirmar = async () => {
    setErro("");
    if (!cpfValido(cpf)) { setErro("CPF inválido. Confira os números."); return; }
    if (!/^\d{4}$/.test(pin)) { setErro("O PIN precisa ter 4 números."); return; }

function TrancaBiometricaScreen({ onDesbloqueado, onUsarSenha }) {
  const [erro, setErro] = useState("");

  const desbloquear = async () => {
    setErro("");
    try {
      const credId = localStorage.getItem("biometria-credential-id");
      await navigator.credentials.get({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials: credId ? [{ id: base64urlToBuf(credId), type: "public-key" }] : [],
          userVerification: "required",
          timeout: 60000,
        },
      });
      onDesbloqueado();
    } catch (err) {
      console.error(err);
      setErro("Não foi possível validar.");
    }
  };

  useEffect(() => { desbloquear(); }, []);

  return (
    <AuthWrap>
      <div className="text-center mb-5">
        <LogoTitulo />
        <p style={{ color: C.inkMuted }} className="text-xs font-mono mt-1">Toque para continuar</p>
      </div>
      <button onClick={desbloquear} style={{ background: C.ink }} className="w-full text-white font-bold uppercase tracking-wide rounded py-2.5 mb-2">🔒 Usar digital / PIN</button>
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono text-center mb-2">{erro}</p>}
      <button onClick={onUsarSenha} style={{ color: C.inkMuted }} className="w-full text-xs font-mono uppercase py-2">Sair e entrar de novo com senha</button>
    </AuthWrap>
  );
}

function GestorObras() {
  const [view, setView] = useState("dashboard");
  const [modulo, setModulo] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [showModal, setShowModal] = useState(false);
