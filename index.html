<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#D98E04" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Gestão & Controle</title>
<!-- Bibliotecas em versão FIXA, servidas pelo próprio G&C (nada de unpkg/cdn). Ver src/build/LEIAME.md
     D2 (10/11/2026): nenhum código JavaScript escrito dentro desta página (a CSP proíbe). O app vem
     pronto em app.js (gerado de src/app/app.jsx); React carrega no FIM do <body> para o splash aparecer na hora. -->
<link rel="preload" href="vendor/fonts/bangers.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="vendor/tailwind.css" />
<style>
  /* Fontes servidas pelo próprio G&C (antes vinham do Google e apareciam trocadas por um instante). */
  @font-face { font-family: 'Bangers'; font-style: normal; font-weight: 400; font-display: block; src: url(vendor/fonts/bangers.woff2) format('woff2'); }
  @font-face { font-family: 'Special Elite'; font-style: normal; font-weight: 400; font-display: swap; src: url(vendor/fonts/special-elite.woff2) format('woff2'); }
  html, body { margin:0; padding:0; background:#EDEAE1; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
  * { box-sizing: border-box; }
  body { font-family: 'Special Elite', ui-monospace, monospace; }
  .font-comic { font-family: 'Bangers', cursive; letter-spacing: 0.03em; }
  /* Letra de gibi "3D": amarelo → vermelho, contorno preto e sombra preta deslocada. */
  .gc-3d {
    display: inline-block;
    background: linear-gradient(180deg, #FFEA00 0%, #FFA000 48%, #E52800 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent !important;
    -webkit-text-stroke: 1.5px #141210;
    filter: drop-shadow(1px 1px 0 #141210) drop-shadow(2px 2px 0 #141210);
    padding: 0 0.04em;
  }
  @keyframes logoPop {
    0% { transform: scale(0.2); opacity: 0; }
    60% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .logo-pop { animation: logoPop 0.7s cubic-bezier(0.34,1.56,0.64,1) both; border-radius: 9999px; position: relative; }
  @keyframes blinkFade {
    0%, 92%, 100% { opacity: 0; }
    94%, 97% { opacity: 1; }
  }
  .logo-blink-img { animation: blinkFade 3.5s infinite; }

  /* Splash: el logo aparece grande y el título crece por debajo, empujando el conjunto hacia arriba. */
  @keyframes splashTitleGrow {
    0% { max-height: 0; margin-top: 0; }
    100% { max-height: 240px; margin-top: 18px; }
  }
  .splash-title-wrap {
    max-height: 0;
    overflow: visible; /* as letras grandes "no ar" não podem ser cortadas */
    padding: 0 10px 6px;
    text-align: center;
    line-height: 1.12;
    animation: splashTitleGrow 0.9s ease-out 1s forwards;
  }
  /* Splash estático (HTML puro): aparece no mesmo instante em que o app abre e some quando o app está pronto. */
  #gc-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; background: #EDEAE1; transition: opacity 0.3s ease; }
  .gc-tema-escuro #gc-splash { background: #1C1B19; }
  #gc-splash.saindo { opacity: 0; pointer-events: none; }

  /* Letras que CAEN sobre el papel (la pantalla): cada una arranca cerca del lector — grande y casi
     transparente — y se aleja hasta apoyarse en su lugar, 100% opaca, con un pequeño rebote al tocar. */
  @keyframes dealLetter {
    0%   { transform: scale(3.4); opacity: 0; }   /* esperando a vez: invisível */
    6%   { transform: scale(3.2); opacity: 0.2; } /* aparece no ar, pouco opaca */
    65%  { transform: scale(0.9);  opacity: 1; }
    82%  { transform: scale(1.04); opacity: 1; }
    100% { transform: scale(1);    opacity: 1; }
  }
  .deal-letter {
    display: inline-block;
    opacity: 0;
    animation-name: dealLetter;
    animation-duration: 0.45s;
    animation-timing-function: cubic-bezier(0.25, 0.8, 0.35, 1);
    animation-fill-mode: both;
  }
  .splash-letra { font-size: min(56px, 14vw); }

  /* Barrita de carga estilo Windows XP: aparece en el segundo 2, en loop */
  .xp-loader-wrap {
    position: absolute;
    bottom: 56px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 0.2s ease 2s forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
  .xp-loader-track {
    width: 160px;
    height: 12px;
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    background: #ffffff;
    border: 1px solid #b8b8b8;
  }
  .xp-loader-bar {
    position: absolute;
    top: 1px;
    bottom: 1px;
    width: 38%;
    border-radius: 2px;
    background: linear-gradient(90deg, #1b5fa8, #6fb2f0, #1b5fa8);
    animation: xpSlide 1.1s linear 2s infinite;
  }
  @keyframes xpSlide {
    0% { left: -40%; }
    100% { left: 100%; }
  }
  /* Tamanho da letra (Config → Tamanho da letra). --fs vem do aparelho (localStorage "gc-fonte").
     Escala o texto em rem (Tailwind) e também os tamanhos fixos em px. */
  html { font-size: calc(16px * var(--fs, 1.12)); }
  .text-\[9px\] { font-size: calc(9px * var(--fs, 1.12)) !important; }
  .text-\[10px\] { font-size: calc(10px * var(--fs, 1.12)) !important; }
  .text-\[11px\] { font-size: calc(11px * var(--fs, 1.12)) !important; }
</style>
<style>
  /* Barra "INSTALAR APLICATIVO": vermelho ↔ laranja, sem parar. */
  .gc-barra-instalar { background: linear-gradient(90deg, #C62828, #EF6C00, #F57C00, #C62828); background-size: 300% 100%; animation: gcBarraCor 4s linear infinite; }
  @keyframes gcBarraCor { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
</style>
<script src="inicio.js"></script>
</head>
<body>
<div id="gc-splash" aria-hidden="true">
  <div class="logo-pop" style="width:min(280px,72vw);height:min(280px,72vw)">
    <img src="logo.png" alt="" style="width:100%;height:100%;position:absolute;inset:0" />
    <img src="logo-blink.png" alt="" class="logo-blink-img" style="width:100%;height:100%;position:absolute;inset:0" />
  </div>
  <div class="splash-title-wrap font-comic">
    <div><span class="deal-letter splash-letra" style="animation-delay:1000ms"><span class="gc-3d">G</span></span><span class="deal-letter splash-letra" style="animation-delay:1067ms"><span class="gc-3d">E</span></span><span class="deal-letter splash-letra" style="animation-delay:1133ms"><span class="gc-3d">S</span></span><span class="deal-letter splash-letra" style="animation-delay:1200ms"><span class="gc-3d">T</span></span><span class="deal-letter splash-letra" style="animation-delay:1267ms"><span class="gc-3d">Ã</span></span><span class="deal-letter splash-letra" style="animation-delay:1333ms"><span class="gc-3d">O</span></span></div>
    <div><span class="deal-letter splash-letra" style="animation-delay:1400ms"><span class="gc-3d">&amp;</span></span></div>
    <div><span class="deal-letter splash-letra" style="animation-delay:1467ms"><span class="gc-3d">C</span></span><span class="deal-letter splash-letra" style="animation-delay:1533ms"><span class="gc-3d">O</span></span><span class="deal-letter splash-letra" style="animation-delay:1600ms"><span class="gc-3d">N</span></span><span class="deal-letter splash-letra" style="animation-delay:1667ms"><span class="gc-3d">T</span></span><span class="deal-letter splash-letra" style="animation-delay:1733ms"><span class="gc-3d">R</span></span><span class="deal-letter splash-letra" style="animation-delay:1800ms"><span class="gc-3d">O</span></span><span class="deal-letter splash-letra" style="animation-delay:1867ms"><span class="gc-3d">L</span></span><span class="deal-letter splash-letra" style="animation-delay:1933ms"><span class="gc-3d">E</span></span></div>
  </div>
  <div class="xp-loader-wrap"><div class="xp-loader-track"><div class="xp-loader-bar"></div></div></div>
</div>
<div id="root"></div>
<script src="carregar.js" data-app="app.js?v=64a7449d1409"></script>
</body>
</html>
