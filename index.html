      <p style={{ color: C.inkMuted }} className="text-xs text-center mt-2 mb-4">Para usar o aplicativo, leia e aceite os documentos abaixo.</p>
      <label className="flex items-start gap-2 text-xs" style={{ color: C.inkMuted }}>
        <input type="checkbox" checked={aceito} onChange={(e) => setAceito(e.target.checked)} className="mt-0.5" />
        <span>Tenho 18 anos ou mais, li e aceito os <a href="/termos" target="_blank" rel="noopener" style={{ color: C.amber }} className="underline">Termos de Uso</a> e a <a href="/privacidade" target="_blank" rel="noopener" style={{ color: C.amber }} className="underline">Política de Privacidade</a>.</span>
      </label>
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono mt-2">{erro}</p>}
      <button onClick={aceitar} disabled={salvando} style={{ background: C.amber }} className="w-full mt-4 text-white font-bold uppercase tracking-wide rounded py-2.5 disabled:opacity-50">{salvando ? "..." : "Aceitar e continuar"}</button>
      <button onClick={onSair} style={{ color: C.inkMuted }} className="w-full text-xs font-mono uppercase mt-3">Não reconheço / sair</button>
    </AuthWrap>
  );
}

function TrancaBiometricaScreen({ onDesbloqueado, onUsarSenha }) {
  const [erro, setErro] = useState("");

  const desbloquear = async () => {
    setErro("");
    try {
      const credId = localStorage.getItem("biometria-credential-id");
      await navigator.credentials.get({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials: credId ? [{ id: base64urlToBuf(credId), type: "public-key" }] : [],
          userVerification: "required",
          timeout: 60000,
        },
      });
      onDesbloqueado();
    } catch (err) {
      console.error(err);
      setErro("Não foi possível validar.");
    }
  };

  useEffect(() => { desbloquear(); }, []);

  return (
    <AuthWrap>
      <div className="text-center mb-5">
        <LogoTitulo />
        <p style={{ color: C.inkMuted }} className="text-xs font-mono mt-1">Toque para continuar</p>
      </div>
      <button onClick={desbloquear} style={{ background: C.ink }} className="w-full text-white font-bold uppercase tracking-wide rounded py-2.5 mb-2">🔒 Usar digital / PIN</button>
      {erro && <p style={{ color: C.rust }} className="text-xs font-mono text-center mb-2">{erro}</p>}
      <button onClick={onUsarSenha} style={{ color: C.inkMuted }} className="w-full text-xs font-mono uppercase py-2">Sair e entrar de novo com senha</button>
    </AuthWrap>
  );
}

function ConfigurarBiometriaScreen({ onFeito }) {
  const configurar = async () => {
    try {
      const cred = await navigator.credentials.create({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          rp: { name: "Gestão & Controle" },
          user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "usuario", displayName: "usuario" },
          pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
          authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
          timeout: 60000,
        },
      });
      localStorage.setItem("biometria-credential-id", bufToBase64url(cred.rawId));
    } catch (err) {
      console.error(err);
    }
    onFeito();
  };

  return (
    <AuthWrap>
      <div className="text-center mb-4">
        <span className="text-3xl">🔒</span>
        <h2 style={{ color: C.ink }} className="text-lg font-extrabold uppercase tracking-wide mt-2">Tranca rápida</h2>
      </div>
      <p style={{ color: C.inkMuted }} className="text-sm mb-4 text-center">Quer usar sua digital, PIN ou padrão do celular para abrir o app mais rápido da próxima vez?</p>
      <button onClick={configurar} style={{ background: C.amber }} className="w-full text-white font-bold uppercase tracking-wide rounded py-2.5 mb-2">Configurar agora</button>
      <button onClick={onFeito} style={{ color: C.inkMuted }} className="w-full text-xs font-mono uppercase py-2">Pular por enquanto</button>
    </AuthWrap>
  );
}

function GestorObras() {
  const [view, setView] = useState("dashboard");
  const [modulo, setModulo] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [showModal, setShowModal] = useState(false);
  const [editandoObra, setEditandoObra] = useState(null);
  const [equipeParaEditar, setEquipeParaEditar] = useState([]);
  const [fileCache, setFileCache] = useState({});
  const [lightboxImg, setLightboxImg] = useState(null);
  const [temaEscuro, setTemaEscuro] = useState(false);

  const [sessionLoading, setSessionLoading] = useState(true);
  const [temSessao, setTemSessao] = useState(false);
  const [usuarioAPI, setUsuarioAPI] = useState(null);
  const [authView, setAuthView] = useState("login");
  const [conviteToken, setConviteToken] = useState(() => { try { return new URLSearchParams(window.location.search).get("convite"); } catch (e) { return null; } });
  const sairDoConvite = () => {
    window.history.replaceState(window.history.state, "", "/"); // tira o ?convite= da URL
    setConviteToken(null);
  };
  const [biometriaConfigurada, setBiometriaConfigurada] = useState(false);
  const [biometriaPassada, setBiometriaPassada] = useState(false);
  const [configurandoBiometria, setConfigurandoBiometria] = useState(false);

  const [obras, setObras] = useState([]);
  const [obrasLoading, setObrasLoading] = useState(false);
  const [pendentesPorObra, setPendentesPorObra] = useState({});
  const [obraDetalhe, setObraDetalhe] = useState(null);
  const [notificacoes, setNotificacoes] = useState([]);
  const obraDetalheRef = useRef(null);
  const fotosVistasRef = useRef(new Set());
  useEffect(() => { obraDetalheRef.current = obraDetalhe; }, [obraDetalhe]);

  const notificar = (mensagens) => {
    const novas = mensagens.map((texto) => ({ id: uid(), texto }));
    setNotificacoes((prev) => [...prev, ...novas]);
    novas.forEach((n) => setTimeout(() => setNotificacoes((prev) => prev.filter((x) => x.id !== n.id)), 6000));
  };
  const [obraDetalheLoading, setObraDetalheLoading] = useState(false);
  const [erroGlobal, setErroGlobal] = useState("");
  const [showConfig, setShowConfig] = useState(false);
  const [showDefinirSenha, setShowDefinirSenha] = useState(false);
  const [showMeuPin, setShowMeuPin] = useState(false);
  const [termosVigente, setTermosVigente] = useState(null);
  const [meusNiveis, setMeusNiveis] = useState(null);
  const [fazendoBackup, setFazendoBackup] = useState(false);
  const navRestauradaRef = useRef(false);
  const [sairAberto, setSairAberto] = useState(false);
  const [sairFalhou, setSairFalhou] = useState(false);
  // Histórico do navegador: cada entrada guarda seu "nivel".
  //   -1 = base (voltar daqui sai do app)   0 = guarda do dashboard   1+ = obra / módulo / telas
  // Capturado no primeiro render, antes de qualquer efeito mexer no histórico.
  const arranqueFrioRef = useRef(typeof window.history.state?.nivel !== "number");
  const empurrarHistorico = (extra = {}) => {
    const n = (window.history.state?.nivel ?? 0) + 1;
    window.history.pushState({ ...extra, nivel: n }, "");
  };
  // Volta o histórico até a guarda do dashboard (quando se vai ao dashboard por um botão, não pelo "voltar").
  const recuarAteDashboard = () => {
    const n = window.history.state?.nivel ?? 0;
    if (n > 0) window.history.go(-n);
  };

  const carregarUsuarioAPI = async () => {
    const token = await getValidAccessToken();
    if (!token) { setTemSessao(false); setUsuarioAPI(null); return; }
    setTemSessao(true);
    try {
      const res = await fetch("/api/usuarios-me", { headers: { authorization: `Bearer ${token}` } });
      const dataRes = await res.json();
      if (dataRes.ok) { setUsuarioAPI(dataRes.usuario); setTermosVigente(dataRes.termos_vigente || null); }
      else { clearSession(); setTemSessao(false); }
    } catch (e) {
      // sem rede: mantemos a sessão, só não temos os dados do servidor por enquanto
    }
  };

  useEffect(() => {
    (async () => {
      await carregarUsuarioAPI();
      setSessionLoading(false);

      setBiometriaConfigurada(!!localStorage.getItem("biometria-credential-id"));

      try {
        const res = await window.storage.get("tema");
        setTemaEscuro(res ? res.value === "escuro" : false);
      } catch (e) {}
    })();
  }, []);

  useEffect(() => {
         if (!navRestauradaRef.current) return;
    try {
      if (view === "dashboard") localStorage.removeItem("gc-nav");
      else localStorage.setItem("gc-nav", JSON.stringify({ view, selectedId, modulo }));
    } catch (e) {}
  }, [view, selectedId, modulo]);

  const carregarPendentes = async (lista) => {
    const mapa = {};
    await Promise.all(lista.map(async (o) => {
      try {
        const r = await apiFetch(`/api/etapas?obra_id=${o.id}`);
        mapa[o.id] = r.etapas.filter((e) => !e.concluida).length;
      } catch (e) { mapa[o.id] = 0; }
    }));
    setPendentesPorObra(mapa);
  };

  const restaurarNavegacao = (listaObras) => {
    try {
      const saved = JSON.parse(localStorage.getItem("gc-nav") || "null");
      if (!saved) return;
      // App aberta do zero (não F5): o histórico está vazio e o "voltar" do Android sairia do app.
      // Nesse caso criamos as entradas que faltam. No F5 o navegador já as conserva.
      const arranqueFrio = arranqueFrioRef.current;
      if (saved.view === "obra" && saved.selectedId && listaObras.some((o) => o.id === saved.selectedId)) {
        abrirObra(saved.selectedId, { pushHistory: arranqueFrio, moduloInicial: saved.modulo || null });
        if (arranqueFrio && saved.modulo) empurrarHistorico({ gcModulo: true });
      } else if (["pendientes", "report", "permissoes", "leads", "ajuda"].includes(saved.view)) {
        setView(saved.view);
        if (arranqueFrio) empurrarHistorico({ gcView: saved.view });
      }
    } catch (e) {}
  };

  const carregarObras = async () => {
    setObrasLoading(true);
    setErroGlobal("");
    try {
      const r = await apiFetch("/api/obras");
      setObras(r.obras);
      carregarPendentes(r.obras);
      if (!navRestauradaRef.current) {
        navRestauradaRef.current = true;
        restaurarNavegacao(r.obras);
      }
    } catch (err) {
      setErroGlobal(err.message);
    }
    setObrasLoading(false);
  };

  const carregarNiveis = async (usuario) => {
    try {
      const r = await apiFetch("/api/permissoes");
      const meus = {};
      r.permissoes.filter((p) => p.rank === usuario.rank).forEach((p) => { meus[p.modulo] = p.nivel; });
      setMeusNiveis(meus);
    } catch (e) {
      setMeusNiveis({});
    }
  };

  useEffect(() => { if (usuarioAPI) { carregarObras(); carregarNiveis(usuarioAPI); } }, [usuarioAPI]);

  const aoLogar = async () => {
    setBiometriaPassada(true);
    await carregarUsuarioAPI();
    if (!localStorage.getItem("biometria-credential-id") && biometriaSuportada()) {
      setConfigurandoBiometria(true);
    }
  };

  const excluirMinhaConta = async () => {
    const r = window.prompt("Excluir sua conta? Você não vai mais conseguir entrar e seus dados pessoais (nome, e-mail, CPF, telefone) serão apagados. O que você registrou nas obras fica, assinado como «Usuário removido». Digite EXCLUIR para confirmar.");
    if (r !== "EXCLUIR") return;
    try {
      await apiFetch("/api/usuarios-me", { method: "DELETE" });
      setShowConfig(false);
      sair();
    } catch (err) { window.alert(err.message); }
  };

  const sair = () => {
    clearSession();
    setTemSessao(false);
    setUsuarioAPI(null);
    setBiometriaPassada(false);
    setObras([]);
    setObraDetalhe(null);
  };

  const alternarTema = () => {
    const novo = !temaEscuro;
    setTemaEscuro(novo);
    window.storage.set("tema", novo ? "escuro" : "claro").catch(() => {});
  };

  const temaVars = useMemo(() => {
    const p = temaEscuro ? TEMA_ESCURO : TEMA_CLARO;
    return {
      "--c-bg": p.bg, "--c-surface": p.surface, "--c-ink": p.ink, "--c-inkMuted": p.inkMuted,
      "--c-border": p.border, "--c-amber": p.amber, "--c-blue": p.blue, "--c-rust": p.rust,
      "--c-green": p.green, "--c-steel": p.steel, "--c-teal": p.teal,
      background: p.bg, minHeight: "100vh", colorScheme: temaEscuro ? "dark" : "light",
    };
  }, [temaEscuro]);

  const saveArquivo = async (id, payload) => {
    try {
      const res = await fetch("/api/arquivo-set", {
        method: "POST",
        headers: { "content-type": "application/json", ...cabecalhoAuth() },
        body: JSON.stringify({ id, payload: JSON.stringify(payload) }),
      });
      const data = await res.json().catch(() => ({}));
      if (data.ok) {
        setFileCache((p) => ({ ...p, [id]: payload }));
        return true;
      }
      console.error("saveArquivo falhou:", res.status, data.error);
      return { erro: data.error || `Erro ${res.status}` };
    } catch (e) {
      console.error("saveArquivo exceção:", e);
      return { erro: e.message };
    }
  };
  const loadFile = async (id) => {
    if (fileCache[id]) return;
    try {
      const res = await fetch(`/api/arquivo-get?id=${encodeURIComponent(id)}`, {
        headers: cabecalhoAuth(),
      });
      if (res.status === 404) { setFileCache((p) => ({ ...p, [id]: "MISSING" })); return; }
      const data = await res.json();
      let f = "MISSING";
      try { if (data.ok) { const obj = JSON.parse(data.payload); if (arquivoSeguro(obj)) f = obj; } } catch (e) {}
      setFileCache((p) => ({ ...p, [id]: f }));
    } catch (e) {
      setFileCache((p) => ({ ...p, [id]: "MISSING" }));
    }
  };
  const deleteArquivoRemoto = (id) => {
    fetch(`/api/arquivo-delete?id=${encodeURIComponent(id)}`, {
      method: "DELETE",
      headers: cabecalhoAuth(),
    }).catch(() => {});
  };

  // --- Obras ---
  const criarObra = async (form) => {
    const r = await apiFetch("/api/obras", { method: "POST", body: JSON.stringify(form) });
    setObras((prev) => [r.obra, ...prev]);
    setShowModal(false);
  };

  const changeEstado = async (obraId, estado) => {
    const r = await apiFetch(`/api/obras?id=${obraId}`, { method: "PATCH", body: JSON.stringify({ estado }) });
    setObras((prev) => prev.map((o) => (o.id === obraId ? r.obra : o)));
  };

  const transferirObra = async (obraId, novoResponsavelId) => {
    const r = await apiFetch(`/api/obras?id=${obraId}`, { method: "PATCH", body: JSON.stringify({ novoResponsavelId }) });
    setObras((prev) => prev.map((o) => (o.id === obraId ? r.obra : o)));
  };

  const deleteObra = async (obraId) => {
    if (!window.confirm("Excluir esta obra? Essa ação não pode ser desfeita.")) return;
    await apiFetch(`/api/obras?id=${obraId}`, { method: "DELETE" });
    setObras((prev) => prev.filter((o) => o.id !== obraId));
    recuarAteDashboard();
    setView("dashboard");
  };

  const abrirEdicaoObra = async (obra) => {
    setEditandoObra(obra);
    try {
      const r = await apiFetch(`/api/equipe`);
      setEquipeParaEditar(r.equipe);
    } catch (e) {
      setEquipeParaEditar([]);
    }
  };

  const salvarEdicaoObra = async (dados) => {
    const r = await apiFetch(`/api/obras?id=${editandoObra.id}`, { method: "PATCH", body: JSON.stringify(dados) });
    setObras((prev) => prev.map((o) => (o.id === editandoObra.id ? r.obra : o)));
  };

  const backupForcado = async () => {
    setFazendoBackup(true);
    try {
      const pacote = { geradoEm: new Date().toISOString(), obras: [] };
      for (const obra of obras) {
        const [et, eq, fe, ma, ob, doc] = await Promise.all([
          apiFetch(`/api/etapas?obra_id=${obra.id}`).catch(() => ({ etapas: [] })),
          apiFetch(`/api/equipe?obra_id=${obra.id}`).catch(() => ({ equipe: [] })),
          apiFetch(`/api/ferramentas?obra_id=${obra.id}`).catch(() => ({ ferramentas: [] })),
          apiFetch(`/api/materiais?obra_id=${obra.id}`).catch(() => ({ materiais: [] })),
          apiFetch(`/api/observacoes?obra_id=${obra.id}`).catch(() => ({ observacoes: [] })),
          apiFetch(`/api/documentos?obra_id=${obra.id}`).catch(() => ({ documentos: [] })),
        ]);
        pacote.obras.push({
          obra, etapas: et.etapas, equipe: eq.equipe, ferramentas: fe.ferramentas,
          materiais: ma.materiais, observacoes: ob.observacoes, documentos: doc.documentos,
        });
      }
      const blob = new Blob([JSON.stringify(pacote, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `gc-backup-${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      setErroGlobal(err.message);
    }
    setFazendoBackup(false);
  };

  // --- Abrir una obra: carga todo lo de esa obra en paralelo ---
  const abrirObra = async (id, opts = {}) => {
    const { pushHistory = true, moduloInicial = null } = opts;
    setSelectedId(id);
    setView("obra");
    setModulo(moduloInicial);
    if (pushHistory) empurrarHistorico({ gcObra: true });
    setObraDetalhe(null);
    setObraDetalheLoading(true);
    try {
      const [et, eq, fe, ma, ob, doc, fo] = await Promise.all([
        apiFetch(`/api/etapas?obra_id=${id}`),
        apiFetch(`/api/equipe?obra_id=${id}`),
        apiFetch(`/api/ferramentas?obra_id=${id}`),
        apiFetch(`/api/materiais?obra_id=${id}`),
        apiFetch(`/api/observacoes?obra_id=${id}`),
        apiFetch(`/api/documentos?obra_id=${id}`),
        apiFetch(`/api/etapa-fotos?obra_id=${id}`),
      ]);
      setObraDetalhe({
        etapas: et.etapas, equipe: eq.equipe, ferramentas: fe.ferramentas,
        materiais: ma.materiais, observacoes: ob.observacoes, documentos: doc.documentos,
      });
      fotosVistasRef.current = new Set(fo.fotos.map((f) => f.id));
    } catch (err) {
      setErroGlobal(err.message);
    }
    setObraDetalheLoading(false);
  };

  const abrirModulo = (key) => {
    setModulo(key);
    empurrarHistorico({ gcModulo: true });
  };

  // Telas "de passagem" (Permissões, Leads, Pendências, Relatório): lembramos de onde se veio
  // para que o "voltar" devolva ao mesmo lugar (ex.: a gaveta de Equipe), e não ao dashboard.
  const pilhaViewsRef = useRef([]);
  const irParaView = (v) => {
    pilhaViewsRef.current.push(view);
    setView(v);
    empurrarHistorico({ gcView: v });
  };

  const voltarAoDashboard = () => {
    pilhaViewsRef.current = [];
    setView("dashboard");
    setModulo(null);
    if (selectedId) carregarPendentes(obras);
  };

  // --- Refresco automático cada 15s mientras se está viendo uma obra, com aviso de quem fez o quê ---
  useEffect(() => {
    if (view !== "obra" || !selectedId) return;
    const nomeDe = (equipeAtual, userId) => {
      if (userId === usuarioAPI?.id) return null; // não notifica a própria ação
      const m = equipeAtual.find((e) => e.usuario_id === userId);
      return m ? m.nome : "Alguém";
    };

    const interval = setInterval(async () => {
      const atual = obraDetalheRef.current;
      if (!atual) return;
      try {
        const [et, eq, fe, ma, ob, doc, fo] = await Promise.all([
          apiFetch(`/api/etapas?obra_id=${selectedId}`),
          apiFetch(`/api/equipe?obra_id=${selectedId}`),
          apiFetch(`/api/ferramentas?obra_id=${selectedId}`),
          apiFetch(`/api/materiais?obra_id=${selectedId}`),
          apiFetch(`/api/observacoes?obra_id=${selectedId}`),
          apiFetch(`/api/documentos?obra_id=${selectedId}`),
          apiFetch(`/api/etapa-fotos?obra_id=${selectedId}`),
        ]);

        const msgs = [];
        const idsAntigos = (lista) => new Set(lista.map((x) => x.id));

        et.etapas.filter((x) => !idsAntigos(atual.etapas).has(x.id)).forEach((x) => {
          const nome = nomeDe(eq.equipe, x.criado_por);
          if (nome) msgs.push(`${nome} adicionou a etapa "${x.texto}"`);
        });
        fe.ferramentas.filter((x) => !idsAntigos(atual.ferramentas).has(x.id)).forEach((x) => {
          const nome = nomeDe(eq.equipe, x.criado_por);
          if (nome) msgs.push(`${nome} adicionou a ferramenta "${x.texto}"`);
        });
        ma.materiais.filter((x) => !idsAntigos(atual.materiais).has(x.id)).forEach((x) => {
          const nome = nomeDe(eq.equipe, x.criado_por);
          if (nome) msgs.push(`${nome} adicionou o material "${x.texto}"`);
        });
        ob.observacoes.filter((x) => !idsAntigos(atual.observacoes).has(x.id)).forEach((x) => {
          const nome = nomeDe(eq.equipe, x.criado_por);
          if (nome) msgs.push(`${nome} adicionou uma observação: "${x.texto}"`);
        });
        doc.documentos.filter((x) => !idsAntigos(atual.documentos).has(x.id)).forEach((x) => {
          const nome = nomeDe(eq.equipe, x.criado_por);
          if (nome) msgs.push(`${nome} adicionou o documento "${x.nome}"`);
        });
        fo.fotos.filter((x) => !fotosVistasRef.current.has(x.id)).forEach((x) => {
          const nome = nomeDe(eq.equipe, x.criado_por);
          if (nome) msgs.push(`${nome} adicionou uma foto`);
        });
        fotosVistasRef.current = new Set(fo.fotos.map((x) => x.id));

        if (msgs.length) notificar(msgs);
        setObraDetalhe({
          etapas: et.etapas, equipe: eq.equipe, ferramentas: fe.ferramentas,
          materiais: ma.materiais, observacoes: ob.observacoes, documentos: doc.documentos,
        });
      } catch (e) { /* rede falhou nessa rodada, tenta de novo no próximo ciclo */ }
    }, 15000);

    return () => clearInterval(interval);
  }, [view, selectedId, usuarioAPI]);

  // Prepara o histórico: base (-1) + guarda do dashboard (0), para que o 1º "voltar" no dashboard não saia direto.
  useEffect(() => {
    if (typeof window.history.state?.nivel !== "number") window.history.replaceState({ nivel: -1 }, "");
    if (window.history.state.nivel === -1) window.history.pushState({ nivel: 0 }, "");
  }, []);

  const ficarNoApp = () => {
    window.history.pushState({ nivel: 0 }, "");
    setSairAberto(false);
  };
  const sairDoApp = () => {
    window.close();
    // Se o sistema não deixar fechar por código, pedimos o 2º "voltar".
    setTimeout(() => setSairFalhou(true), 300);
  };

  // Único ponto que escuta o botão/gesto nativo de voltar do Android.
  // Fecha primeiro o módulo aberto; se não há módulo, volta pro dashboard a partir de qualquer view.
  useEffect(() => {
    const onPopState = () => {
      if (view === "obra" && modulo) {
        setModulo(null);
      } else if (view !== "obra" && view !== "dashboard" && pilhaViewsRef.current.length) {
        // Saindo de uma tela de passagem: volta pra onde estava (obra + gaveta continuam carregadas)
        setView(pilhaViewsRef.current.pop());
      } else if (view !== "dashboard") {
        voltarAoDashboard();
      } else if (window.history.state?.nivel === -1) {
        // 1º "voltar" no dashboard: pergunta. Um 2º "voltar" (com o aviso aberto) sai do app.
        setSairFalhou(false);
        setSairAberto(true);
      }
    };
    window.addEventListener("popstate", onPopState);
    return () => window.removeEventListener("popstate", onPopState);
  }, [view, modulo, selectedId, obras]);

  // --- Etapas ---
  const addEtapa = async (parentId, texto) => {
    const r = await apiFetch("/api/etapas", { method: "POST", body: JSON.stringify({ obraId: selectedId, parentId, texto }) });
    setObraDetalhe((d) => ({ ...d, etapas: [...d.etapas, r.etapa] }));
  };
  const toggleEtapa = async (id, concluida) => {
    const r = await apiFetch(`/api/etapas?id=${id}`, { method: "PATCH", body: JSON.stringify({ concluida }) });
    setObraDetalhe((d) => ({ ...d, etapas: d.etapas.map((e) => (e.id === id ? r.etapa : e)) }));
  };
  const addFotoEtapa = async (etapaId, arquivoId) => {
    await apiFetch(`/api/etapa-fotos`, { method: "POST", body: JSON.stringify({ etapaId, arquivoId }) });
  };
  const deleteFotoEtapa = async (fotoRowId) => {
    await apiFetch(`/api/etapa-fotos?id=${fotoRowId}`, { method: "DELETE" });
  };
  const editEtapa = async (id, texto) => {
    const r = await apiFetch(`/api/etapas?id=${id}`, { method: "PATCH", body: JSON.stringify({ texto }) });
    setObraDetalhe((d) => ({ ...d, etapas: d.etapas.map((e) => (e.id === id ? r.etapa : e)) }));
  };
  const removeEtapa = async (id) => {
    await apiFetch(`/api/etapas?id=${id}`, { method: "DELETE" });
    // recarrega para reflejar la cascada (subetapas borradas junto con el padre)
    const r = await apiFetch(`/api/etapas?obra_id=${selectedId}`);
    setObraDetalhe((d) => ({ ...d, etapas: r.etapas }));
  };

  // --- Ferramentas / Materiais / Observações (mismo patrón para los 3) ---
  const criarListaHandlers = (recurso, campo) => ({
    add: async (texto) => {
      const r = await apiFetch(`/api/${recurso}`, { method: "POST", body: JSON.stringify({ obraId: selectedId, texto }) });
      setObraDetalhe((d) => ({ ...d, [campo]: [r.item, ...d[campo]] }));
    },
    del: async (id) => {
      await apiFetch(`/api/${recurso}?id=${id}`, { method: "DELETE" });
      setObraDetalhe((d) => ({ ...d, [campo]: d[campo].filter((x) => x.id !== id) }));
    },
  });
  const ferramentasH = criarListaHandlers("ferramentas", "ferramentas");
  const materiaisH = criarListaHandlers("materiais", "materiais");
  const observacoesH = criarListaHandlers("observacoes", "observacoes");
  const editarObservacao = async (id, texto) => {
    const r = await apiFetch(`/api/observacoes?id=${id}`, { method: "PATCH", body: JSON.stringify({ texto }) });
    setObraDetalhe((d) => ({ ...d, observacoes: d.observacoes.map((o) => (o.id === id ? r.item : o)) }));
  };

  // --- Equipe ---
  const addEquipo = async (payload) => {
    const r = await apiFetch("/api/equipe", { method: "POST", body: JSON.stringify(payload) });
    if (!r.convite) setObraDetalhe((d) => ({ ...d, equipe: [...d.equipe, r.equipe] }));
    return r;
  };
  const removeEquipo = async (id) => {
    await apiFetch(`/api/equipe?id=${id}`, { method: "DELETE" });
    setObraDetalhe((d) => ({ ...d, equipe: d.equipe.filter((m) => m.id !== id) }));
  };
  const toggleHoje = async (id, hoje) => {
    const r = await apiFetch(`/api/equipe?id=${id}`, { method: "PATCH", body: JSON.stringify({ data: hoje }) });
    setObraDetalhe((d) => ({ ...d, equipe: d.equipe.map((m) => (m.id === id ? r.equipe : m)) }));
  };
  // Edita integrante: { rank }, { funcao } e/ou { excecaoModulos }
  const setExcecao = async (id, campos) => {
    const r = await apiFetch(`/api/equipe?id=${id}`, { method: "PATCH", body: JSON.stringify(campos) });
    setObraDetalhe((d) => ({ ...d, equipe: d.equipe.map((m) => (m.id === id ? { ...m, ...r.membro } : m)) }));
  };

  // --- Documentos ---
  const addDoc = async (payload) => {
    const r = await apiFetch("/api/documentos", { method: "POST", body: JSON.stringify(payload) });
    setObraDetalhe((d) => ({ ...d, documentos: [r.documento, ...d.documentos] }));
  };
  const deleteDoc = async (id, arquivoId) => {
    await apiFetch(`/api/documentos?id=${id}`, { method: "DELETE" });
    if (arquivoId) deleteArquivoRemoto(arquivoId);
    setObraDetalhe((d) => ({ ...d, documentos: d.documentos.filter((x) => x.id !== id) }));
  };

  const selectedObra = obras.find((o) => o.id === selectedId);
  const totalPendientes = Object.values(pendentesPorObra).reduce((a, b) => a + b, 0);

  let content;
  if (conviteToken) {
    content = <ConviteScreen token={conviteToken} onEntrou={() => { sairDoConvite(); aoLogar(); }} onCancelar={sairDoConvite} />;
  } else if (sessionLoading) {
    content = <SplashScreen />;
  } else if (!temSessao) {
    content =
      authView === "cadastro" ? (
        <CadastroScreen onIrLogin={() => setAuthView("login")} onCadastrado={aoLogar} />
      ) : (
        <LoginScreen onLogado={aoLogar} onIrCadastro={() => setAuthView("cadastro")} />
      );
  } else if (configurandoBiometria) {
    content = <ConfigurarBiometriaScreen onFeito={() => { setConfigurandoBiometria(false); setBiometriaConfigurada(!!localStorage.getItem("biometria-credential-id")); }} />;
  } else if (biometriaConfigurada && !biometriaPassada) {
    content = <TrancaBiometricaScreen onDesbloqueado={() => setBiometriaPassada(true)} onUsarSenha={sair} />;
  } else if (!usuarioAPI) {
    content = <SplashScreen />;
  } else if (termosVigente && usuarioAPI.termos_versao !== termosVigente) {
    content = <AceiteTermosScreen usuario={usuarioAPI} onAceito={() => setUsuarioAPI((u) => ({ ...u, termos_versao: termosVigente }))} onSair={sair} />;
  } else {
    content = (
    <div className="p-4 pb-24">
      {view === "dashboard" && (
        <>
          <div className="flex items-start gap-3 mb-5 pt-2">
            <img src="logo.png" alt="G&C" className="w-14 h-14 rounded-full shrink-0" />
            <div className="flex-1 min-w-0">
              <div className="flex items-center justify-between gap-2">
                <span style={{ color: C.inkMuted }} className="text-[11px] font-mono truncate">{RANK_LABELS[usuarioAPI.rank] || ""}</span>
                <span style={{ color: C.inkMuted }} className="text-[11px] font-mono truncate">{usuarioAPI.nome}</span>
              </div>
              <h1 style={{ color: C.ink }} className="font-comic text-xl tracking-wide leading-tight mt-0.5">Gestão & Controle</h1>
            </div>
          </div>
          <BoasVindas usuarioAPI={usuarioAPI} onAbrirAjuda={() => irParaView("ajuda")} />
          <div className="flex flex-wrap gap-2 mb-4">
            {usuarioAPI.rank <= 4 && <button onClick={async () => { setShowModal(true); try { const r = await apiFetch(`/api/equipe`); setEquipeParaEditar(r.equipe); } catch (e) { setEquipeParaEditar([]); } }} style={{ background: C.amber }} className="text-white font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">+ Nova obra</button>}
            <button onClick={() => irParaView("pendientes")} style={{ background: totalPendientes > 0 ? C.rust : "transparent", borderColor: C.rust, color: totalPendientes > 0 ? "#fff" : C.rust }} className="border font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">● Pendências {totalPendientes > 0 && `(${totalPendientes})`}</button>
            <button onClick={() => irParaView("report")} style={{ borderColor: C.ink, color: C.ink }} className="border font-bold uppercase tracking-wide text-sm rounded px-4 py-2.5">📅 Relatório semanal</button>
          </div>
          {erroGlobal && <p style={{ color: C.rust }} className="text-xs font-mono mb-3">{erroGlobal}</p>}
          {obrasLoading ? (
            <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-16">Carregando...</p>
          ) : obras.length === 0 ? (
            <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-16">Nenhuma obra cadastrada. Comece com "Nova obra".</p>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {obras.map((obra) => (
                <TicketCard key={obra.id} obra={obra} pendCount={pendentesPorObra[obra.id] || 0} lastDate={null} onOpen={() => abrirObra(obra.id)} onEdit={usuarioAPI.rank <= 2 ? () => abrirEdicaoObra(obra) : null} onDelete={usuarioAPI.rank <= 2 ? () => deleteObra(obra.id) : null} />
              ))}
            </div>
          )}
        </>
      )}
      {view === "obra" && selectedObra && (
        obraDetalheLoading ? (
          <p style={{ color: C.inkMuted }} className="text-sm font-mono text-center py-16">Carregando...</p>
        ) : !obraDetalhe ? (
          <div className="text-center py-16">
            <p style={{ color: C.rust }} className="text-sm font-mono mb-3">{erroGlobal || "Não foi possível carregar a obra."}</p>
            <button onClick={() => abrirObra(selectedObra.id, { pushHistory: false })} style={{ background: C.amber }} className="text-white font-bold uppercase tracking-wide rounded px-4 py-2 text-sm">Tentar de novo</button>
          </div>
        ) : (
          <ObraDetail obra={selectedObra} obraDetalhe={obraDetalhe}
            onBack={() => { recuarAteDashboard(); voltarAoDashboard(); }} modulo={modulo} onAbrirModulo={abrirModulo}
            onChangeEstado={changeEstado} onDeleteObra={deleteObra} onTransferirObra={transferirObra}
            onAddEtapa={addEtapa} onToggleEtapa={toggleEtapa} onRemoveEtapa={removeEtapa} onEditEtapa={editEtapa} onAddFotoEtapa={addFotoEtapa} onDeleteFotoEtapa={deleteFotoEtapa}
            onAddFerramenta={ferramentasH.add} onDeleteFerramenta={ferramentasH.del}
            onAddMaterial={materiaisH.add} onDeleteMaterial={materiaisH.del}
            onAddObservacao={observacoesH.add} onDeleteObservacao={observacoesH.del} onEditObservacao={editarObservacao}
            onAddEquipo={addEquipo} onRemoveEquipo={removeEquipo} onToggleHoje={toggleHoje} onSetExcecao={setExcecao} usuarioRank={usuarioAPI.rank} usuarioAPI={usuarioAPI} niveis={meusNiveis}
            onAddDoc={addDoc} onDeleteDoc={deleteDoc} fileCache={fileCache} loadFile={loadFile} saveArquivo={saveArquivo} onViewImage={setLightboxImg} />
        )
      )}
      {view === "pendientes" && <PendientesView obras={obras} onBack={() => window.history.back()} onOpenObra={abrirObra} />}
      {view === "report" && <ReportView obras={obras} onBack={() => window.history.back()} />}
      {view === "permissoes" && <PermissoesScreen onBack={() => window.history.back()} usuarioRank={usuarioAPI.rank} />}
      {view === "leads" && <LeadsScreen onBack={() => window.history.back()} />}
      {view === "ajuda" && <AjudaScreen usuarioAPI={usuarioAPI} />}
      {showModal && <NuevaObraModal onClose={() => setShowModal(false)} onSave={criarObra} obras={obras} equipe={equipeParaEditar} />}
      {editandoObra && <EditarObraModal obra={editandoObra} equipe={equipeParaEditar} onClose={() => setEditandoObra(null)} onSave={salvarEdicaoObra} />}
      {lightboxImg && <Lightbox src={lightboxImg} onClose={() => setLightboxImg(null)} />}
    </div>
    );
    content = (
      <>
        {content}
        <BottomNav active={view === "dashboard" ? "inicio" : view === "ajuda" ? "ajuda" : ""} onAjuda={() => { if (view !== "ajuda") irParaView("ajuda"); }} onInicio={() => { recuarAteDashboard(); pilhaViewsRef.current = []; setView("dashboard"); setSelectedId(null); setObraDetalhe(null); }} onConfig={() => setShowConfig(true)} />
        {showConfig && <ConfigDrawer usuario={usuarioAPI} temaEscuro={temaEscuro} onAlternarTema={alternarTema} onSair={() => { setShowConfig(false); sair(); }} onExcluirConta={excluirMinhaConta} onAbrirMeuPin={() => { setShowConfig(false); setShowMeuPin(true); }} onClose={() => setShowConfig(false)} onAbrirPermissoes={() => { setShowConfig(false); irParaView("permissoes"); }} onAbrirLeads={() => { setShowConfig(false); irParaView("leads"); }} onAbrirDefinirSenha={() => { setShowConfig(false); setShowDefinirSenha(true); }} onBackupForcado={backupForcado} fazendoBackup={fazendoBackup} />}
        {showDefinirSenha && <DefinirSenhaModal usuario={usuarioAPI} onClose={() => { setShowDefinirSenha(false); carregarUsuarioAPI(); }} />}
        {showMeuPin && <MeuPinModal usuario={usuarioAPI} onClose={() => { setShowMeuPin(false); carregarUsuarioAPI(); }} />}
        <div className="fixed top-3 left-1/2 z-[100] flex flex-col gap-2 items-stretch px-4 w-full max-w-sm" style={{ transform: "translateX(-50%)" }}>
          {notificacoes.map((n) => (
            <div key={n.id} style={{ background: C.ink, color: "#fff" }} className="rounded-lg px-4 py-2.5 text-xs font-mono shadow-lg">🔔 {n.texto}</div>
          ))}
        </div>
      </>
    );
  }

  return (
    <div style={temaVars}>
      {content}
      {sairAberto && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-[200]">
          <div style={{ background: C.surface }} className="rounded-lg p-6 w-full max-w-sm shadow-xl">
            <h2 style={{ color: C.ink }} className="text-lg font-extrabold mb-2">Deseja sair do aplicativo?</h2>
            <p style={{ color: C.inkMuted }} className="text-sm mb-4">
              {sairFalhou ? "Toque em voltar mais uma vez para sair." : "Toque em voltar de novo para sair."}
            </p>
            <div className="flex gap-2">
              <button onClick={ficarNoApp} style={{ borderColor: C.border, color: C.ink }} className="flex-1 border font-bold uppercase tracking-wide text-sm rounded py-2.5">Não</button>
              <button onClick={sairDoApp} style={{ background: C.rust }} className="flex-1 text-white font-bold uppercase tracking-wide text-sm rounded py-2.5">Sim</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GestorObras />);
</script>
<script>
  // Compilamos manualmente forzando runtime clásico (React.createElement),
  // porque el runtime "automático" por default de Babel genera imports de
  // módulo ES que un <script> normal no puede ejecutar (pantalla en blanco).
  (function () {
    var src = document.getElementById("app-source").textContent;
    var out = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    var s = document.createElement("script");
    s.textContent = out;
    document.body.appendChild(s);
  })();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((e) => console.log("SW falhou:", e));
    });
  }
</script>
</body>
</html>
